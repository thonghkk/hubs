ịnh final (muốn kế thừa phải open ); val ≈ final; const val là hằng compile-time; companion object + @JvmStatic ≈ static."}, "Q4.6": {"title": "Kotlin vs Java? Vì sao dùng Kotlin? (tình huống: thuyết phục người dùng Java)", "weak": false, "freq": true, "loc": "<span class=\"lref\">L4</span>.", "answer": "<ul>\n<li><strong>Null safety</strong> ở mức type system, giảm NPE.</li>\n<li><strong>Coroutine:</strong> lập trình bất đồng bộ dạng tuần tự, nhẹ hơn thread.</li>\n<li>Code <strong>ngắn gọn</strong>: <code>data class</code>, type inference, smart cast, default/named arguments, string template.</li>\n<li><strong>Extension function</strong>, higher-order function, lambda.</li>\n<li><code>sealed class</code>, <code>when</code> exhaustive, <code>object</code>, delegation (<code>by lazy</code>, <code>by viewModels()</code>).</li>\n<li>Không có checked exception.</li>\n<li><strong>100% interop</strong> với Java.</li>\n</ul>\n<p><strong>Thuyết phục (tình huống \"anh dùng Java, thuyết phục anh dùng Kotlin\"):</strong></p>\n<blockquote>\n<p>\"Kotlin giảm crash NPE nhờ null safety ở compile time, code ngắn hơn khoảng 30–40% nên dễ review và bảo trì, coroutine giúp xử lý async đơn giản hơn callback. Google đã chọn <strong>Kotlin-first</strong> từ 2019, Jetpack Compose chỉ hỗ trợ Kotlin. Quan trọng nhất là <strong>interop 100%</strong>: không cần viết lại, có thể <strong>chuyển dần từng file mới</strong>, code Java cũ vẫn chạy bình thường.\"</p>\n</blockquote>", "answerNote": "khác biệt chính", "more": "", "moreNote": "", "related": "<p>Nhược điểm của Kotlin? (Build chậm hơn một chút, learning curve, có platform types khi gọi Java.)</p>", "text": "L4 . Null safety ở mức type system, giảm NPE. Coroutine: lập trình bất đồng bộ dạng tuần tự, nhẹ hơn thread. Code ngắn gọn : data class , type inference, smart cast, default/named arguments, string template. Extension function , higher-order function, lambda. sealed class , when exhaustive, object , delegation ( by lazy , by viewModels() ). Không có checked exception. 100% interop với Java. Thuyết phục (tình huống \"anh dùng Java, thuyết phục anh dùng Kotlin\"): \"Kotlin giảm crash NPE nhờ null safety ở compile time, code ngắn hơn khoảng 30–40% nên dễ review và bảo trì, coroutine giúp xử lý async đơn giản hơn callback. Google đã chọn Kotlin-first từ 2019, Jetpack Compose chỉ hỗ trợ Kotlin. Quan trọng nhất là interop 100% : không cần viết lại, có thể chuyển dần từng file mới , code Java cũ vẫn chạy bình thường.\" Nhược điểm của Kotlin? (Build chậm hơn một chút, learning curve, có platform types khi gọi Java.)"}, "Q4.7": {"title": "Null safety? Cách dùng? Java check null thế nào?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L4</span>.", "answer": "<p>Kotlin phân biệt kiểu <strong>non-null</strong> (<code>String</code>) và <strong>nullable</strong> (<code>String?</code>) ngay từ compile time.</p>\n<ul>\n<li><code>?.</code> safe call: <code>user?.name</code></li>\n<li><code>?:</code> Elvis: <code>name ?: \"Unknown\"</code></li>\n<li><code>!!</code>: ép non-null, nếu null thì ném NPE (hạn chế dùng)</li>\n<li><code>?.let { }</code>: thực thi khi khác null</li>\n<li><code>lateinit var</code> (non-null, khởi tạo sau), <code>by lazy</code></li>\n<li>Smart cast sau khi <code>if (x != null)</code></li>\n</ul>\n<p><strong>Java:</strong> <code>if (x != null)</code>, <code>Objects.requireNonNull()</code>, <code>Optional&lt;T&gt;</code> (Java 8), annotation <code>@Nullable/@NonNull</code> (để IDE và Kotlin nhận biết).</p>", "answerNote": "", "more": "<p>Gọi code Java từ Kotlin sẽ ra <strong>platform type</strong> (<code>String!</code>), compiler không kiểm tra được nên vẫn có thể NPE. Vì vậy nên thêm annotation <code>@Nullable/@NonNull</code> bên phía Java.</p>", "moreNote": "", "related": "", "text": "L4 . Kotlin phân biệt kiểu non-null ( String ) và nullable ( String? ) ngay từ compile time. ?. safe call: user?.name ?: Elvis: name ?: \"Unknown\" !! : ép non-null, nếu null thì ném NPE (hạn chế dùng) ?.let { } : thực thi khi khác null lateinit var (non-null, khởi tạo sau), by lazy Smart cast sau khi if (x != null) Java: if (x != null) , Objects.requireNonNull() , Optional<T> (Java 8), annotation @Nullable/@NonNull (để IDE và Kotlin nhận biết). Gọi code Java từ Kotlin sẽ ra platform type ( String! ), compiler không kiểm tra được nên vẫn có thể NPE. Vì vậy nên thêm annotation @Nullable/@NonNull bên phía Java."}, "Q4.8": {"title": "Extension function là gì?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L4</span> (Kotlin) → liên quan UML (<a class=\"qref\" href=\"#\" data-q=\"Q3.9\">Q3.9</a>).", "answer": "<p>Extension function cho phép <strong>thêm hàm mới cho một class có sẵn mà không cần kế thừa hay sửa source</strong>.</p>\n<pre class=\"code\" data-lang=\"kotlin\"><code>fun String.isEmail(): Boolean = Patterns.EMAIL_ADDRESS.matcher(this).matches()\n&quot;a@b.com&quot;.isEmail()</code></pre>\n<p>Bản chất là <strong>static method</strong> nhận receiver làm tham số đầu tiên, nên nó được <strong>resolve tĩnh</strong> (theo kiểu khai báo, không đa hình), <strong>không truy cập được <code>private</code></strong> của class, và nếu trùng tên với member function thì <strong>member thắng</strong>.</p>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L4 (Kotlin) → liên quan UML ( Q3.9 ). Extension function cho phép thêm hàm mới cho một class có sẵn mà không cần kế thừa hay sửa source . fun String.isEmail(): Boolean = Patterns.EMAIL_ADDRESS.matcher(this).matches() \"a@b.com\".isEmail() Bản chất là static method nhận receiver làm tham số đầu tiên, nên nó được resolve tĩnh (theo kiểu khai báo, không đa hình), không truy cập được private của class, và nếu trùng tên với member function thì member thắng ."}, "Q4.9": {"title": "suspend function là gì? So sánh với hàm thường?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L4</span> (Kotlin) → <span class=\"lref\">L5</span> (Concurrency).", "answer": "<p><code>suspend function</code> là hàm <strong>có thể tạm dừng (suspend) mà không block thread</strong>, rồi <strong>tiếp tục (resume)</strong> sau. Nó chỉ được gọi từ coroutine hoặc từ suspend function khác.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Hàm thường</th>\n<th>suspend function</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Khi chờ I/O</td>\n<td><strong>Block</strong> thread</td>\n<td><strong>Suspend</strong>: giải phóng thread cho việc khác</td>\n</tr>\n<tr>\n<td>Gọi từ đâu</td>\n<td>Bất kỳ đâu</td>\n<td>Coroutine / suspend function</td>\n</tr>\n<tr>\n<td>Bản chất compile</td>\n<td>Bình thường</td>\n<td>Thêm tham số ẩn <code>Continuation</code>, biến thành <strong>state machine</strong> (CPS)</td>\n</tr>\n</tbody>\n</table></div>", "answerNote": "", "more": "<ul>\n<li><code>suspend</code> <strong>không tự chuyển thread</strong>. Muốn chạy nền phải dùng <code>withContext(Dispatchers.IO)</code>.</li>\n<li>Điểm suspend (suspension point) là nơi gọi suspend function khác như <code>delay()</code>, <code>withContext()</code>, <code>await()</code>.</li>\n</ul>", "moreNote": "", "related": "", "text": "L4 (Kotlin) → L5 (Concurrency). suspend function là hàm có thể tạm dừng (suspend) mà không block thread , rồi tiếp tục (resume) sau. Nó chỉ được gọi từ coroutine hoặc từ suspend function khác. Hàm thường suspend function Khi chờ I/O Block thread Suspend : giải phóng thread cho việc khác Gọi từ đâu Bất kỳ đâu Coroutine / suspend function Bản chất compile Bình thường Thêm tham số ẩn Continuation , biến thành state machine (CPS) suspend không tự chuyển thread . Muốn chạy nền phải dùng withContext(Dispatchers.IO) . Điểm suspend (suspension point) là nơi gọi suspend function khác như delay() , withContext() , await() ."}, "Q4.10": {"title": "Coroutine có những scope nào?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L4</span>/<span class=\"lref\">L5</span>.", "answer": "<ul>\n<li><strong><code>GlobalScope</code>:</strong> sống theo cả app, <strong>không nên dùng</strong> (dễ leak, không có structured concurrency).</li>\n<li><strong><code>CoroutineScope(context)</code>:</strong> tự tạo, tự quản lý <code>cancel()</code>.</li>\n<li><strong><code>MainScope()</code>:</strong> <code>SupervisorJob + Dispatchers.Main</code>.</li>\n<li><strong>Android lifecycle scope:</strong> <code>lifecycleScope</code> (Activity/Fragment), <code>viewModelScope</code> (ViewModel), tự hủy khi lifecycle kết thúc.</li>\n<li><strong>Scope builder (suspend):</strong> <code>coroutineScope { }</code> (một con lỗi thì hủy tất cả), <code>supervisorScope { }</code> (con lỗi không ảnh hưởng con khác).</li>\n<li><code>runBlocking { }</code>: block thread hiện tại, chỉ dùng trong test/main.</li>\n</ul>", "answerNote": "", "more": "<ul>\n<li><strong>Dispatchers:</strong> <code>Main</code> (UI), <code>IO</code> (mạng, file, DB), <code>Default</code> (tính toán CPU), <code>Unconfined</code>.</li>\n<li><strong>Builders:</strong> <code>launch</code> (trả về <code>Job</code>, không có kết quả), <code>async</code> (trả về <code>Deferred&lt;T&gt;</code>, lấy kết quả bằng <code>await()</code>).</li>\n<li><strong>Structured concurrency:</strong> coroutine con gắn với scope cha; cha bị hủy thì con bị hủy theo, giúp tránh leak.</li>\n</ul>", "moreNote": "", "related": "", "text": "L4 / L5 . GlobalScope : sống theo cả app, không nên dùng (dễ leak, không có structured concurrency). CoroutineScope(context) : tự tạo, tự quản lý cancel() . MainScope() : SupervisorJob + Dispatchers.Main . Android lifecycle scope: lifecycleScope (Activity/Fragment), viewModelScope (ViewModel), tự hủy khi lifecycle kết thúc. Scope builder (suspend): coroutineScope { } (một con lỗi thì hủy tất cả), supervisorScope { } (con lỗi không ảnh hưởng con khác). runBlocking { } : block thread hiện tại, chỉ dùng trong test/main. Dispatchers: Main (UI), IO (mạng, file, DB), Default (tính toán CPU), Unconfined . Builders: launch (trả về Job , không có kết quả), async (trả về Deferred<T> , lấy kết quả bằng await() ). Structured concurrency: coroutine con gắn với scope cha; cha bị hủy thì con bị hủy theo, giúp tránh leak."}, "Q4.11": {"title": "Các loại exception trong Java?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L4</span> → xử lý lỗi trong thiết kế (<span class=\"lref\">L3</span>).", "answer": "<pre class=\"code\" data-lang=\"\"><code>Throwable\n├── Error → lỗi hệ thống, không nên catch: OutOfMemoryError, StackOverflowError\n└── Exception\n├── Checked → bắt buộc try-catch/throws: IOException, SQLException, InterruptedException\n└── RuntimeException → Unchecked: NullPointerException, IllegalArgumentException,\nIllegalStateException, IndexOutOfBoundsException,\nClassCastException, ConcurrentModificationException, ArithmeticException</code></pre>\n<ul>\n<li><strong>Checked:</strong> compiler bắt xử lý, thường là lỗi bên ngoài có thể phục hồi.</li>\n<li><strong>Unchecked:</strong> lỗi lập trình, nên sửa code thay vì catch.</li>\n</ul>", "answerNote": "", "more": "<p><code>try-with-resources</code> (Java 7) và <code>use { }</code> (Kotlin) để tự đóng tài nguyên. Kotlin <strong>không có checked exception</strong>. Trong coroutine dùng <code>CoroutineExceptionHandler</code>, <code>try/catch</code> quanh <code>await()</code>, <code>supervisorScope</code>.</p>", "moreNote": "", "related": "<p><code>finally</code> có luôn chạy không? (Gần như luôn, trừ <code>System.exit()</code> hoặc process bị kill.) <code>throw</code> vs <code>throws</code>? Custom exception?</p>", "text": "L4 → xử lý lỗi trong thiết kế ( L3 ). Throwable ├── Error → lỗi hệ thống, không nên catch: OutOfMemoryError, StackOverflowError └── Exception ├── Checked → bắt buộc try-catch/throws: IOException, SQLException, InterruptedException └── RuntimeException → Unchecked: NullPointerException, IllegalArgumentException, IllegalStateException, IndexOutOfBoundsException, ClassCastException, ConcurrentModificationException, ArithmeticException Checked: compiler bắt xử lý, thường là lỗi bên ngoài có thể phục hồi. Unchecked: lỗi lập trình, nên sửa code thay vì catch. try-with-resources (Java 7) và use { } (Kotlin) để tự đóng tài nguyên. Kotlin không có checked exception . Trong coroutine dùng CoroutineExceptionHandler , try/catch quanh await() , supervisorScope . finally có luôn chạy không? (Gần như luôn, trừ System.exit() hoặc process bị kill.) throw vs throws ? Custom exception?"}, "Q4b.1": {"title": "Array vs Collection? Array chỉ dùng với kiểu nguyên thủy?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L4b</span>.", "answer": "<p><strong>Không.</strong> Array chứa được <strong>cả kiểu nguyên thủy và object</strong> (<code>int[]</code>, <code>String[]</code>). Ngược lại, <strong>Collection chỉ chứa object</strong> (<code>List&lt;Integer&gt;</code>, có autoboxing).</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Array</th>\n<th>Collection (ArrayList...)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Kích thước</td>\n<td><strong>Cố định</strong></td>\n<td><strong>Động</strong></td>\n</tr>\n<tr>\n<td>Kiểu phần tử</td>\n<td>Primitive + Object</td>\n<td>Chỉ Object</td>\n</tr>\n<tr>\n<td>Hiệu năng</td>\n<td>Nhanh hơn, ít bộ nhớ</td>\n<td>Overhead boxing, object</td>\n</tr>\n<tr>\n<td>API</td>\n<td>Ít (<code>length</code>, <code>Arrays.</code>)</td>\n<td>Phong phú (add, remove, contains, stream...)</td>\n</tr>\n<tr>\n<td>Generic</td>\n<td>Không hỗ trợ tốt</td>\n<td>Có type-safety</td>\n</tr>\n</tbody>\n</table></div>", "answerNote": "", "more": "<p><code>Arrays</code> là class tiện ích cho array; <code>Collections</code> là class tiện ích cho Collection; còn <code>Collection</code> là interface gốc của List/Set/Queue. Kotlin có <code>IntArray</code> (primitive) khác với <code>Array&lt;Int&gt;</code> (boxed).</p>", "moreNote": "", "related": "", "text": "L4b . Không. Array chứa được cả kiểu nguyên thủy và object ( int[] , String[] ). Ngược lại, Collection chỉ chứa object ( List<Integer> , có autoboxing). Array Collection (ArrayList...) Kích thước Cố định Động Kiểu phần tử Primitive + Object Chỉ Object Hiệu năng Nhanh hơn, ít bộ nhớ Overhead boxing, object API Ít ( length , Arrays.* ) Phong phú (add, remove, contains, stream...) Generic Không hỗ trợ tốt Có type-safety Arrays là class tiện ích cho array; Collections là class tiện ích cho Collection; còn Collection là interface gốc của List/Set/Queue. Kotlin có IntArray (primitive) khác với Array<Int> (boxed)."}, "Q4b.2": {"title": "Bỏ 1 phần tử của array thì làm thế nào?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L4b</span>.", "answer": "<p>Array có kích thước cố định nên <strong>không xóa trực tiếp được</strong>. Có các cách:</p>\n<ol>\n<li><strong>Tạo array mới</strong> kích thước <code>n-1</code>, copy các phần tử trừ phần tử cần bỏ (<code>System.arraycopy</code>).</li>\n<li><strong>Dịch các phần tử phía sau lên</strong> một vị trí và đánh dấu phần cuối là không dùng (giống cách <code>ArrayList</code> làm bên trong).</li>\n<li><strong>Chuyển sang <code>ArrayList</code></strong> rồi <code>remove()</code>.</li>\n<li>Kotlin: <code>arr.filterIndexed { i, _ -&gt; i != idx }.toTypedArray()</code> hoặc <code>toMutableList().apply { removeAt(idx) }</code>.</li>\n</ol>\n<p>Độ phức tạp: <strong>O(n)</strong>.</p>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L4b . Array có kích thước cố định nên không xóa trực tiếp được . Có các cách: Tạo array mới kích thước n-1 , copy các phần tử trừ phần tử cần bỏ ( System.arraycopy ). Dịch các phần tử phía sau lên một vị trí và đánh dấu phần cuối là không dùng (giống cách ArrayList làm bên trong). Chuyển sang ArrayList rồi remove() . Kotlin: arr.filterIndexed { i, _ -> i != idx }.toTypedArray() hoặc toMutableList().apply { removeAt(idx) } . Độ phức tạp: O(n) ."}, "Q4b.3": {"title": "Các loại collection hay dùng?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L4b</span>.", "answer": "<ul>\n<li><strong>List</strong> (có thứ tự, cho phép trùng): <code>ArrayList</code>, <code>LinkedList</code>.</li>\n<li><strong>Set</strong> (không trùng): <code>HashSet</code> (không thứ tự), <code>LinkedHashSet</code> (giữ thứ tự chèn), <code>TreeSet</code> (sắp xếp).</li>\n<li><strong>Map</strong> (key-value): <code>HashMap</code>, <code>LinkedHashMap</code> (giữ thứ tự, dùng làm LRU cache), <code>TreeMap</code> (sắp xếp theo key).</li>\n<li><strong>Queue/Deque:</strong> <code>ArrayDeque</code>, <code>PriorityQueue</code>, <code>LinkedList</code>.</li>\n<li><strong>Thread-safe:</strong> <code>ConcurrentHashMap</code>, <code>CopyOnWriteArrayList</code>, <code>BlockingQueue</code>.</li>\n<li><strong>Android tối ưu bộ nhớ:</strong> <code>SparseArray</code> (key là int, không boxing), <code>ArrayMap</code>.</li>\n</ul>\n<p>Kotlin phân biệt <strong>read-only</strong> (<code>List</code>, <code>Map</code>) và <strong>mutable</strong> (<code>MutableList</code>, <code>MutableMap</code>).</p>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L4b . List (có thứ tự, cho phép trùng): ArrayList , LinkedList . Set (không trùng): HashSet (không thứ tự), LinkedHashSet (giữ thứ tự chèn), TreeSet (sắp xếp). Map (key-value): HashMap , LinkedHashMap (giữ thứ tự, dùng làm LRU cache), TreeMap (sắp xếp theo key). Queue/Deque: ArrayDeque , PriorityQueue , LinkedList . Thread-safe: ConcurrentHashMap , CopyOnWriteArrayList , BlockingQueue . Android tối ưu bộ nhớ: SparseArray (key là int, không boxing), ArrayMap . Kotlin phân biệt read-only ( List , Map ) và mutable ( MutableList , MutableMap )."}, "Q4b.4": {"title": "ArrayList vs LinkedList?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L4b</span>.", "answer": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Thao tác</th>\n<th>ArrayList (mảng động)</th>\n<th>LinkedList (danh sách liên kết đôi)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>get(i)</code></td>\n<td><strong>O(1)</strong></td>\n<td>O(n)</td>\n</tr>\n<tr>\n<td>Thêm/xóa ở cuối</td>\n<td>O(1) (amortized)</td>\n<td>O(1)</td>\n</tr>\n<tr>\n<td>Thêm/xóa ở giữa/đầu</td>\n<td>O(n) (phải dịch phần tử)</td>\n<td>O(1) nếu đã có node, nhưng <strong>tìm node mất O(n)</strong></td>\n</tr>\n<tr>\n<td>Bộ nhớ</td>\n<td>Ít hơn, cache-friendly</td>\n<td>Nhiều hơn (mỗi node có 2 con trỏ)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Kết luận:</strong> <strong>ArrayList dùng trong hầu hết trường hợp</strong> (đọc nhiều). LinkedList chỉ hợp khi thêm/xóa nhiều ở đầu (lúc đó <code>ArrayDeque</code> thường tốt hơn).</p>", "answerNote": "", "more": "<p>ArrayList khi đầy sẽ tăng dung lượng khoảng <strong>1.5 lần</strong> và copy sang mảng mới.</p>", "moreNote": "", "related": "", "text": "L4b . Thao tác ArrayList (mảng động) LinkedList (danh sách liên kết đôi) get(i) O(1) O(n) Thêm/xóa ở cuối O(1) (amortized) O(1) Thêm/xóa ở giữa/đầu O(n) (phải dịch phần tử) O(1) nếu đã có node, nhưng tìm node mất O(n) Bộ nhớ Ít hơn, cache-friendly Nhiều hơn (mỗi node có 2 con trỏ) Kết luận: ArrayList dùng trong hầu hết trường hợp (đọc nhiều). LinkedList chỉ hợp khi thêm/xóa nhiều ở đầu (lúc đó ArrayDeque thường tốt hơn). ArrayList khi đầy sẽ tăng dung lượng khoảng 1.5 lần và copy sang mảng mới."}, "Q4b.5": {"title": "HashMap vs Hashtable? Hashtable là gì?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L4b</span> → <span class=\"lref\">L5</span> (thread-safety).", "answer": "<p><strong>Hashtable</strong> là cấu trúc lưu key-value dựa trên <strong>hàm băm</strong>: <code>hashCode()</code> của key được dùng để tính vị trí bucket, nên tra cứu trung bình <strong>O(1)</strong>.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>HashMap</th>\n<th>Hashtable</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Thread-safe</td>\n<td>❌</td>\n<td>✅ (mọi method đều <code>synchronized</code>, nên chậm)</td>\n</tr>\n<tr>\n<td>null key/value</td>\n<td>Cho phép <strong>1 null key</strong>, nhiều null value</td>\n<td><strong>Không</strong> cho phép null</td>\n</tr>\n<tr>\n<td>Ra đời</td>\n<td>Java 1.2 (Collection Framework)</td>\n<td>Java 1.0 (legacy)</td>\n</tr>\n<tr>\n<td>Iterator</td>\n<td>Fail-fast <code>Iterator</code></td>\n<td><code>Enumerator</code> (không fail-fast)</td>\n</tr>\n</tbody>\n</table></div>\n<p>Cần thread-safe thì dùng <strong><code>ConcurrentHashMap</code></strong> (lock theo bucket/CAS, nhanh hơn nhiều), <strong>không dùng Hashtable</strong>.</p>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L4b → L5 (thread-safety). Hashtable là cấu trúc lưu key-value dựa trên hàm băm : hashCode() của key được dùng để tính vị trí bucket, nên tra cứu trung bình O(1) . HashMap Hashtable Thread-safe ❌ ✅ (mọi method đều synchronized , nên chậm) null key/value Cho phép 1 null key , nhiều null value Không cho phép null Ra đời Java 1.2 (Collection Framework) Java 1.0 (legacy) Iterator Fail-fast Iterator Enumerator (không fail-fast) Cần thread-safe thì dùng ConcurrentHashMap (lock theo bucket/CAS, nhanh hơn nhiều), không dùng Hashtable ."}, "Q4b.6": {"title": "Hai object có mã băm (hashCode) giống/khác nhau thì như thế nào? (Hash collision)", "weak": false, "freq": false, "loc": "<span class=\"lref\">L4b</span>.", "answer": "<p>Contract giữa <code>equals()</code> và <code>hashCode()</code>:</p>\n<ul>\n<li><code>a.equals(b) == true</code> thì <strong>bắt buộc</strong> <code>a.hashCode() == b.hashCode()</code>.</li>\n<li><strong>hashCode khác nhau</strong> thì chắc chắn <strong>2 object khác nhau</strong>, nằm ở 2 entry khác nhau trong map.</li>\n<li><strong>hashCode giống nhau</strong> thì <strong>chưa chắc bằng nhau</strong> (gọi là <strong>hash collision</strong>). HashMap đưa cả hai vào <strong>cùng bucket</strong>, rồi dùng <code>equals()</code> để phân biệt.</li>\n</ul>\n<p><strong>Xử lý collision trong HashMap (Java 8+):</strong> mỗi bucket là <strong>linked list</strong>. Khi một bucket có <strong>&gt; 8 phần tử</strong> (và capacity ≥ 64) thì chuyển thành <strong>Red-Black tree</strong>, giảm thời gian tìm từ O(n) xuống O(log n).</p>", "answerNote": "", "more": "<ul>\n<li>Override <code>equals()</code> mà <strong>không override <code>hashCode()</code></strong> thì HashMap/HashSet hoạt động sai (không tìm thấy key, set chứa phần tử trùng). Kotlin <code>data class</code> tự sinh cả hai.</li>\n<li><strong>Load factor</strong> mặc định 0.75: khi số phần tử &gt; capacity × 0.75 thì <strong>resize ×2</strong> và rehash.</li>\n</ul>", "moreNote": "", "related": "", "text": "L4b . Contract giữa equals() và hashCode() : a.equals(b) == true thì bắt buộc a.hashCode() == b.hashCode() . hashCode khác nhau thì chắc chắn 2 object khác nhau , nằm ở 2 entry khác nhau trong map. hashCode giống nhau thì chưa chắc bằng nhau (gọi là hash collision ). HashMap đưa cả hai vào cùng bucket , rồi dùng equals() để phân biệt. Xử lý collision trong HashMap (Java 8+): mỗi bucket là linked list . Khi một bucket có > 8 phần tử (và capacity ≥ 64) thì chuyển thành Red-Black tree , giảm thời gian tìm từ O(n) xuống O(log n). Override equals() mà không override hashCode() thì HashMap/HashSet hoạt động sai (không tìm thấy key, set chứa phần tử trùng). Kotlin data class tự sinh cả hai. Load factor mặc định 0.75: khi số phần tử > capacity × 0.75 thì resize ×2 và rehash."}, "Q4b.7": {"title": "Binary Search: độ phức tạp?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L4b</span>.", "answer": "<p>Tìm kiếm trên <strong>mảng đã sắp xếp</strong>: so sánh với phần tử giữa, loại bỏ một nửa sau mỗi bước.</p>\n<ul>\n<li>Thời gian: <strong>O(log n)</strong>. Bộ nhớ: O(1) nếu lặp, O(log n) nếu đệ quy.</li>\n<li>Điều kiện: dữ liệu <strong>đã sắp xếp</strong> và truy cập ngẫu nhiên được (array, không phải linked list).</li>\n</ul>\n<pre class=\"code\" data-lang=\"kotlin\"><code>fun binarySearch(a: IntArray, x: Int): Int {\nvar lo = 0; var hi = a.size - 1\nwhile (lo &lt;= hi) {\nval mid = lo + (hi - lo) / 2 // tránh tràn số so với (lo+hi)/2\nwhen {\na[mid] == x -&gt; return mid\na[mid] &lt; x -&gt; lo = mid + 1\nelse -&gt; hi = mid - 1\n}\n}\nreturn -1\n}</code></pre>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L4b . Tìm kiếm trên mảng đã sắp xếp : so sánh với phần tử giữa, loại bỏ một nửa sau mỗi bước. Thời gian: O(log n) . Bộ nhớ: O(1) nếu lặp, O(log n) nếu đệ quy. Điều kiện: dữ liệu đã sắp xếp và truy cập ngẫu nhiên được (array, không phải linked list). fun binarySearch(a: IntArray, x: Int): Int { var lo = 0; var hi = a.size - 1 while (lo <= hi) { val mid = lo + (hi - lo) / 2 // tránh tràn số so với (lo+hi)/2 when { a[mid] == x -> return mid a[mid] < x -> lo = mid + 1 else -> hi = mid - 1 } } return -1 }"}, "Q4b.8": {"title": "DFS vs BFS?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L4b</span>.", "answer": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>DFS (Depth First Search)</th>\n<th>BFS (Breadth First Search)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Cách duyệt</td>\n<td>Đi <strong>sâu</strong> hết một nhánh rồi quay lui</td>\n<td>Duyệt <strong>theo từng mức</strong> (lớp)</td>\n</tr>\n<tr>\n<td>Cấu trúc dữ liệu</td>\n<td><strong>Stack</strong> (hoặc đệ quy)</td>\n<td><strong>Queue</strong></td>\n</tr>\n<tr>\n<td>Độ phức tạp</td>\n<td>O(V + E)</td>\n<td>O(V + E)</td>\n</tr>\n<tr>\n<td>Ứng dụng</td>\n<td>Phát hiện chu trình, topological sort, duyệt cây thư mục, backtracking</td>\n<td><strong>Đường đi ngắn nhất trên đồ thị không trọng số</strong>, duyệt theo cấp</td>\n</tr>\n</tbody>\n</table></div>", "answerNote": "", "more": "<p>Ví dụ Android: duyệt cây View hierarchy (DFS) để tìm view theo id.</p>", "moreNote": "", "related": "", "text": "L4b . DFS (Depth First Search) BFS (Breadth First Search) Cách duyệt Đi sâu hết một nhánh rồi quay lui Duyệt theo từng mức (lớp) Cấu trúc dữ liệu Stack (hoặc đệ quy) Queue Độ phức tạp O(V + E) O(V + E) Ứng dụng Phát hiện chu trình, topological sort, duyệt cây thư mục, backtracking Đường đi ngắn nhất trên đồ thị không trọng số , duyệt theo cấp Ví dụ Android: duyệt cây View hierarchy (DFS) để tìm view theo id."}, "Q4b.9": {"title": "Quick Sort vs Merge Sort?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L4b</span>.", "answer": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Quick Sort</th>\n<th>Merge Sort</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ý tưởng</td>\n<td>Chọn <strong>pivot</strong>, chia thành phần nhỏ hơn / lớn hơn pivot, đệ quy</td>\n<td><strong>Chia đôi</strong>, sắp xếp từng nửa, <strong>trộn</strong> lại</td>\n</tr>\n<tr>\n<td>Trung bình</td>\n<td>O(n log n)</td>\n<td>O(n log n)</td>\n</tr>\n<tr>\n<td>Xấu nhất</td>\n<td><strong>O(n²)</strong> (pivot tệ, mảng đã sắp xếp)</td>\n<td><strong>O(n log n)</strong> luôn</td>\n</tr>\n<tr>\n<td>Bộ nhớ</td>\n<td>O(log n), in-place</td>\n<td><strong>O(n)</strong> thêm</td>\n</tr>\n<tr>\n<td>Stable</td>\n<td>❌</td>\n<td>✅</td>\n</tr>\n</tbody>\n</table></div>", "answerNote": "", "more": "<p>Java <code>Arrays.sort()</code> dùng <strong>Dual-Pivot QuickSort</strong> cho primitive (không cần stable) và <strong>TimSort</strong> (biến thể Merge + Insertion, stable) cho object.</p>", "moreNote": "", "related": "", "text": "L4b . Quick Sort Merge Sort Ý tưởng Chọn pivot , chia thành phần nhỏ hơn / lớn hơn pivot, đệ quy Chia đôi , sắp xếp từng nửa, trộn lại Trung bình O(n log n) O(n log n) Xấu nhất O(n²) (pivot tệ, mảng đã sắp xếp) O(n log n) luôn Bộ nhớ O(log n), in-place O(n) thêm Stable ❌ ✅ Java Arrays.sort() dùng Dual-Pivot QuickSort cho primitive (không cần stable) và TimSort (biến thể Merge + Insertion, stable) cho object."}, "Q5.1": {"title": "Thread pool là gì? ExecutorService vì sao hiệu suất cao?", "weak": true, "freq": false, "loc": "<span class=\"lref\">L5</span>.", "answer": "<p>Thread pool là <strong>tập các thread được tạo sẵn và tái sử dụng</strong> để thực thi nhiều task, thay vì mỗi task lại tạo một thread mới.\nExecutorService hiệu suất cao vì:</p>\n<ol>\n<li><strong>Tái sử dụng thread</strong>, tránh chi phí tạo/hủy thread (mỗi thread tốn khoảng 1MB stack và system call).</li>\n<li><strong>Giới hạn số thread</strong> chạy đồng thời, tránh cạn tài nguyên và context switch quá nhiều.</li>\n<li>Có <strong>hàng đợi task</strong>, tách việc <em>gửi task</em> khỏi việc <em>thực thi task</em>.</li>\n<li>Quản lý vòng đời và kết quả tiện lợi: <code>Future</code>, <code>invokeAll</code>, <code>shutdown()</code>.</li>\n</ol>", "answerNote": "", "more": "<ul>\n<li>Các loại: <code>newFixedThreadPool(n)</code>, <code>newCachedThreadPool()</code>, <code>newSingleThreadExecutor()</code>, <code>newScheduledThreadPool(n)</code>.</li>\n<li>Tham số <code>ThreadPoolExecutor</code>: <code>corePoolSize</code>, <code>maximumPoolSize</code>, <code>keepAliveTime</code>, <code>workQueue</code>, <code>RejectedExecutionHandler</code>.</li>\n<li>Chọn số thread: task <strong>CPU-bound</strong> khoảng <em>số core</em>; task <strong>I/O-bound</strong> có thể nhiều hơn.</li>\n<li>Coroutine <code>Dispatchers.IO/Default</code> thực chất cũng là thread pool.</li>\n</ul>", "moreNote": "", "related": "", "text": "L5 . Thread pool là tập các thread được tạo sẵn và tái sử dụng để thực thi nhiều task, thay vì mỗi task lại tạo một thread mới. ExecutorService hiệu suất cao vì: Tái sử dụng thread , tránh chi phí tạo/hủy thread (mỗi thread tốn khoảng 1MB stack và system call). Giới hạn số thread chạy đồng thời, tránh cạn tài nguyên và context switch quá nhiều. Có hàng đợi task , tách việc gửi task khỏi việc thực thi task . Quản lý vòng đời và kết quả tiện lợi: Future , invokeAll , shutdown() . Các loại: newFixedThreadPool(n) , newCachedThreadPool() , newSingleThreadExecutor() , newScheduledThreadPool(n) . Tham số ThreadPoolExecutor : corePoolSize , maximumPoolSize , keepAliveTime , workQueue , RejectedExecutionHandler . Chọn số thread: task CPU-bound khoảng số core ; task I/O-bound có thể nhiều hơn. Coroutine Dispatchers.IO/Default thực chất cũng là thread pool."}, "Q5.2": {"title": "Vì sao Thread.destroy() / Thread.stop() ít được sử dụng?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L5</span>.", "answer": "<ul>\n<li><strong><code>Thread.stop()</code></strong> (deprecated): dừng thread <strong>đột ngột</strong>, <strong>giải phóng tất cả lock</strong> đang giữ khi dữ liệu có thể đang sửa dở, nên object rơi vào <strong>trạng thái không nhất quán</strong>.</li>\n<li><strong><code>Thread.destroy()</code></strong>: <strong>chưa bao giờ được implement</strong> (gọi thì ném <code>NoSuchMethodError</code>/<code>UnsupportedOperationException</code>) và đã bị xóa. Nếu có hoạt động thì nó hủy thread mà <strong>không giải phóng lock</strong>, gây <strong>deadlock</strong>.</li>\n</ul>\n<p><strong>Cách đúng:</strong> dừng thread <strong>một cách hợp tác</strong>: gọi <code>thread.interrupt()</code> và trong thread kiểm tra <code>isInterrupted()</code> / bắt <code>InterruptedException</code>, hoặc dùng cờ <code>volatile boolean running</code>. Với coroutine dùng <code>job.cancel()</code> + <code>isActive</code>.</p>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L5 . Thread.stop() (deprecated): dừng thread đột ngột , giải phóng tất cả lock đang giữ khi dữ liệu có thể đang sửa dở, nên object rơi vào trạng thái không nhất quán . Thread.destroy() : chưa bao giờ được implement (gọi thì ném NoSuchMethodError / UnsupportedOperationException ) và đã bị xóa. Nếu có hoạt động thì nó hủy thread mà không giải phóng lock , gây deadlock . Cách đúng: dừng thread một cách hợp tác : gọi thread.interrupt() và trong thread kiểm tra isInterrupted() / bắt InterruptedException , hoặc dùng cờ volatile boolean running . Với coroutine dùng job.cancel() + isActive ."}, "Q5.3": {"title": "wait() / notify() / notifyAll() / await()?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L5</span>.", "answer": "<ul>\n<li><strong><code>wait()</code></strong>: thread hiện tại <strong>nhả lock</strong> và chờ cho đến khi được notify.</li>\n<li><strong><code>notify()</code></strong>: đánh thức <strong>1</strong> thread bất kỳ đang wait trên object đó.</li>\n<li><strong><code>notifyAll()</code></strong>: đánh thức <strong>tất cả</strong> thread đang wait; chúng sẽ tranh lock lại.</li>\n<li>Cả 3 là method của <strong><code>Object</code></strong> và <strong>phải gọi trong <code>synchronized</code></strong> trên chính object đó, nếu không sẽ ném <code>IllegalMonitorStateException</code>.</li>\n<li><strong><code>await()</code> / <code>signal()</code> / <code>signalAll()</code></strong>: tương đương nhưng thuộc <strong><code>Condition</code></strong> của <code>ReentrantLock</code>, linh hoạt hơn (một lock có thể có nhiều condition, có timeout).</li>\n</ul>", "answerNote": "", "more": "<ul>\n<li>Luôn <code>wait()</code> trong <strong>vòng <code>while</code></strong> (không dùng <code>if</code>) để chống <em>spurious wakeup</em>.</li>\n<li>Nên dùng <code>notifyAll()</code> khi có nhiều loại điều kiện chờ, để tránh đánh thức nhầm thread rồi bị treo.</li>\n<li><code>wait()</code> vs <code>sleep()</code>: <code>wait</code> <strong>nhả lock</strong>, <code>sleep</code> <strong>giữ lock</strong>.</li>\n<li>Kotlin: <code>Deferred.await()</code> là chờ kết quả của coroutine <code>async</code>, khái niệm khác hẳn.</li>\n</ul>", "moreNote": "", "related": "", "text": "L5 . wait() : thread hiện tại nhả lock và chờ cho đến khi được notify. notify() : đánh thức 1 thread bất kỳ đang wait trên object đó. notifyAll() : đánh thức tất cả thread đang wait; chúng sẽ tranh lock lại. Cả 3 là method của Object và phải gọi trong synchronized trên chính object đó, nếu không sẽ ném IllegalMonitorStateException . await() / signal() / signalAll() : tương đương nhưng thuộc Condition của ReentrantLock , linh hoạt hơn (một lock có thể có nhiều condition, có timeout). Luôn wait() trong vòng while (không dùng if ) để chống spurious wakeup . Nên dùng notifyAll() khi có nhiều loại điều kiện chờ, để tránh đánh thức nhầm thread rồi bị treo. wait() vs sleep() : wait nhả lock , sleep giữ lock . Kotlin: Deferred.await() là chờ kết quả của coroutine async , khái niệm khác hẳn."}, "Q5.4": {"title": "Chia sẻ dữ liệu giữa 2 thread như thế nào?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L5</span>.", "answer": "<p>Các thread trong cùng process <strong>dùng chung heap</strong>, nên có thể chia sẻ qua <strong>biến dùng chung (shared variable)</strong>. Nhưng phải <strong>đồng bộ</strong> để tránh race condition:</p>\n<ol>\n<li><strong><code>synchronized</code></strong> / <strong><code>ReentrantLock</code></strong>: đảm bảo mỗi lúc chỉ một thread truy cập.</li>\n<li><strong><code>volatile</code></strong>: đảm bảo <strong>visibility</strong> (thread khác thấy ngay giá trị mới), nhưng <strong>không đảm bảo atomic</strong> (<code>count++</code> vẫn sai).</li>\n<li><strong><code>AtomicInteger</code>, <code>AtomicReference</code></strong>: thao tác atomic dựa trên CAS.</li>\n<li><strong>Thread-safe collection</strong>: <code>ConcurrentHashMap</code>, <code>BlockingQueue</code> (mô hình producer–consumer).</li>\n<li><strong>Message passing</strong>: <code>Handler/Looper</code> (gửi sang main thread), Kotlin <code>Channel</code>, <code>Flow</code>.</li>\n<li>Coroutine: <code>Mutex</code>, <code>withContext</code> để chuyển về một thread.</li>\n</ol>", "answerNote": "", "more": "<p><code>ThreadLocal</code> là ngược lại: mỗi thread có <strong>bản sao riêng</strong>, không chia sẻ.</p>", "moreNote": "", "related": "", "text": "L5 . Các thread trong cùng process dùng chung heap , nên có thể chia sẻ qua biến dùng chung (shared variable) . Nhưng phải đồng bộ để tránh race condition: synchronized / ReentrantLock : đảm bảo mỗi lúc chỉ một thread truy cập. volatile : đảm bảo visibility (thread khác thấy ngay giá trị mới), nhưng không đảm bảo atomic ( count++ vẫn sai). AtomicInteger , AtomicReference : thao tác atomic dựa trên CAS. Thread-safe collection : ConcurrentHashMap , BlockingQueue (mô hình producer–consumer). Message passing : Handler/Looper (gửi sang main thread), Kotlin Channel , Flow . Coroutine: Mutex , withContext để chuyển về một thread. ThreadLocal là ngược lại: mỗi thread có bản sao riêng , không chia sẻ."}, "Q5.5": {"title": "Deadlock là gì? Cách phòng tránh / giải quyết?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L5</span>.", "answer": "<p>Deadlock là tình trạng <strong>2 hay nhiều thread chờ nhau mãi mãi</strong>, mỗi thread giữ một tài nguyên và chờ tài nguyên mà thread kia đang giữ.</p>\n<p><strong>4 điều kiện (Coffman)</strong>, xảy ra đồng thời thì có deadlock:</p>\n<ol>\n<li>Mutual exclusion (độc quyền tài nguyên)</li>\n<li>Hold and wait (giữ và chờ)</li>\n<li>No preemption (không bị cưỡng đoạt)</li>\n<li>Circular wait (chờ vòng tròn)</li>\n</ol>\n<p><strong>Phòng tránh</strong>: phá ít nhất 1 điều kiện:</p>\n<ul>\n<li><strong>Lock ordering:</strong> mọi thread lấy lock theo <strong>cùng một thứ tự</strong> (phá circular wait). Đây là cách phổ biến nhất.</li>\n<li><strong><code>tryLock(timeout)</code>:</strong> không lấy được thì nhả lock đang giữ và thử lại.</li>\n<li><strong>Tránh lock lồng nhau</strong>, thu hẹp phạm vi <code>synchronized</code>, không gọi callback hoặc code lạ khi đang giữ lock.</li>\n<li>Dùng cấu trúc high-level: <code>ConcurrentHashMap</code>, <code>BlockingQueue</code>, coroutine/actor.</li>\n</ul>\n<p><strong>Phát hiện:</strong> thread dump (<code>jstack</code>; trên Android xem <strong>ANR traces</strong> <code>/data/anr/traces.txt</code> hoặc bugreport) để thấy các thread <code>BLOCKED</code> chờ lock của nhau.</p>", "answerNote": "", "more": "", "moreNote": "", "related": "<p>Livelock? Starvation? Race condition?</p>", "text": "L5 . Deadlock là tình trạng 2 hay nhiều thread chờ nhau mãi mãi , mỗi thread giữ một tài nguyên và chờ tài nguyên mà thread kia đang giữ. 4 điều kiện (Coffman) , xảy ra đồng thời thì có deadlock: Mutual exclusion (độc quyền tài nguyên) Hold and wait (giữ và chờ) No preemption (không bị cưỡng đoạt) Circular wait (chờ vòng tròn) Phòng tránh : phá ít nhất 1 điều kiện: Lock ordering: mọi thread lấy lock theo cùng một thứ tự (phá circular wait). Đây là cách phổ biến nhất. tryLock(timeout) : không lấy được thì nhả lock đang giữ và thử lại. Tránh lock lồng nhau , thu hẹp phạm vi synchronized , không gọi callback hoặc code lạ khi đang giữ lock. Dùng cấu trúc high-level: ConcurrentHashMap , BlockingQueue , coroutine/actor. Phát hiện: thread dump ( jstack ; trên Android xem ANR traces /data/anr/traces.txt hoặc bugreport) để thấy các thread BLOCKED chờ lock của nhau. Livelock? Starvation? Race condition?"}, "Q5.6": {"title": "Đa tiến trình (multi-process) vs đa luồng (multi-thread)?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L5</span> → <span class=\"lref\">L6</span> (IPC).", "answer": "<ul>\n<li><strong>Process:</strong> đơn vị cấp phát tài nguyên, có <strong>vùng nhớ riêng</strong>, cô lập với nhau. Giao tiếp phải qua <strong>IPC</strong>.</li>\n<li><strong>Thread:</strong> đơn vị thực thi bên trong process, <strong>dùng chung bộ nhớ</strong> của process, nhẹ hơn, giao tiếp trực tiếp qua biến dùng chung nhưng phải đồng bộ.</li>\n</ul>\n<p><strong>Android:</strong> mặc định mỗi app chạy trong <strong>1 process / 1 Linux user / 1 ART VM</strong>. Có thể tạo thêm process bằng <code>android:process=\":remote\"</code> trong Manifest.\nHệ quả khi chạy đa tiến trình: <strong>static/Singleton không còn dùng chung</strong>, <code>Application.onCreate()</code> chạy <strong>một lần cho mỗi process</strong>, SharedPreferences không đồng bộ giữa các process.</p>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L5 → L6 (IPC). Process: đơn vị cấp phát tài nguyên, có vùng nhớ riêng , cô lập với nhau. Giao tiếp phải qua IPC . Thread: đơn vị thực thi bên trong process, dùng chung bộ nhớ của process, nhẹ hơn, giao tiếp trực tiếp qua biến dùng chung nhưng phải đồng bộ. Android: mặc định mỗi app chạy trong 1 process / 1 Linux user / 1 ART VM . Có thể tạo thêm process bằng android:process=\":remote\" trong Manifest. Hệ quả khi chạy đa tiến trình: static/Singleton không còn dùng chung , Application.onCreate() chạy một lần cho mỗi process , SharedPreferences không đồng bộ giữa các process."}, "Q5.7": {"title": "Reactive programming là gì?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L5</span> (mô hình lập trình) ↔ <span class=\"lref\">L3</span> (Observer).", "answer": "<p>Reactive programming là mô hình lập trình <strong>làm việc với các luồng dữ liệu bất đồng bộ (data stream)</strong> và <strong>tự động lan truyền thay đổi</strong>: khi nguồn phát dữ liệu mới thì bên đăng ký <strong>phản ứng</strong> lại. Nó dựa trên <strong>Observer pattern</strong> cộng với <strong>các operator</strong> khai báo (map, filter, debounce, combine...).</p>\n<p>Trong Android: <strong>RxJava</strong> (<code>Observable</code>, <code>Single</code>, <code>Flowable</code>) và <strong>Kotlin Flow</strong> (<code>Flow</code>, <code>StateFlow</code>, <code>SharedFlow</code>).</p>", "answerNote": "", "more": "<ul>\n<li><strong>Cold stream</strong> (Flow, Observable): chỉ chạy khi có collector, mỗi collector nhận một luồng riêng. <strong>Hot stream</strong> (StateFlow, SharedFlow, Subject): phát dữ liệu bất kể có ai lắng nghe hay không.</li>\n<li><strong>Backpressure:</strong> khi producer phát nhanh hơn consumer xử lý. Xử lý bằng <code>buffer</code>, <code>conflate</code>, <code>Flowable</code>.</li>\n<li>Ví dụ: ô search dùng <code>debounce(300)</code> → <code>distinctUntilChanged()</code> → <code>flatMapLatest { api.search(it) }</code>.</li>\n</ul>", "moreNote": "", "related": "", "text": "L5 (mô hình lập trình) ↔ L3 (Observer). Reactive programming là mô hình lập trình làm việc với các luồng dữ liệu bất đồng bộ (data stream) và tự động lan truyền thay đổi : khi nguồn phát dữ liệu mới thì bên đăng ký phản ứng lại. Nó dựa trên Observer pattern cộng với các operator khai báo (map, filter, debounce, combine...). Trong Android: RxJava ( Observable , Single , Flowable ) và Kotlin Flow ( Flow , StateFlow , SharedFlow ). Cold stream (Flow, Observable): chỉ chạy khi có collector, mỗi collector nhận một luồng riêng. Hot stream (StateFlow, SharedFlow, Subject): phát dữ liệu bất kể có ai lắng nghe hay không. Backpressure: khi producer phát nhanh hơn consumer xử lý. Xử lý bằng buffer , conflate , Flowable . Ví dụ: ô search dùng debounce(300) → distinctUntilChanged() → flatMapLatest { api.search(it) } ."}, "Q5.8": {"title": "GC (Garbage Collection) là gì?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L5</span>.", "answer": "<p>GC là cơ chế <strong>tự động thu hồi bộ nhớ của các object không còn được tham chiếu</strong> (không đi tới được từ <strong>GC Roots</strong>).</p>\n<ul>\n<li><strong>GC Roots:</strong> biến local trên stack của các thread đang chạy, biến static, JNI reference, thread đang chạy.</li>\n<li>Thuật toán cơ bản: <strong>Mark</strong> (đánh dấu object còn sống từ GC roots) → <strong>Sweep/Compact</strong> (dọn object chết, gom bộ nhớ).</li>\n<li><strong>Generational:</strong> chia heap thành <strong>Young</strong> (object mới, phần lớn chết nhanh, GC thường xuyên) và <strong>Old</strong> (object sống lâu).</li>\n</ul>", "answerNote": "", "more": "<ul>\n<li>Android <strong>ART</strong> dùng <strong>Concurrent Copying GC</strong> (từ Android 8) và generational (từ Android 10). GC chạy song song với app nên ít pause.</li>\n<li><code>System.gc()</code> chỉ là <strong>gợi ý</strong>, không đảm bảo GC chạy.</li>\n<li>Tạo nhiều object tạm (ví dụ trong <code>onDraw()</code>) gây <strong>memory churn</strong>: GC chạy liên tục làm giật UI (jank).</li>\n</ul>", "moreNote": "", "related": "", "text": "L5 . GC là cơ chế tự động thu hồi bộ nhớ của các object không còn được tham chiếu (không đi tới được từ GC Roots ). GC Roots: biến local trên stack của các thread đang chạy, biến static, JNI reference, thread đang chạy. Thuật toán cơ bản: Mark (đánh dấu object còn sống từ GC roots) → Sweep/Compact (dọn object chết, gom bộ nhớ). Generational: chia heap thành Young (object mới, phần lớn chết nhanh, GC thường xuyên) và Old (object sống lâu). Android ART dùng Concurrent Copying GC (từ Android 8) và generational (từ Android 10). GC chạy song song với app nên ít pause. System.gc() chỉ là gợi ý , không đảm bảo GC chạy. Tạo nhiều object tạm (ví dụ trong onDraw() ) gây memory churn : GC chạy liên tục làm giật UI (jank)."}, "Q5.9": {"title": "WeakReference? Các loại reference?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L5</span> → giải pháp chống leak ở <span class=\"lref\">L6</span>.", "answer": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Loại</th>\n<th>GC thu hồi khi nào</th>\n<th>Dùng cho</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Strong</strong> (mặc định)</td>\n<td>Không bao giờ, khi còn tham chiếu</td>\n<td>Mọi object thông thường</td>\n</tr>\n<tr>\n<td><strong>Soft</strong></td>\n<td>Khi <strong>thiếu bộ nhớ</strong></td>\n<td>Cache (trên Android không khuyến khích, nên dùng <code>LruCache</code>)</td>\n</tr>\n<tr>\n<td><strong>Weak</strong></td>\n<td>Ở <strong>lần GC kế tiếp</strong> nếu chỉ còn weak reference</td>\n<td>Tránh leak: giữ Activity/View/listener trong class sống lâu</td>\n</tr>\n<tr>\n<td><strong>Phantom</strong></td>\n<td>Sau khi object đã finalize, <code>get()</code> luôn trả về null</td>\n<td>Theo dõi việc dọn dẹp tài nguyên (thay cho <code>finalize</code>)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Ví dụ:</strong> <code>Handler</code> hoặc <code>AsyncTask</code> tĩnh giữ <code>WeakReference&lt;Activity&gt;</code>, khi dùng thì gọi <code>ref.get()?.let { }</code> vì có thể đã null.</p>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L5 → giải pháp chống leak ở L6 . Loại GC thu hồi khi nào Dùng cho Strong (mặc định) Không bao giờ, khi còn tham chiếu Mọi object thông thường Soft Khi thiếu bộ nhớ Cache (trên Android không khuyến khích, nên dùng LruCache ) Weak Ở lần GC kế tiếp nếu chỉ còn weak reference Tránh leak: giữ Activity/View/listener trong class sống lâu Phantom Sau khi object đã finalize, get() luôn trả về null Theo dõi việc dọn dẹp tài nguyên (thay cho finalize ) Ví dụ: Handler hoặc AsyncTask tĩnh giữ WeakReference<Activity> , khi dùng thì gọi ref.get()?.let { } vì có thể đã null."}, "Q5.10": {"title": "Tối ưu, xử lý lỗi liên quan đến memory?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L5</span>/<span class=\"lref\">L6</span> → công cụ ở <span class=\"lref\">L9</span>.", "answer": "<p><strong>Các lỗi chính:</strong> <strong>Memory leak</strong> (object không dùng nữa nhưng vẫn bị giữ tham chiếu), <strong>OOM</strong> (OutOfMemoryError), <strong>memory churn</strong>.</p>\n<p><strong>Nguyên nhân leak hay gặp trên Android:</strong></p>\n<ul>\n<li>Biến <code>static</code> hoặc Singleton giữ <code>Activity Context</code>/View.</li>\n<li><strong>Inner class / anonymous class / lambda</strong> (Handler, Runnable, Thread) giữ reference ngầm tới Activity và sống lâu hơn Activity.</li>\n<li>Listener, BroadcastReceiver, callback <strong>không unregister</strong>.</li>\n<li>Coroutine/Rx chạy trên <code>GlobalScope</code> không bị hủy.</li>\n<li>Bitmap lớn không được giải phóng.</li>\n</ul>\n<p><strong>Cách xử lý:</strong></p>\n<ul>\n<li>Dùng <code>applicationContext</code> cho object sống lâu; dùng static inner class + <code>WeakReference</code>.</li>\n<li>Unregister trong <code>onStop</code>/<code>onDestroy</code>; dùng lifecycle-aware component (<code>LiveData</code>, <code>lifecycleScope</code>, <code>viewModelScope</code>).</li>\n<li>Bitmap: <code>inSampleSize</code>, dùng Glide/Coil; dùng <code>SparseArray</code>/<code>ArrayMap</code>; tránh tạo object trong <code>onDraw</code>; implement <code>onTrimMemory()</code>.</li>\n<li><strong>Công cụ:</strong> <strong>LeakCanary</strong>, <strong>Android Studio Memory Profiler</strong> (heap dump, allocation tracking), MAT, <code>adb shell dumpsys meminfo &lt;package&gt;</code>, StrictMode.</li>\n</ul>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L5 / L6 → công cụ ở L9 . Các lỗi chính: Memory leak (object không dùng nữa nhưng vẫn bị giữ tham chiếu), OOM (OutOfMemoryError), memory churn . Nguyên nhân leak hay gặp trên Android: Biến static hoặc Singleton giữ Activity Context /View. Inner class / anonymous class / lambda (Handler, Runnable, Thread) giữ reference ngầm tới Activity và sống lâu hơn Activity. Listener, BroadcastReceiver, callback không unregister . Coroutine/Rx chạy trên GlobalScope không bị hủy. Bitmap lớn không được giải phóng. Cách xử lý: Dùng applicationContext cho object sống lâu; dùng static inner class + WeakReference . Unregister trong onStop / onDestroy ; dùng lifecycle-aware component ( LiveData , lifecycleScope , viewModelScope ). Bitmap: inSampleSize , dùng Glide/Coil; dùng SparseArray / ArrayMap ; tránh tạo object trong onDraw ; implement onTrimMemory() . Công cụ: LeakCanary , Android Studio Memory Profiler (heap dump, allocation tracking), MAT, adb shell dumpsys meminfo <package> , StrictMode."}, "Q6.1": {"title": "Kiến trúc nền tảng Android? Đã làm ở \"tầng dưới\" chưa?", "weak": true, "freq": false, "loc": "<span class=\"lref\">L6</span>. Đây là bản đồ của chính tầng này.", "answer": "<ol>\n<li><strong>Linux Kernel:</strong> driver, quản lý process/memory, <strong>Binder driver</strong>, power management.</li>\n<li><strong>HAL (Hardware Abstraction Layer):</strong> interface chuẩn giữa framework và phần cứng (camera, audio, sensor). Viết bằng HIDL/AIDL.</li>\n<li><strong>Native C/C++ libraries + Android Runtime (ART):</strong> OpenGL, SQLite, Media framework, libc; ART chạy bytecode DEX (AOT/JIT).</li>\n<li><strong>Java API Framework:</strong> ActivityManager, WindowManager, PackageManager, ContentProvider, NotificationManager... (system services chạy trong <code>system_server</code>).</li>\n<li><strong>System Apps / Apps.</strong></li>\n</ol>\n<p><strong>\"Làm tầng dưới?\"</strong> Trả lời trung thực theo kinh nghiệm thật. Ví dụ:</p>\n<blockquote>\n<p>\"Tôi chủ yếu làm ở tầng Application, nhưng có giao tiếp với tầng Framework qua system service/AIDL, và có đọc source AOSP để debug. Tôi hiểu cơ chế Binder IPC và luồng từ App → Framework → HAL.\"</p>\n</blockquote>", "answerNote": "5 tầng (từ dưới lên)", "more": "<p>Trong automotive (Android Automotive OS) có thêm <strong>Car Service</strong>, <strong>Vehicle HAL (VHAL)</strong>, <code>CarPropertyManager</code>. Nếu ứng tuyển vị trí liên quan thì nên tìm hiểu trước.</p>", "moreNote": "", "related": "", "text": "L6 . Đây là bản đồ của chính tầng này. Linux Kernel: driver, quản lý process/memory, Binder driver , power management. HAL (Hardware Abstraction Layer): interface chuẩn giữa framework và phần cứng (camera, audio, sensor). Viết bằng HIDL/AIDL. Native C/C++ libraries + Android Runtime (ART): OpenGL, SQLite, Media framework, libc; ART chạy bytecode DEX (AOT/JIT). Java API Framework: ActivityManager, WindowManager, PackageManager, ContentProvider, NotificationManager... (system services chạy trong system_server ). System Apps / Apps. \"Làm tầng dưới?\" Trả lời trung thực theo kinh nghiệm thật. Ví dụ: \"Tôi chủ yếu làm ở tầng Application, nhưng có giao tiếp với tầng Framework qua system service/AIDL, và có đọc source AOSP để debug. Tôi hiểu cơ chế Binder IPC và luồng từ App → Framework → HAL.\" Trong automotive (Android Automotive OS) có thêm Car Service , Vehicle HAL (VHAL) , CarPropertyManager . Nếu ứng tuyển vị trí liên quan thì nên tìm hiểu trước."}, "Q6.2": {"title": "Start Service nhiều lần thì chuyện gì xảy ra?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L6</span> (Component lifecycle).", "answer": "<ul>\n<li><strong><code>onCreate()</code> chỉ được gọi 1 lần</strong> (khi service chưa tồn tại).</li>\n<li><strong><code>onStartCommand()</code> được gọi mỗi lần</strong> <code>startService()</code>, kèm một <code>startId</code> tăng dần.</li>\n<li><strong>Chỉ có 1 instance service.</strong> Chỉ cần gọi <code>stopService()</code> hoặc <code>stopSelf()</code> <strong>một lần</strong> là service dừng, bất kể đã start bao nhiêu lần.</li>\n<li><code>stopSelf(startId)</code>: chỉ dừng nếu <code>startId</code> là lần start <strong>mới nhất</strong>, tránh dừng khi vẫn còn request mới đang tới.</li>\n</ul>", "answerNote": "", "more": "<ul>\n<li>Giá trị trả về của <code>onStartCommand</code>: <code>START_STICKY</code> (bị kill thì tạo lại, intent null), <code>START_NOT_STICKY</code> (không tạo lại), <code>START_REDELIVER_INTENT</code> (tạo lại và gửi lại intent cuối).</li>\n<li><strong>Bound service:</strong> <code>bindService</code> nhiều lần từ nhiều client thì <code>onBind()</code> thường chỉ gọi 1 lần (cho cùng Intent), các client sau nhận cùng <code>IBinder</code>. Service bị hủy khi <strong>tất cả client unbind</strong> (nếu không đồng thời là started service).</li>\n<li>Android 8+: app ở background không <code>startService()</code> được, phải dùng <code>startForegroundService()</code> + <code>startForeground()</code> trong khoảng 5s, hoặc dùng WorkManager.</li>\n<li>Service chạy trên <strong>main thread</strong>, nên việc nặng phải đưa sang thread khác.</li>\n</ul>", "moreNote": "", "related": "<p>Started vs Bound service? Foreground service? IntentService (deprecated) → WorkManager/JobIntentService?</p>", "text": "L6 (Component lifecycle). onCreate() chỉ được gọi 1 lần (khi service chưa tồn tại). onStartCommand() được gọi mỗi lần startService() , kèm một startId tăng dần. Chỉ có 1 instance service. Chỉ cần gọi stopService() hoặc stopSelf() một lần là service dừng, bất kể đã start bao nhiêu lần. stopSelf(startId) : chỉ dừng nếu startId là lần start mới nhất , tránh dừng khi vẫn còn request mới đang tới. Giá trị trả về của onStartCommand : START_STICKY (bị kill thì tạo lại, intent null), START_NOT_STICKY (không tạo lại), START_REDELIVER_INTENT (tạo lại và gửi lại intent cuối). Bound service: bindService nhiều lần từ nhiều client thì onBind() thường chỉ gọi 1 lần (cho cùng Intent), các client sau nhận cùng IBinder . Service bị hủy khi tất cả client unbind (nếu không đồng thời là started service). Android 8+: app ở background không startService() được, phải dùng startForegroundService() + startForeground() trong khoảng 5s, hoặc dùng WorkManager. Service chạy trên main thread , nên việc nặng phải đưa sang thread khác. Started vs Bound service? Foreground service? IntentService (deprecated) → WorkManager/JobIntentService?"}, "Q6.3": {"title": "Permission là gì? Các loại? Special permission?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L6</span> (Security model).", "answer": "<p>Permission là cơ chế <strong>bảo vệ quyền truy cập dữ liệu và chức năng nhạy cảm</strong>. App phải khai báo trong <code>AndroidManifest.xml</code>, một số loại còn cần người dùng cấp.</p>\n<p>Các loại (protection level):</p>\n<ol>\n<li><strong>Install-time:</strong><ul>\n<li><strong>Normal:</strong> rủi ro thấp, được cấp tự động khi cài (INTERNET, VIBRATE).</li>\n<li><strong>Signature:</strong> chỉ cấp cho app <strong>cùng chữ ký</strong> với app định nghĩa permission (thường là app hệ thống).</li>\n</ul>\n</li>\n<li><strong>Runtime (Dangerous)</strong> (Android 6.0+): truy cập dữ liệu riêng tư (CAMERA, LOCATION, CONTACTS, RECORD_AUDIO); phải <strong>xin lúc chạy</strong>, người dùng có thể từ chối/thu hồi.</li>\n<li><strong>Special permission:</strong> quyền rất nhạy cảm, <strong>không xin qua dialog thường</strong> mà phải <strong>đưa người dùng tới màn hình Settings</strong> để bật.<ul>\n<li>Ví dụ: <code>SYSTEM_ALERT_WINDOW</code> (vẽ đè app khác), <code>WRITE_SETTINGS</code>, <code>MANAGE_EXTERNAL_STORAGE</code>, <code>REQUEST_INSTALL_PACKAGES</code>, <code>SCHEDULE_EXACT_ALARM</code>, <code>PACKAGE_USAGE_STATS</code>, Notification listener, Accessibility service, Device admin.</li>\n<li>Kiểm tra: <code>Settings.canDrawOverlays()</code>, <code>Settings.System.canWrite()</code>...; mở Settings: <code>Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse(\"package:$packageName\"))</code>.</li>\n</ul>\n</li>\n<li><strong>Privileged/System:</strong> chỉ cho app trong <code>/system/priv-app</code> (cần allowlist).</li>\n</ol>", "answerNote": "", "more": "<p><code>checkSelfPermission()</code> → (nếu cần) <code>shouldShowRequestPermissionRationale()</code> → <code>registerForActivityResult(RequestPermission())</code> → xử lý kết quả cấp/từ chối.\nNgoài ra còn <strong>custom permission</strong> (<code>&lt;permission&gt;</code> trong Manifest) để bảo vệ component/AIDL của mình.</p>", "moreNote": "luồng runtime permission", "related": "", "text": "L6 (Security model). Permission là cơ chế bảo vệ quyền truy cập dữ liệu và chức năng nhạy cảm . App phải khai báo trong AndroidManifest.xml , một số loại còn cần người dùng cấp. Các loại (protection level): Install-time: Normal: rủi ro thấp, được cấp tự động khi cài (INTERNET, VIBRATE). Signature: chỉ cấp cho app cùng chữ ký với app định nghĩa permission (thường là app hệ thống). Runtime (Dangerous) (Android 6.0+): truy cập dữ liệu riêng tư (CAMERA, LOCATION, CONTACTS, RECORD_AUDIO); phải xin lúc chạy , người dùng có thể từ chối/thu hồi. Special permission: quyền rất nhạy cảm, không xin qua dialog thường mà phải đưa người dùng tới màn hình Settings để bật. Ví dụ: SYSTEM_ALERT_WINDOW (vẽ đè app khác), WRITE_SETTINGS , MANAGE_EXTERNAL_STORAGE , REQUEST_INSTALL_PACKAGES , SCHEDULE_EXACT_ALARM , PACKAGE_USAGE_STATS , Notification listener, Accessibility service, Device admin. Kiểm tra: Settings.canDrawOverlays() , Settings.System.canWrite() ...; mở Settings: Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse(\"package:$packageName\")) . Privileged/System: chỉ cho app trong /system/priv-app (cần allowlist). checkSelfPermission() → (nếu cần) shouldShowRequestPermissionRationale() → registerForActivityResult(RequestPermission()) → xử lý kết quả cấp/từ chối. Ngoài ra còn custom permission ( <permission> trong Manifest) để bảo vệ component/AIDL của mình."}, "Q6.4": {"title": "IPC là gì? Các cách giao tiếp giữa các tiến trình trong Android?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L6</span>. Liên hệ <span class=\"lref\">L5</span> (multi-process) và <span class=\"lref\">L2</span> (client-server).", "answer": "<p>IPC (Inter-Process Communication) là cơ chế để <strong>các process trao đổi dữ liệu với nhau</strong>, vì mỗi process có vùng nhớ riêng. Trong Android, nền tảng của hầu hết IPC là <strong>Binder</strong>.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Cách</th>\n<th>Đặc điểm</th>\n<th>Khi dùng</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Intent / Bundle</strong></td>\n<td>Đơn giản, một chiều</td>\n<td>Start Activity/Service, gửi dữ liệu nhỏ</td>\n</tr>\n<tr>\n<td><strong>BroadcastReceiver</strong></td>\n<td>Một-nhiều, bất đồng bộ</td>\n<td>Thông báo sự kiện hệ thống/app</td>\n</tr>\n<tr>\n<td><strong>ContentProvider</strong></td>\n<td>Chia sẻ dữ liệu có cấu trúc (CRUD qua URI)</td>\n<td>Chia sẻ DB cho app khác (Contacts, MediaStore)</td>\n</tr>\n<tr>\n<td><strong>Messenger</strong></td>\n<td>Dựa trên Handler, <strong>tuần tự một thread</strong></td>\n<td>IPC đơn giản, không cần xử lý đa luồng</td>\n</tr>\n<tr>\n<td><strong>AIDL</strong></td>\n<td>Gọi method từ xa, <strong>đa luồng</strong>, hai chiều (callback)</td>\n<td>Service phục vụ nhiều client đồng thời, API phức tạp</td>\n</tr>\n<tr>\n<td><strong>Socket / File / SharedMemory</strong></td>\n<td>Mức thấp</td>\n<td>Dữ liệu lớn, stream</td>\n</tr>\n</tbody>\n</table></div>", "answerNote": "", "more": "<p>chỉ <strong>copy dữ liệu 1 lần</strong> (nhờ mmap), nhanh hơn socket/pipe (2 lần); có <strong>UID/PID của bên gọi</strong> nên bảo mật tốt (<code>Binder.getCallingUid()</code>); mô hình client-server hướng đối tượng. Giới hạn transaction buffer khoảng <strong>1MB</strong> cho mỗi process, vượt quá thì gặp <code>TransactionTooLargeException</code>.</p>", "moreNote": "vì sao Android dùng Binder", "related": "", "text": "L6 . Liên hệ L5 (multi-process) và L2 (client-server). IPC (Inter-Process Communication) là cơ chế để các process trao đổi dữ liệu với nhau , vì mỗi process có vùng nhớ riêng. Trong Android, nền tảng của hầu hết IPC là Binder . Cách Đặc điểm Khi dùng Intent / Bundle Đơn giản, một chiều Start Activity/Service, gửi dữ liệu nhỏ BroadcastReceiver Một-nhiều, bất đồng bộ Thông báo sự kiện hệ thống/app ContentProvider Chia sẻ dữ liệu có cấu trúc (CRUD qua URI) Chia sẻ DB cho app khác (Contacts, MediaStore) Messenger Dựa trên Handler, tuần tự một thread IPC đơn giản, không cần xử lý đa luồng AIDL Gọi method từ xa, đa luồng , hai chiều (callback) Service phục vụ nhiều client đồng thời, API phức tạp Socket / File / SharedMemory Mức thấp Dữ liệu lớn, stream chỉ copy dữ liệu 1 lần (nhờ mmap), nhanh hơn socket/pipe (2 lần); có UID/PID của bên gọi nên bảo mật tốt ( Binder.getCallingUid() ); mô hình client-server hướng đối tượng. Giới hạn transaction buffer khoảng 1MB cho mỗi process, vượt quá thì gặp TransactionTooLargeException ."}, "Q6.5": {"title": "AIDL là gì? Các bước sử dụng?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L6</span>.", "answer": "<p>AIDL (Android Interface Definition Language) dùng để <strong>định nghĩa interface mà client và service ở 2 process khác nhau cùng thống nhất</strong>. Từ file <code>.aidl</code>, Android tự sinh code <code>Stub</code> (phía service) và <code>Proxy</code> (phía client) để marshalling dữ liệu qua Binder.</p>\n<p><strong>Các bước:</strong></p>\n<ol>\n<li>Tạo file <code>IMyService.aidl</code> khai báo method.</li>\n<li>Build để sinh ra <code>IMyService.Stub</code>.</li>\n<li><strong>Service:</strong> implement <code>IMyService.Stub()</code> và trả về trong <code>onBind()</code>.</li>\n<li><strong>Client:</strong> <code>bindService()</code> → trong <code>onServiceConnected()</code> gọi <code>IMyService.Stub.asInterface(binder)</code> → gọi method.</li>\n<li>Khai báo service trong Manifest (<code>exported</code>, <code>permission</code> để bảo vệ).</li>\n</ol>", "answerNote": "", "more": "<ul>\n<li>Kiểu dữ liệu hỗ trợ: primitive, <code>String</code>, <code>List</code>, <code>Map</code>, <code>Parcelable</code> (khai báo bằng file <code>.aidl</code> riêng), interface AIDL khác (dùng làm callback).</li>\n<li>Tham số có hướng: <code>in</code>, <code>out</code>, <code>inout</code>. Từ khóa <code>oneway</code> cho lời gọi <strong>không chờ kết quả</strong>.</li>\n<li><strong>Threading:</strong> method phía service chạy trên <strong>Binder thread pool</strong> (không phải main thread), nên <strong>phải tự đảm bảo thread-safe</strong>. Client gọi đồng bộ sẽ <strong>block</strong> cho đến khi có kết quả, vì vậy không nên gọi từ main thread nếu xử lý lâu.</li>\n<li>Callback từ service về client dùng <code>RemoteCallbackList</code>; xử lý service chết dùng <code>linkToDeath()</code> / <code>DeathRecipient</code>.</li>\n</ul>", "moreNote": "", "related": "", "text": "L6 . AIDL (Android Interface Definition Language) dùng để định nghĩa interface mà client và service ở 2 process khác nhau cùng thống nhất . Từ file .aidl , Android tự sinh code Stub (phía service) và Proxy (phía client) để marshalling dữ liệu qua Binder. Các bước: Tạo file IMyService.aidl khai báo method. Build để sinh ra IMyService.Stub . Service: implement IMyService.Stub() và trả về trong onBind() . Client: bindService() → trong onServiceConnected() gọi IMyService.Stub.asInterface(binder) → gọi method. Khai báo service trong Manifest ( exported , permission để bảo vệ). Kiểu dữ liệu hỗ trợ: primitive, String , List , Map , Parcelable (khai báo bằng file .aidl riêng), interface AIDL khác (dùng làm callback). Tham số có hướng: in , out , inout . Từ khóa oneway cho lời gọi không chờ kết quả . Threading: method phía service chạy trên Binder thread pool (không phải main thread), nên phải tự đảm bảo thread-safe . Client gọi đồng bộ sẽ block cho đến khi có kết quả, vì vậy không nên gọi từ main thread nếu xử lý lâu. Callback từ service về client dùng RemoteCallbackList ; xử lý service chết dùng linkToDeath() / DeathRecipient ."}, "Q6.6": {"title": "Dùng C++ với Java trong cùng một ứng dụng được không?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L6</span> (Native layer).", "answer": "<p><strong>Được</strong>, thông qua <strong>JNI (Java Native Interface)</strong> và <strong>NDK</strong>.</p>\n<ol>\n<li>Viết code C/C++ và build thành thư viện <code>.so</code> bằng <strong>CMake</strong> hoặc ndk-build.</li>\n<li>Java/Kotlin: <code>System.loadLibrary(\"native-lib\")</code> và khai báo <code>native</code> (Java) / <code>external fun</code> (Kotlin).</li>\n<li>C++: implement hàm <code>JNIEXPORT ... Java_com_pkg_Class_method(JNIEnv, jobject, ...)</code>, hoặc đăng ký bằng <code>RegisterNatives</code>.</li>\n</ol>\n<p><strong>Khi nào dùng:</strong> cần <strong>hiệu năng cao</strong> (xử lý ảnh/âm thanh, game, codec), <strong>tái sử dụng thư viện C/C++ có sẵn</strong>, hoặc truy cập API mức thấp.\n<strong>Lưu ý:</strong> gọi qua JNI có chi phí; phải tự quản lý bộ nhớ (local/global ref); crash native ra <strong>tombstone</strong>, khó debug hơn; phải build cho từng ABI (arm64-v8a, armeabi-v7a, x86_64).</p>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L6 (Native layer). Được , thông qua JNI (Java Native Interface) và NDK . Viết code C/C++ và build thành thư viện .so bằng CMake hoặc ndk-build. Java/Kotlin: System.loadLibrary(\"native-lib\") và khai báo native (Java) / external fun (Kotlin). C++: implement hàm JNIEXPORT ... Java_com_pkg_Class_method(JNIEnv, jobject, ...) , hoặc đăng ký bằng RegisterNatives . Khi nào dùng: cần hiệu năng cao (xử lý ảnh/âm thanh, game, codec), tái sử dụng thư viện C/C++ có sẵn , hoặc truy cập API mức thấp. Lưu ý: gọi qua JNI có chi phí; phải tự quản lý bộ nhớ (local/global ref); crash native ra tombstone , khó debug hơn; phải build cho từng ABI (arm64-v8a, armeabi-v7a, x86_64)."}, "Q7.1": {"title": "Các loại lưu trữ dữ liệu trong Android? Dự án lưu trữ dữ liệu kiểu gì?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L7</span>.", "answer": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Cách lưu</th>\n<th>Dữ liệu phù hợp</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>SharedPreferences / DataStore</strong></td>\n<td>Key-value nhỏ: setting, cờ, token. DataStore (Preferences/Proto) là bản thay thế async, an toàn hơn</td>\n</tr>\n<tr>\n<td><strong>Internal storage</strong> (<code>filesDir</code>, <code>cacheDir</code>)</td>\n<td>File riêng của app, bị xóa khi gỡ app</td>\n</tr>\n<tr>\n<td><strong>External / Shared storage</strong> (MediaStore, SAF)</td>\n<td>Ảnh, video, tài liệu chia sẻ với app khác</td>\n</tr>\n<tr>\n<td><strong>SQLite / Room</strong></td>\n<td>Dữ liệu có cấu trúc, quan hệ, cần query</td>\n</tr>\n<tr>\n<td><strong>ContentProvider</strong></td>\n<td>Chia sẻ dữ liệu cho app khác</td>\n</tr>\n<tr>\n<td><strong>Network / Cloud</strong></td>\n<td>Đồng bộ giữa thiết bị, backup</td>\n</tr>\n<tr>\n<td><strong>EncryptedSharedPreferences / Keystore</strong></td>\n<td>Dữ liệu nhạy cảm, khóa bí mật</td>\n</tr>\n</tbody>\n</table></div>\n<p>nêu cụ thể <em>dữ liệu gì → lưu ở đâu → vì sao</em>. Ví dụ: \"setting người dùng thì lưu DataStore, lịch sử thì lưu Room vì cần query và sắp xếp, ảnh thì cache file qua Glide\".</p>", "answerNote": "\"dự án lưu kiểu gì\"", "more": "", "moreNote": "", "related": "", "text": "L7 . Cách lưu Dữ liệu phù hợp SharedPreferences / DataStore Key-value nhỏ: setting, cờ, token. DataStore (Preferences/Proto) là bản thay thế async, an toàn hơn Internal storage ( filesDir , cacheDir ) File riêng của app, bị xóa khi gỡ app External / Shared storage (MediaStore, SAF) Ảnh, video, tài liệu chia sẻ với app khác SQLite / Room Dữ liệu có cấu trúc, quan hệ, cần query ContentProvider Chia sẻ dữ liệu cho app khác Network / Cloud Đồng bộ giữa thiết bị, backup EncryptedSharedPreferences / Keystore Dữ liệu nhạy cảm, khóa bí mật nêu cụ thể dữ liệu gì → lưu ở đâu → vì sao . Ví dụ: \"setting người dùng thì lưu DataStore, lịch sử thì lưu Room vì cần query và sắp xếp, ảnh thì cache file qua Glide\"."}, "Q7.2": {"title": "Room là gì? Các bước tạo Room database?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L7</span>.", "answer": "<p>Room là thư viện Jetpack, <strong>lớp abstraction trên SQLite</strong>:</p>\n<ul>\n<li><strong>Kiểm tra câu SQL ở compile-time</strong>, giảm boilerplate (không cần tự viết Cursor).</li>\n<li>Hỗ trợ <strong>Flow/LiveData/suspend</strong>, migration.</li>\n</ul>\n<p><strong>3 thành phần chính:</strong> <code>@Entity</code> (bảng), <code>@Dao</code> (truy vấn), <code>@Database</code> (điểm truy cập).</p>\n<p><strong>Các bước:</strong></p>\n<ol>\n<li>Thêm dependency <code>room-runtime</code>, <code>room-ktx</code>, <code>room-compiler</code> (qua <strong>KSP</strong>/kapt).</li>\n<li>\n<p>Tạo <strong>Entity:</strong></p>\n<pre class=\"code\" data-lang=\"kotlin\"><code>@Entity(tableName = &quot;users&quot;)\ndata class User(@PrimaryKey(autoGenerate = true) val id: Long = 0, val name: String)</code></pre>\n</li>\n<li>\n<p>Tạo <strong>DAO:</strong></p>\n<pre class=\"code\" data-lang=\"kotlin\"><code>@Dao interface UserDao {\n@Query(&quot;SELECT * FROM users&quot;) fun getAll(): Flow&lt;List&lt;User&gt;&gt;\n@Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun insert(user: User)\n@Delete suspend fun delete(user: User)\n}</code></pre>\n</li>\n<li>\n<p>Tạo <strong>Database</strong> (abstract class kế thừa <code>RoomDatabase</code>):</p>\n<pre class=\"code\" data-lang=\"kotlin\"><code>@Database(entities = [User::class], version = 1)\nabstract class AppDb : RoomDatabase() { abstract fun userDao(): UserDao }</code></pre>\n</li>\n<li>\n<p>Khởi tạo <strong>Singleton</strong> bằng <code>Room.databaseBuilder(context.applicationContext, AppDb::class.java, \"app.db\").build()</code>.</p>\n</li>\n<li>Truy cập qua <strong>Repository</strong>, chạy ngoài main thread (Room mặc định cấm query trên main thread).</li>\n</ol>", "answerNote": "", "more": "<p>Khi đổi schema thì tăng <code>version</code> và cung cấp <code>Migration(1, 2)</code> (hoặc <code>fallbackToDestructiveMigration()</code>). Quan hệ bảng dùng <code>@Relation</code>, <code>@Embedded</code>, <code>@TypeConverter</code> (cho Date/List).</p>", "moreNote": "", "related": "", "text": "L7 . Room là thư viện Jetpack, lớp abstraction trên SQLite : Kiểm tra câu SQL ở compile-time , giảm boilerplate (không cần tự viết Cursor). Hỗ trợ Flow/LiveData/suspend , migration. 3 thành phần chính: @Entity (bảng), @Dao (truy vấn), @Database (điểm truy cập). Các bước: Thêm dependency room-runtime , room-ktx , room-compiler (qua KSP /kapt). Tạo Entity: @Entity(tableName = \"users\") data class User(@PrimaryKey(autoGenerate = true) val id: Long = 0, val name: String) Tạo DAO: @Dao interface UserDao { @Query(\"SELECT * FROM users\") fun getAll(): Flow<List<User>> @Insert(onConflict = OnConflictStrategy.REPLACE) suspend fun insert(user: User) @Delete suspend fun delete(user: User) } Tạo Database (abstract class kế thừa RoomDatabase ): @Database(entities = [User::class], version = 1) abstract class AppDb : RoomDatabase() { abstract fun userDao(): UserDao } Khởi tạo Singleton bằng Room.databaseBuilder(context.applicationContext, AppDb::class.java, \"app.db\").build() . Truy cập qua Repository , chạy ngoài main thread (Room mặc định cấm query trên main thread). Khi đổi schema thì tăng version và cung cấp Migration(1, 2) (hoặc fallbackToDestructiveMigration() ). Quan hệ bảng dùng @Relation , @Embedded , @TypeConverter (cho Date/List)."}, "Q7.3": {"title": "Serializable vs Parcelable? Tại sao Parcelable nhanh hơn?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L7</span> (serialization) ↔ <span class=\"lref\">L6</span> (truyền qua Intent/Binder IPC).", "answer": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Serializable</th>\n<th>Parcelable</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Nguồn gốc</td>\n<td>Java chuẩn</td>\n<td>Android riêng</td>\n</tr>\n<tr>\n<td>Cách dùng</td>\n<td>Chỉ cần <code>implements Serializable</code></td>\n<td>Phải implement <code>writeToParcel()</code> + <code>CREATOR</code> (Kotlin: <code>@Parcelize</code>)</td>\n</tr>\n<tr>\n<td>Cơ chế</td>\n<td><strong>Reflection</strong> lúc runtime</td>\n<td><strong>Ghi/đọc tường minh</strong> từng field</td>\n</tr>\n<tr>\n<td>Tốc độ</td>\n<td>Chậm</td>\n<td><strong>Nhanh hơn</strong> (khoảng 10 lần)</td>\n</tr>\n<tr>\n<td>Dùng cho</td>\n<td>Lưu file, gửi qua mạng</td>\n<td>Truyền qua <strong>Intent/Bundle/Binder (IPC)</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Vì sao Parcelable nhanh hơn:</strong></p>\n<ol>\n<li><strong>Không dùng reflection</strong>: biết trước field cần ghi, thứ tự ghi/đọc do developer định nghĩa.</li>\n<li>Serializable <strong>tạo nhiều object tạm</strong> (metadata của class) nên <strong>GC phải chạy nhiều hơn</strong>.</li>\n<li><code>Parcel</code> là định dạng <strong>tối ưu cho truyền bộ nhớ qua Binder</strong>, không phải định dạng lưu trữ lâu dài.</li>\n</ol>", "answerNote": "", "more": "<p><strong>Không dùng Parcelable để lưu xuống disk</strong>, vì định dạng có thể thay đổi giữa các phiên bản Android. Nên dùng <code>serialVersionUID</code> cho Serializable. Không truyền dữ liệu lớn qua Intent (giới hạn khoảng 1MB → <code>TransactionTooLargeException</code>).</p>", "moreNote": "", "related": "", "text": "L7 (serialization) ↔ L6 (truyền qua Intent/Binder IPC). Serializable Parcelable Nguồn gốc Java chuẩn Android riêng Cách dùng Chỉ cần implements Serializable Phải implement writeToParcel() + CREATOR (Kotlin: @Parcelize ) Cơ chế Reflection lúc runtime Ghi/đọc tường minh từng field Tốc độ Chậm Nhanh hơn (khoảng 10 lần) Dùng cho Lưu file, gửi qua mạng Truyền qua Intent/Bundle/Binder (IPC) Vì sao Parcelable nhanh hơn: Không dùng reflection : biết trước field cần ghi, thứ tự ghi/đọc do developer định nghĩa. Serializable tạo nhiều object tạm (metadata của class) nên GC phải chạy nhiều hơn . Parcel là định dạng tối ưu cho truyền bộ nhớ qua Binder , không phải định dạng lưu trữ lâu dài. Không dùng Parcelable để lưu xuống disk , vì định dạng có thể thay đổi giữa các phiên bản Android. Nên dùng serialVersionUID cho Serializable. Không truyền dữ liệu lớn qua Intent (giới hạn khoảng 1MB → TransactionTooLargeException )."}, "Q7.4": {"title": "Thư viện .aar và .jar khác nhau gì?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L7</span>/Build system (đóng gói module).", "answer": "<ul>\n<li><strong>JAR (Java Archive):</strong> chỉ chứa <strong>file <code>.class</code> đã biên dịch</strong> và resource Java thuần (không có Android resource). Dùng được cho mọi project Java/Kotlin.</li>\n<li><strong>AAR (Android Archive):</strong> thư viện <strong>Android</strong>, ngoài <code>classes.jar</code> còn chứa <strong><code>res/</code></strong> (layout, drawable, string), <strong><code>AndroidManifest.xml</code></strong>, <strong><code>R.txt</code></strong>, <strong>assets</strong>, <strong>native lib <code>.so</code></strong> (<code>jni/</code>), file <strong>ProGuard</strong> rules.</li>\n</ul>\n<p>Thư viện có <strong>UI hoặc resource Android</strong> thì phải dùng <strong>AAR</strong>. Chỉ có logic thuần thì dùng <strong>JAR</strong>.</p>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L7 /Build system (đóng gói module). JAR (Java Archive): chỉ chứa file .class đã biên dịch và resource Java thuần (không có Android resource). Dùng được cho mọi project Java/Kotlin. AAR (Android Archive): thư viện Android , ngoài classes.jar còn chứa res/ (layout, drawable, string), AndroidManifest.xml , R.txt , assets , native lib .so ( jni/ ), file ProGuard rules. Thư viện có UI hoặc resource Android thì phải dùng AAR . Chỉ có logic thuần thì dùng JAR ."}, "Q8.1": {"title": "Unit test là gì? Có quan trọng không? UT có phát hiện được bug không?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L8</span>.", "answer": "<p>Unit test là <strong>kiểm thử đơn vị nhỏ nhất</strong> (hàm/class) <strong>một cách độc lập</strong>, các phụ thuộc bên ngoài được thay bằng mock.</p>\n<ul>\n<li><strong>Quan trọng:</strong> phát hiện lỗi <strong>sớm</strong> (chi phí sửa thấp nhất), <strong>chống regression</strong> khi refactor, đóng vai trò <strong>tài liệu sống</strong> cho code, buộc code phải thiết kế tốt (dễ test = ít phụ thuộc).</li>\n<li><strong>Phát hiện bug:</strong> <strong>có</strong>, nhưng chỉ ở mức <strong>logic bên trong unit</strong> (sai điều kiện, biên, null, exception). UT <strong>không phát hiện</strong> được lỗi tích hợp giữa các module, lỗi UI, lỗi môi trường hay hiệu năng; những lỗi đó cần Integration test, UI test, System test.</li>\n</ul>", "answerNote": "", "more": "", "moreNote": "", "related": "<p>\"Có phải unit test không?\" Nói rõ mình viết UT cho phần nào, framework gì, coverage bao nhiêu %.</p>", "text": "L8 . Unit test là kiểm thử đơn vị nhỏ nhất (hàm/class) một cách độc lập , các phụ thuộc bên ngoài được thay bằng mock. Quan trọng: phát hiện lỗi sớm (chi phí sửa thấp nhất), chống regression khi refactor, đóng vai trò tài liệu sống cho code, buộc code phải thiết kế tốt (dễ test = ít phụ thuộc). Phát hiện bug: có , nhưng chỉ ở mức logic bên trong unit (sai điều kiện, biên, null, exception). UT không phát hiện được lỗi tích hợp giữa các module, lỗi UI, lỗi môi trường hay hiệu năng; những lỗi đó cần Integration test, UI test, System test. \"Có phải unit test không?\" Nói rõ mình viết UT cho phần nào, framework gì, coverage bao nhiêu %."}, "Q8.2": {"title": "UT dựa trên đâu để check? (cơ sở viết test case)", "weak": false, "freq": false, "loc": "<span class=\"lref\">L8</span> ↔ <span class=\"lref\">L3</span>.", "answer": "<p>UT dựa trên <strong>Detail design (LLD) / đặc tả của hàm</strong>, <strong>không dựa trên code</strong>. Viết test theo code thì test luôn đúng với code, kể cả khi code sai.</p>\n<p>Kỹ thuật thiết kế test case:</p>\n<ul>\n<li><strong>Phân vùng tương đương</strong> (Equivalence partitioning).</li>\n<li><strong>Phân tích giá trị biên</strong> (Boundary value: min, min-1, max, max+1).</li>\n<li><strong>Bảng quyết định</strong> (Decision table) cho tổ hợp điều kiện.</li>\n<li><strong>Coverage</strong> (C0/C1/C2) để kiểm tra đã test đủ các nhánh hay chưa.</li>\n</ul>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L8 ↔ L3 . UT dựa trên Detail design (LLD) / đặc tả của hàm , không dựa trên code . Viết test theo code thì test luôn đúng với code, kể cả khi code sai. Kỹ thuật thiết kế test case: Phân vùng tương đương (Equivalence partitioning). Phân tích giá trị biên (Boundary value: min, min-1, max, max+1). Bảng quyết định (Decision table) cho tổ hợp điều kiện. Coverage (C0/C1/C2) để kiểm tra đã test đủ các nhánh hay chưa."}, "Q8.3": {"title": "C0, C1, C2 coverage là gì?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L8</span>.", "answer": "<ul>\n<li><strong>C0 – Statement coverage (命令網羅):</strong> mỗi <strong>câu lệnh</strong> được chạy ít nhất 1 lần.</li>\n<li><strong>C1 – Branch/Decision coverage (分岐網羅):</strong> mỗi <strong>nhánh</strong> (true/false của mỗi <code>if</code>) được chạy ít nhất 1 lần.</li>\n<li><strong>C2 – Condition coverage (条件網羅):</strong> mỗi <strong>điều kiện con</strong> trong biểu thức (<code>a &amp;&amp; b</code>) nhận cả true và false. Ở nhiều công ty Nhật, C2 được hiểu là <strong>tổ hợp tất cả điều kiện</strong> (multiple condition coverage).</li>\n</ul>\n<p>Độ mạnh: C2 ≥ C1 ≥ C0. Đạt C1 = 100% thì C0 cũng đạt 100%.</p>\n<pre class=\"code\" data-lang=\"kotlin\"><code>fun check(a: Boolean, b: Boolean) {\nif (a &amp;&amp; b) doX()\n}\n// C0: (T,T) là đủ, mọi câu lệnh đã chạy\n// C1: (T,T) và (F,): nhánh true và nhánh false\n// C2: a nhận T/F, b nhận T/F → ví dụ (T,T), (T,F), (F,T); tổ hợp đầy đủ gồm 4 case</code></pre>", "answerNote": "", "more": "<p>Ngành automotive thường yêu cầu <strong>C1 = 100%</strong>; phần an toàn cao còn yêu cầu <strong>MC/DC</strong>. Công cụ đo coverage: <strong>JaCoCo</strong>, Android Studio \"Run with Coverage\".</
