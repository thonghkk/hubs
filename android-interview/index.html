p>", "moreNote": "", "related": "", "text": "L8 . C0 – Statement coverage (命令網羅): mỗi câu lệnh được chạy ít nhất 1 lần. C1 – Branch/Decision coverage (分岐網羅): mỗi nhánh (true/false của mỗi if ) được chạy ít nhất 1 lần. C2 – Condition coverage (条件網羅): mỗi điều kiện con trong biểu thức ( a && b ) nhận cả true và false. Ở nhiều công ty Nhật, C2 được hiểu là tổ hợp tất cả điều kiện (multiple condition coverage). Độ mạnh: C2 ≥ C1 ≥ C0. Đạt C1 = 100% thì C0 cũng đạt 100%. fun check(a: Boolean, b: Boolean) { if (a && b) doX() } // C0: (T,T) là đủ, mọi câu lệnh đã chạy // C1: (T,T) và (F,): nhánh true và nhánh false // C2: a nhận T/F, b nhận T/F → ví dụ (T,T), (T,F), (F,T); tổ hợp đầy đủ gồm 4 case Ngành automotive thường yêu cầu C1 = 100% ; phần an toàn cao còn yêu cầu MC/DC . Công cụ đo coverage: JaCoCo , Android Studio \"Run with Coverage\"."}, "Q8.4": {"title": "Mock là gì? Mock vs Stub vs Fake vs Spy?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L8</span> ↔ <span class=\"lref\">L3</span> (DIP: phụ thuộc vào interface mới mock được dễ dàng).", "answer": "<p><strong>Mock</strong> là <strong>object giả</strong> thay thế phụ thuộc thật (DB, network, service) để test unit <strong>độc lập</strong>, đồng thời <strong>kiểm tra (verify) tương tác</strong>: method có được gọi không, gọi mấy lần, với tham số gì.</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Loại</th>\n<th>Mô tả</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Stub</strong></td>\n<td>Trả về dữ liệu cố định, chỉ để test chạy được</td>\n</tr>\n<tr>\n<td><strong>Mock</strong></td>\n<td>Stub + <strong>verify hành vi</strong> (<code>verify(repo).save(user)</code>)</td>\n</tr>\n<tr>\n<td><strong>Fake</strong></td>\n<td>Bản implement đơn giản nhưng <strong>chạy thật</strong> (in-memory DB)</td>\n</tr>\n<tr>\n<td><strong>Spy</strong></td>\n<td>Bọc object <strong>thật</strong>, có thể theo dõi và ghi đè một vài method</td>\n</tr>\n</tbody>\n</table></div>\n<pre class=\"code\" data-lang=\"kotlin\"><code>val repo = mockk&lt;UserRepository&gt;()\ncoEvery { repo.getUser(1) } returns User(1, &quot;A&quot;)\nval vm = UserViewModel(repo)\nvm.load(1)\ncoVerify(exactly = 1) { repo.getUser(1) }</code></pre>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L8 ↔ L3 (DIP: phụ thuộc vào interface mới mock được dễ dàng). Mock là object giả thay thế phụ thuộc thật (DB, network, service) để test unit độc lập , đồng thời kiểm tra (verify) tương tác : method có được gọi không, gọi mấy lần, với tham số gì. Loại Mô tả Stub Trả về dữ liệu cố định, chỉ để test chạy được Mock Stub + verify hành vi ( verify(repo).save(user) ) Fake Bản implement đơn giản nhưng chạy thật (in-memory DB) Spy Bọc object thật , có thể theo dõi và ghi đè một vài method val repo = mockk<UserRepository>() coEvery { repo.getUser(1) } returns User(1, \"A\") val vm = UserViewModel(repo) vm.load(1) coVerify(exactly = 1) { repo.getUser(1) }"}, "Q8.5": {"title": "Những framework viết unit test đã biết?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L8</span>.", "answer": "<ul>\n<li><strong>JUnit 4/5:</strong> framework nền tảng (<code>@Test</code>, <code>@Before</code>, assert).</li>\n<li><strong>Mockito / Mockito-Kotlin</strong>, <strong>MockK</strong> (Kotlin-first, hỗ trợ coroutine, <code>object</code>, extension).</li>\n<li><strong>Robolectric:</strong> chạy test có dùng Android API trên JVM, không cần thiết bị.</li>\n<li><strong>kotlinx-coroutines-test</strong> (<code>runTest</code>, <code>StandardTestDispatcher</code>), <strong>Turbine</strong> (test Flow).</li>\n<li><strong>Truth / AssertJ:</strong> assertion dễ đọc.</li>\n<li><strong>Instrumented/UI test:</strong> <strong>Espresso</strong>, UI Automator, Compose UI Test, <code>AndroidJUnitRunner</code>.</li>\n<li><strong>Coverage:</strong> JaCoCo.</li>\n</ul>", "answerNote": "", "more": "<p>nhiều <strong>Unit test</strong> (nhanh, rẻ) → ít hơn <strong>Integration test</strong> → ít nhất <strong>UI/E2E test</strong> (chậm, dễ flaky).\nThư mục: <code>src/test/</code> (local JVM) và <code>src/androidTest/</code> (chạy trên thiết bị).</p>", "moreNote": "kim tự tháp test", "related": "", "text": "L8 . JUnit 4/5: framework nền tảng ( @Test , @Before , assert). Mockito / Mockito-Kotlin , MockK (Kotlin-first, hỗ trợ coroutine, object , extension). Robolectric: chạy test có dùng Android API trên JVM, không cần thiết bị. kotlinx-coroutines-test ( runTest , StandardTestDispatcher ), Turbine (test Flow). Truth / AssertJ: assertion dễ đọc. Instrumented/UI test: Espresso , UI Automator, Compose UI Test, AndroidJUnitRunner . Coverage: JaCoCo. nhiều Unit test (nhanh, rẻ) → ít hơn Integration test → ít nhất UI/E2E test (chậm, dễ flaky). Thư mục: src/test/ (local JVM) và src/androidTest/ (chạy trên thiết bị)."}, "Q9.1": {"title": "Khi gặp lỗi thì dùng những phương pháp nào để debug? Tools fix bug?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L9</span>.", "answer": "<ol>\n<li><strong>Reproduce:</strong> xác định bước tái hiện, môi trường, phiên bản.</li>\n<li><strong>Thu thập thông tin:</strong> đọc <strong>stack trace / logcat</strong>, ANR traces, tombstone.</li>\n<li><strong>Khoanh vùng:</strong> thêm log, đặt <strong>breakpoint</strong>, so sánh với phiên bản trước (<code>git bisect</code>), loại trừ dần.</li>\n<li><strong>Tìm root cause</strong> (không chỉ sửa triệu chứng) → fix → <strong>viết UT</strong> để chống tái phát → review.</li>\n</ol>\n<p><strong>Tools:</strong></p>\n<ul>\n<li><strong>Android Studio Debugger:</strong> breakpoint, <strong>conditional breakpoint</strong>, Evaluate Expression, watch, <strong>attach debugger to process</strong>.</li>\n<li><strong>Logcat</strong>, <code>adb logcat</code>, <code>adb bugreport</code>, <code>adb shell dumpsys &lt;service&gt;</code> (activity, meminfo, battery...).</li>\n<li><strong>Profiler:</strong> CPU, Memory (heap dump), Network, Energy. <strong>Perfetto/Systrace</strong> để phân tích jank.</li>\n<li><strong>Layout Inspector</strong>, <strong>Database Inspector</strong>, <strong>App Inspection</strong>.</li>\n<li><strong>LeakCanary</strong>, <strong>StrictMode</strong> (phát hiện I/O trên main thread).</li>\n<li><strong>Firebase Crashlytics</strong> (crash từ người dùng thật), <code>ndk-stack</code>/<code>addr2line</code> (crash native).</li>\n</ul>", "answerNote": "quy trình", "more": "", "moreNote": "", "related": "", "text": "L9 . Reproduce: xác định bước tái hiện, môi trường, phiên bản. Thu thập thông tin: đọc stack trace / logcat , ANR traces, tombstone. Khoanh vùng: thêm log, đặt breakpoint , so sánh với phiên bản trước ( git bisect ), loại trừ dần. Tìm root cause (không chỉ sửa triệu chứng) → fix → viết UT để chống tái phát → review. Tools: Android Studio Debugger: breakpoint, conditional breakpoint , Evaluate Expression, watch, attach debugger to process . Logcat , adb logcat , adb bugreport , adb shell dumpsys <service> (activity, meminfo, battery...). Profiler: CPU, Memory (heap dump), Network, Energy. Perfetto/Systrace để phân tích jank. Layout Inspector , Database Inspector , App Inspection . LeakCanary , StrictMode (phát hiện I/O trên main thread). Firebase Crashlytics (crash từ người dùng thật), ndk-stack / addr2line (crash native)."}, "Q9.2": {"title": "Log level có những loại nào? Khi nào dùng?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L9</span>.", "answer": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Level</th>\n<th>Hàm</th>\n<th>Khi dùng</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>V</strong>erbose</td>\n<td><code>Log.v</code></td>\n<td>Chi tiết nhất, chỉ dùng khi dev, không để lại trong bản release</td>\n</tr>\n<tr>\n<td><strong>D</strong>ebug</td>\n<td><code>Log.d</code></td>\n<td>Thông tin debug: giá trị biến, luồng xử lý</td>\n</tr>\n<tr>\n<td><strong>I</strong>nfo</td>\n<td><code>Log.i</code></td>\n<td>Sự kiện bình thường quan trọng: service start, kết nối thành công</td>\n</tr>\n<tr>\n<td><strong>W</strong>arn</td>\n<td><code>Log.w</code></td>\n<td>Bất thường nhưng app vẫn chạy được: retry, fallback, API deprecated</td>\n</tr>\n<tr>\n<td><strong>E</strong>rror</td>\n<td><code>Log.e</code></td>\n<td>Lỗi: exception, thao tác thất bại</td>\n</tr>\n<tr>\n<td><strong>A</strong>ssert</td>\n<td><code>Log.wtf</code></td>\n<td>Lỗi \"không bao giờ được xảy ra\" (What a Terrible Failure)</td>\n</tr>\n</tbody>\n</table></div>", "answerNote": "từ thấp đến cao", "more": "<p>Bản release nên tắt V/D (dùng ProGuard/R8 strip hoặc <code>if (BuildConfig.DEBUG)</code>, hoặc dùng Timber), <strong>không log dữ liệu nhạy cảm</strong> (token, thông tin cá nhân).</p>", "moreNote": "", "related": "", "text": "L9 . Level Hàm Khi dùng V erbose Log.v Chi tiết nhất, chỉ dùng khi dev, không để lại trong bản release D ebug Log.d Thông tin debug: giá trị biến, luồng xử lý I nfo Log.i Sự kiện bình thường quan trọng: service start, kết nối thành công W arn Log.w Bất thường nhưng app vẫn chạy được: retry, fallback, API deprecated E rror Log.e Lỗi: exception, thao tác thất bại A ssert Log.wtf Lỗi \"không bao giờ được xảy ra\" (What a Terrible Failure) Bản release nên tắt V/D (dùng ProGuard/R8 strip hoặc if (BuildConfig.DEBUG) , hoặc dùng Timber), không log dữ liệu nhạy cảm (token, thông tin cá nhân)."}, "Q9.3": {"title": "Log trong Android Studio được lấy ra từ đâu?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L9</span> ↔ <span class=\"lref\">L6</span> (platform).", "answer": "<p>Log được ghi vào các <strong>ring buffer trong bộ nhớ</strong> do daemon <strong><code>logd</code></strong> trên thiết bị quản lý. Log <strong>không ghi ra file</strong> theo mặc định. Android Studio (Logcat window) <strong>đọc các buffer này qua <code>adb</code></strong> (adb client → adb server trên PC → <code>adbd</code> trên thiết bị → <code>logd</code>).</p>\n<p><strong>Các buffer:</strong> <code>main</code> (log của app), <code>system</code> (log hệ thống), <code>crash</code> (crash), <code>events</code> (sự kiện hệ thống dạng binary), <code>radio</code> (telephony), <code>kernel</code>.</p>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L9 ↔ L6 (platform). Log được ghi vào các ring buffer trong bộ nhớ do daemon logd trên thiết bị quản lý. Log không ghi ra file theo mặc định. Android Studio (Logcat window) đọc các buffer này qua adb (adb client → adb server trên PC → adbd trên thiết bị → logd ). Các buffer: main (log của app), system (log hệ thống), crash (crash), events (sự kiện hệ thống dạng binary), radio (telephony), kernel ."}, "Q9.4": {"title": "Những cách lấy log / lệnh adb log?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L9</span>.", "answer": "<pre class=\"code\" data-lang=\"bash\"><code>adb logcat # xem log realtime\nadb logcat -d &gt; log.txt # dump log hiện có ra file rồi thoát\nadb logcat -c # xóa buffer\nadb logcat -v threadtime # format có thời gian, PID, TID\nadb logcat -b main -b system -b crash # chọn buffer (-b all = tất cả)\nadb logcat MyTag:D :S # chỉ lấy tag MyTag từ level D trở lên, ẩn phần còn lại\nadb logcat :E # chỉ lấy Error trở lên\nadb logcat --pid=$(adb shell pidof -s com.example.app) # lọc theo process\nadb bugreport bugreport.zip # toàn bộ log + dumpsys + ANR traces\nadb shell dumpsys activity # trạng thái hệ thống/service\nadb pull /data/anr/ # ANR traces (cần quyền root/debuggable)</code></pre>\n<p>Ngoài ra còn: Logcat trong Android Studio (lọc theo package, level, tag, regex), log ra file bằng code, Crashlytics.</p>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L9 . adb logcat # xem log realtime adb logcat -d > log.txt # dump log hiện có ra file rồi thoát adb logcat -c # xóa buffer adb logcat -v threadtime # format có thời gian, PID, TID adb logcat -b main -b system -b crash # chọn buffer (-b all = tất cả) adb logcat MyTag:D :S # chỉ lấy tag MyTag từ level D trở lên, ẩn phần còn lại adb logcat :E # chỉ lấy Error trở lên adb logcat --pid=$(adb shell pidof -s com.example.app) # lọc theo process adb bugreport bugreport.zip # toàn bộ log + dumpsys + ANR traces adb shell dumpsys activity # trạng thái hệ thống/service adb pull /data/anr/ # ANR traces (cần quyền root/debuggable) Ngoài ra còn: Logcat trong Android Studio (lọc theo package, level, tag, regex), log ra file bằng code, Crashlytics."}, "Q9.5": {"title": "Logcat buffer size?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L9</span>.", "answer": "<ul>\n<li>Mặc định mỗi buffer khoảng <strong>256KB</strong> trên hầu hết thiết bị (máy cũ hoặc low-RAM có thể là 64KB). Buffer đầy thì log cũ bị <strong>ghi đè (ring buffer)</strong>.</li>\n<li>Xem kích thước: <code>adb logcat -g</code>.</li>\n<li>Thay đổi:<ul>\n<li><strong>Developer options → Logger buffer sizes</strong> (64K, 256K, 1M, 4M, 16M); hoặc</li>\n<li><code>adb logcat -G 16M</code> (có thể bị reset khi reboot); hoặc</li>\n<li>System property <code>persist.logd.size</code>.</li>\n</ul>\n</li>\n</ul>", "answerNote": "", "more": "<p>Khi debug lỗi khó tái hiện mà bị mất log thì <strong>tăng buffer size</strong> hoặc dump log ra file liên tục (<code>adb logcat -f</code> / <code>&gt; file</code>).</p>", "moreNote": "", "related": "", "text": "L9 . Mặc định mỗi buffer khoảng 256KB trên hầu hết thiết bị (máy cũ hoặc low-RAM có thể là 64KB). Buffer đầy thì log cũ bị ghi đè (ring buffer) . Xem kích thước: adb logcat -g . Thay đổi: Developer options → Logger buffer sizes (64K, 256K, 1M, 4M, 16M); hoặc adb logcat -G 16M (có thể bị reset khi reboot); hoặc System property persist.logd.size . Khi debug lỗi khó tái hiện mà bị mất log thì tăng buffer size hoặc dump log ra file liên tục ( adb logcat -f / > file )."}}, "order": ["Q0.1", "Q0.2", "Q0.3", "Q1.1", "Q1.2", "Q1.3", "Q1.4", "Q1.5", "Q1.6", "Q2.1", "Q2.2", "Q2.3", "Q3.1", "Q3.2", "Q3.3", "Q3.4", "Q3.5", "Q3.6", "Q3.7", "Q3.8", "Q3.9", "Q3.10", "Q4.1", "Q4.2", "Q4.3", "Q4.4", "Q4.5", "Q4.6", "Q4.7", "Q4.8", "Q4.9", "Q4.10", "Q4.11", "Q4b.1", "Q4b.2", "Q4b.3", "Q4b.4", "Q4b.5", "Q4b.6", "Q4b.7", "Q4b.8", "Q4b.9", "Q5.1", "Q5.2", "Q5.3", "Q5.4", "Q5.5", "Q5.6", "Q5.7", "Q5.8", "Q5.9", "Q5.10", "Q6.1", "Q6.2", "Q6.3", "Q6.4", "Q6.5", "Q6.6", "Q7.1", "Q7.2", "Q7.3", "Q7.4", "Q8.1", "Q8.2", "Q8.3", "Q8.4", "Q8.5", "Q9.1", "Q9.2", "Q9.3", "Q9.4", "Q9.5"], "weeks": [{"name": "Tuần 1", "focus": "Các câu từng hụt và kỹ năng thiết kế", "ids": ["Q2.2", "Q3.1", "Q3.2", "Q3.3", "Q3.4", "Q3.5", "Q3.6", "Q3.7", "Q3.8", "Q3.9", "Q3.10", "Q4.2", "Q5.1"]}, {"name": "Tuần 2", "focus": "Android Framework, concurrency, memory", "ids": ["Q6.1", "Q6.2", "Q6.3", "Q6.4", "Q6.5", "Q6.6", "Q7.1", "Q7.2", "Q7.3", "Q7.4", "Q5.2", "Q5.3", "Q5.4", "Q5.5", "Q5.6", "Q5.7", "Q5.8", "Q5.9", "Q5.10"]}, {"name": "Tuần 3", "focus": "Ngôn ngữ, CTDL, testing, debug, quy trình, giới thiệu", "ids": ["Q0.1", "Q0.2", "Q0.3", "Q1.1", "Q1.2", "Q1.3", "Q1.4", "Q1.5", "Q1.6", "Q2.1", "Q2.3", "Q4.1", "Q4.3", "Q4.4", "Q4.5", "Q4.6", "Q4.7", "Q4.8", "Q4.9", "Q4.10", "Q4.11", "Q4b.1", "Q4b.2", "Q4b.3", "Q4b.4", "Q4b.5", "Q4b.6", "Q4b.7", "Q4b.8", "Q4b.9", "Q8.1", "Q8.2", "Q8.3", "Q8.4", "Q8.5", "Q9.1", "Q9.2", "Q9.3", "Q9.4", "Q9.5"]}], "roadmap": "<blockquote>\n<p>Mục tiêu: xác nhận <strong>(1)</strong> đã ôn đủ mọi nội dung trong ghi chú gốc, và <strong>(2)</strong> thực sự <em>trả lời được</em>, không chỉ <em>đọc hiểu</em>.</p>\n</blockquote>\n<h3>Giai đoạn 1 – Kiểm tra độ phủ (30 phút, làm 1 lần)</h3>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"rm-check\" id=\"rm-1\" data-key=\"rm-1\"> Đọc <a href=\"#\" data-view=\"trace\">Bảng truy vết</a>, đối chiếu từng dòng ghi chú gốc (text + 3 ảnh) để chắc chắn đều có câu hỏi tương ứng.</li>\n<li class=\"task\"><input type=\"checkbox\" class=\"rm-check\" id=\"rm-2\" data-key=\"rm-2\"> Đánh dấu thêm các câu hỏi mới gặp trong buổi phỏng vấn gần nhất (nếu có), bổ sung vào file theo đúng tầng L0–L9.</li>\n</ul>\n<h3>Giai đoạn 2 – Ôn theo mức ưu tiên (2–3 tuần)</h3>\n<div id=\"weeks-slot\"></div>\n<p>Nhịp mỗi ngày (~60–90 phút):</p>\n<ol>\n<li><strong>15'</strong> – Ôn lại các câu bị chấm 0–1 của hôm trước (spaced repetition).</li>\n<li><strong>45'</strong> – Học nhóm câu mới của ngày.</li>\n<li><strong>15'</strong> – Tự kiểm tra: che phần trả lời, <strong>nói to</strong> câu trả lời rồi chấm điểm.</li>\n</ol>\n<h3>Giai đoạn 3 – Cách tự kiểm tra một câu hỏi</h3>\n<p>Một câu được tính là <strong>\"đã xong\"</strong> khi đạt đủ 4 tiêu chí:</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>#</th>\n<th>Tiêu chí</th>\n<th>Cách kiểm tra</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td><strong>Trả lời ngắn trong ≤ 60s</strong></td>\n<td>Bấm giờ, nói to (hoặc ghi âm) mà không nhìn tài liệu</td>\n</tr>\n<tr>\n<td>2</td>\n<td><strong>Giải thích được \"tại sao\"</strong></td>\n<td>Tự hỏi \"tại sao?\" 2 lần liên tiếp và vẫn trả lời được</td>\n</tr>\n<tr>\n<td>3</td>\n<td><strong>Có ví dụ thực tế</strong></td>\n<td>Liên hệ được với dự án mình đã làm hoặc với một API Android cụ thể</td>\n</tr>\n<tr>\n<td>4</td>\n<td><strong>Trả lời được câu \"Hỏi tương tự\"</strong></td>\n<td>Trả lời được ít nhất 1 câu follow-up</td>\n</tr>\n</tbody>\n</table></div>\n<p>Thang điểm tự đánh giá: <strong>0</strong> = không biết · <strong>1</strong> = biết mơ hồ · <strong>2</strong> = trả lời được nhưng ấp úng · <strong>3</strong> = đạt cả 4 tiêu chí.</p>\n<p>Với các câu có code (Singleton DCL, Binary Search, Room, AIDL, UT với mock): <strong>viết tay hoặc trên giấy, không dùng IDE</strong>, sau đó mới chạy thử để kiểm tra.</p>\n<h3>Giai đoạn 4 – Mock interview (cuối mỗi tuần)</h3>\n<ul>\n<li class=\"task\"><input type=\"checkbox\" class=\"rm-check\" id=\"rm-3\" data-key=\"rm-3\"> Nhờ đồng nghiệp hoặc tự hỏi ngẫu nhiên 10 câu, kèm 1 câu tình huống thiết kế (ví dụ \"Thiết kế HLD/LLD cho app download file có resume\"), trong 45 phút.</li>\n<li class=\"task\"><input type=\"checkbox\" class=\"rm-check\" id=\"rm-4\" data-key=\"rm-4\"> Phần giới thiệu bản thân và dự án <strong>bằng tiếng Anh</strong>: ghi âm, nghe lại, sửa.</li>\n<li class=\"task\"><input type=\"checkbox\" class=\"rm-check\" id=\"rm-5\" data-key=\"rm-5\"> Vẽ lại trên giấy: block diagram dự án, 1 class diagram, 1 sequence diagram (bind AIDL service).</li>\n<li class=\"task\"><input type=\"checkbox\" class=\"rm-check\" id=\"rm-6\" data-key=\"rm-6\"> Ghi lại các câu bị bí, đưa chúng vào lại vòng ôn.</li>\n</ul>", "trace": "<blockquote>\n<p>Dùng để kiểm tra <strong>không bỏ sót</strong> nội dung nào trong ghi chú gốc.</p>\n</blockquote>\n<h3>Ảnh 1 – Ghi chú của Loan NT</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Ghi chú gốc</th>\n<th>Câu hỏi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Các dự án đã tham gia</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q0.2\">Q0.2</a></td>\n</tr>\n<tr>\n<td>Kotlin vs Java (Null safety, coroutine)</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4.6\">Q4.6</a>, <a class=\"qref\" href=\"#\" data-q=\"Q4.7\">Q4.7</a>, <a class=\"qref\" href=\"#\" data-q=\"Q4.9\">Q4.9</a>, <a class=\"qref\" href=\"#\" data-q=\"Q4.10\">Q4.10</a></td>\n</tr>\n<tr>\n<td>Mô hình phát triển phần mềm</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q1.1\">Q1.1</a>, <a class=\"qref\" href=\"#\" data-q=\"Q1.2\">Q1.2</a></td>\n</tr>\n<tr>\n<td>Design pattern (là gì, Observable, LiveData, Singleton)</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q3.2\">Q3.2</a>, <a class=\"qref\" href=\"#\" data-q=\"Q3.6\">Q3.6</a>, <a class=\"qref\" href=\"#\" data-q=\"Q3.3\">Q3.3</a></td>\n</tr>\n<tr>\n<td>UML, các mối quan hệ trong class diagram</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q3.8\">Q3.8</a></td>\n</tr>\n<tr>\n<td>Đa tiến trình, cách giao tiếp đa tiến trình</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q5.6\">Q5.6</a>, <a class=\"qref\" href=\"#\" data-q=\"Q6.4\">Q6.4</a>, <a class=\"qref\" href=\"#\" data-q=\"Q6.5\">Q6.5</a></td>\n</tr>\n<tr>\n<td>Database (các loại lưu, Room là gì, các bước tạo Room)</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q7.1\">Q7.1</a>, <a class=\"qref\" href=\"#\" data-q=\"Q7.2\">Q7.2</a></td>\n</tr>\n<tr>\n<td Q7.1\">Q7.1</a>, <a class=\"qref\" href=\"#\" data-q=\"Q7.4\">Q7.4</a></td>\n</tr>\n<tr>\n<td>Tools fix bug, 1 bug nhớ nhất</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q9.1\">Q9.1</a>, <a class=\"qref\" href=\"#\" data-q=\"Q0.3\">Q0.3</a></td>\n</tr>\n<tr>\n<td>C++ với Java trong cùng ứng dụng</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q6.6\">Q6.6</a></td>\n</tr>\n</tbody>\n</table></div>\n<h3>Ảnh 1 – Kết quả DuyTD13 (nhận xét)</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Ghi chú gốc</th>\n<th>Câu hỏi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\"Cần trau dồi thêm kỹ năng thiết kế, Android Framework\"</td>\n<td>Tuần 1 (L2–L3) và Tuần 2 (L6–L7) trong lộ trình</td>\n</tr>\n</tbody>\n</table></div>\n<h3>Ảnh 1, 2, 3 – Danh sách câu hỏi dạng đoạn văn</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Ghi chú gốc</th>\n<th>Câu hỏi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Binary Search độ phức tạp</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4b.7\">Q4b.7</a></td>\n</tr>\n<tr>\n<td>DFS, BFS</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4b.8\">Q4b.8</a></td>\n</tr>\n<tr>\n<td>Quick Sort, Merge Sort</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4b.9\">Q4b.9</a></td>\n</tr>\n<tr>\n<td>Vì sao thread.destroy ít sử dụng</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q5.2\">Q5.2</a></td>\n</tr>\n<tr>\n<td>Executor service vì sao hiệu suất cao</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q5.1\">Q5.1</a></td>\n</tr>\n<tr>\n<td>notify() và notifyAll() và await()</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q5.3\">Q5.3</a></td>\n</tr>\n<tr>\n<td>High level design, Low level design</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q2.2\">Q2.2</a></td>\n</tr>\n<tr>\n<td>Project backlog, Sprint backlog</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q1.5\">Q1.5</a></td>\n</tr>\n<tr>\n<td>Sequence Diagram</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q3.10\">Q3.10</a></td>\n</tr>\n<tr>\n<td>SOLID</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q3.1\">Q3.1</a></td>\n</tr>\n<tr>\n<td>Array vs Collection</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4b.1\">Q4b.1</a></td>\n</tr>\n<tr>\n<td>Abstract class và Interface</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4.2\">Q4.2</a></td>\n</tr>\n<tr>\n<td>Hashtable là gì, 2 mã băm khác nhau thì ntn</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4b.5\">Q4b.5</a>, <a class=\"qref\" href=\"#\" data-q=\"Q4b.6\">Q4b.6</a></td>\n</tr>\n<tr>\n<td>IPC, AIDL</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q6.4\">Q6.4</a>, <a class=\"qref\" href=\"#\" data-q=\"Q6.5\">Q6.5</a></td>\n</tr>\n<tr>\n<td>Chia sẻ dữ liệu giữa 2 thread → shared variable</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q5.4\">Q5.4</a></td>\n</tr>\n<tr>\n<td>Coroutine có những scope nào</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4.10\">Q4.10</a></td>\n</tr>\n<tr>\n<td>Suspend func</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4.9\">Q4.9</a></td>\n</tr>\n</tbody>\n</table></div>\n<h3>Ghi chú dạng text</h3>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Ghi chú gốc</th>\n<th>Câu hỏi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Tính đa hình / override / overload</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4.1\">Q4.1</a></td>\n</tr>\n<tr>\n<td>Design pattern: có 3 loại</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q3.2\">Q3.2</a></td>\n</tr>\n<tr>\n<td>Start service multi time</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q6.2\">Q6.2</a></td>\n</tr>\n<tr>\n<td>UML: class diagram</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q3.8\">Q3.8</a></td>\n</tr>\n<tr>\n<td>GC</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q5.8\">Q5.8</a></td>\n</tr>\n<tr>\n<td>WeakReference</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q5.9\">Q5.9</a></td>\n</tr>\n<tr>\n<td>Serializable / Parcelable (tại sao Parcelable nhanh hơn)</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q7.3\">Q7.3</a></td>\n</tr>\n<tr>\n<td>Mô tả công việc đang làm</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q0.2\">Q0.2</a></td>\n</tr>\n<tr>\n<td>Database</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q7.1\">Q7.1</a>, <a class=\"qref\" href=\"#\" data-q=\"Q7.2\">Q7.2</a></td>\n</tr>\n<tr>\n<td>Unit test / Có phải UT không / framework UT</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q8.1\">Q8.1</a>, <a class=\"qref\" href=\"#\" data-q=\"Q8.5\">Q8.5</a></td>\n</tr>\n<tr>\n<td>Các loại item trong collection hay dùng / Hay làm việc với collection nào</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4b.3\">Q4b.3</a></td>\n</tr>\n<tr>\n<td>ArrayList / LinkedList</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4b.4\">Q4b.4</a></td>\n</tr>\n<tr>\n<td>Mô hình phát triển phần mềm / Waterfall vs Agile</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q1.1\">Q1.1</a>, <a class=\"qref\" href=\"#\" data-q=\"Q1.2\">Q1.2</a></td>\n</tr>\n<tr>\n<td>Client Server / Peer to Peer</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q2.3\">Q2.3</a></td>\n</tr>\n<tr>\n<td>⚠️ abstract / interface</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4.2\">Q4.2</a></td>\n</tr>\n<tr>\n<td>⚠️ Builder tạo đối tượng thông qua constructor</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q3.4\">Q3.4</a></td>\n</tr>\n<tr>\n<td>⚠️ Adapter chưa chuẩn (giữa các interface)</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q3.5\">Q3.5</a></td>\n</tr>\n<tr>\n<td>⚠️ Singleton trong multi thread → thread safe</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q3.3\">Q3.3</a></td>\n</tr>\n<tr>\n<td>⚠️ Thread pool</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q5.1\">Q5.1</a></td>\n</tr>\n<tr>\n<td>⚠️ Làm tầng dưới?</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q6.1\">Q6.1</a></td>\n</tr>\n<tr>\n<td>SOLID</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q3.1\">Q3.1</a></td>\n</tr>\n<tr>\n<td>Access modifier</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4.4\">Q4.4</a></td>\n</tr>\n<tr>\n<td>Static / final; cách thay đổi giá trị biến final</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4.5\">Q4.5</a></td>\n</tr>\n<tr>\n<td>Các thành phần của sequence diagram</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q3.10\">Q3.10</a></td>\n</tr>\n<tr>\n<td>Các loại design pattern / đã sử dụng những cái nào</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q3.2\">Q3.2</a>, <a class=\"qref\" href=\"#\" data-q=\"Q3.7\">Q3.7</a></td>\n</tr>\n<tr>\n<td>Vai trò của observer</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q3.6\">Q3.6</a></td>\n</tr>\n<tr>\n<td>Deadlock là gì, how to prevent</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q5.5\">Q5.5</a></td>\n</tr>\n<tr>\n<td>Reactive programming</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q5.7\">Q5.7</a></td>\n</tr>\n<tr>\n<td>Phương pháp debug khi gặp lỗi</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q9.1\">Q9.1</a></td>\n</tr>\n<tr>\n<td>Log level có những loại nào, khi nào dùng</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q9.2\">Q9.2</a></td>\n</tr>\n<tr>\n<td>Log Android Studio được lấy ra ở đâu</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q9.3\">Q9.3</a></td>\n</tr>\n<tr>\n<td>Cách lấy / tool adb log</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q9.4\">Q9.4</a></td>\n</tr>\n<tr>\n<td>Logcat buffer size</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q9.5\">Q9.5</a></td>\n</tr>\n<tr>\n<td>HashMap / HashTable</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4b.5\">Q4b.5</a></td>\n</tr>\n<tr>\n<td>Array / ArrayList → Array chỉ dùng với kiểu nguyên thủy?</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4b.1\">Q4b.1</a></td>\n</tr>\n<tr>\n<td>Bỏ 1 phần tử của array</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4b.2\">Q4b.2</a></td>\n</tr>\n<tr>\n<td>Đặc trưng của Scrum / khi nào sử dụng</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q1.4\">Q1.4</a></td>\n</tr>\n<tr>\n<td>Đa hình trong LTHĐT</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4.1\">Q4.1</a></td>\n</tr>\n<tr>\n<td>Khi nào dùng interface / abstract</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4.2\">Q4.2</a></td>\n</tr>\n<tr>\n<td>Khi nào không cần override method trong interface</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4.3\">Q4.3</a></td>\n</tr>\n<tr>\n<td>Các loại exception trong Java</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q4.11\">Q4.11</a></td>\n</tr>\n<tr>\n<td>Tối ưu, xử lý lỗi liên quan memory</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q5.10\">Q5.10</a></td>\n</tr>\n<tr>\n<td>Non functional requirement</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q2.1\">Q2.1</a></td>\n</tr>\n<tr>\n<td>Kết hợp Scrum / Waterfall</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q1.3\">Q1.3</a></td>\n</tr>\n<tr>\n<td>Vai trò của Scrum Master</td>\n<td><a class=\"qref\" href=\"#\" data-q=\"Q1.6\">Q1.6</a></td>\n</tr>\n</tbody>\n</table></div>"}</script>
<script>

(() => {
const D = JSON.parse(document.getElementById('bank-data').textContent);
const Q = D.questions, ORDER = D.order, SECS = D.sections, WEEKS = D.weeks;
const LABELS = ['Không biết', 'Mơ hồ', 'Ấp úng', 'Thành thạo'];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
const pad = n => String(n).padStart(2, '0');
const fmt = t => { const d = new Date(t); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const narrow = () => matchMedia('(max-width: 899px)').matches;
const secOf = {};
SECS.forEach((s, i) => s.qs.forEach(id => { secOf[id] = i; }));
ORDER.forEach(id => { Q[id].idx = norm(id + ' ' + Q[id].title + ' ' + Q[id].text); });
const KEY = 'pvq-android:';
const load = (k, d) => { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch (e) { /* trình duyệt chặn lưu trữ */ } };
const st = {
view: load('view2', 'learn'), scope: load('scope2', 'all'), filter: 'all', mode: load('mode', 'read'),
cur: load('cur', null), query: '', ids: [], revealed: false, used: 0, t0: 0, done: false,
scores: load('scores', {}), checks: load('checks', {}),
};
const hashView = location.hash.slice(1);
if (['learn', 'progress', 'trace'].includes(hashView)) st.view = hashView;
if (!['learn', 'progress', 'trace'].includes(st.view)) st.view = 'learn';
let timerId = null, progressBuilt = false, traceBuilt = false;
const app = $('#app'), search = $('#search');
const score = id => { const h = st.scores[id]; return h && h.length ? h[h.length - 1].s : null; };
const sclass = s => s == null ? 'sn' : 's' + s;
const goalMet = id => { const s = score(id); return Q[id].weak ? s === 3 : s != null && s >= 2; };
const FILTERS = [
['all', 'Tất cả', () => true],
['weak', 'Từng hụt', id => Q[id].weak],
['freq', 'Hay hỏi', id => Q[id].freq],
['todo', 'Chưa đạt', id => !goalMet(id)],
];
function scopeInfo(k) {
if (k && k[0] === 's' && SECS[+k.slice(1)]) { const s = SECS[+k.slice(1)]; return { code: s.code, short: s.name, name: s.name, ids: s.qs }; }
if (k && k[0] === 'w' && WEEKS[+k.slice(1)]) { const i = +k.slice(1), w = WEEKS[i]; return { code: 'T' + (i + 1), short: w.name, name: `${w.name}: ${w.focus}`, ids: w.ids }; }
return { code: '∑', short: 'Toàn bộ câu hỏi', name: 'Toàn bộ câu hỏi', ids: ORDER };
}
const allScopes = () => ['all', ...WEEKS.map((_, i) => 'w' + i), ...SECS.map((_, i) => 's' + i)];
function bar(ids, cls = '') {
const c = [0, 0, 0, 0], n = ids.length || 1;
ids.forEach(id => { const s = score(id); if (s != null) c[s]++; });
return `<span class="bar ${cls}" aria-hidden="true">${[3, 2, 1, 0].map(s => c[s] ? `<i class="s${s}" style="width:${c[s] / n * 100}%"></i>` : '').join('')}</span>`;
}
const flags = q => (q.weak ? '<span class="flag weak" title="Từng trả lời chưa tốt">Từng hụt</span>' : '') +
(q.freq ? '<span class="flag freq" title="Xuất hiện ở nhiều buổi phỏng vấn">Hay hỏi</span>' : '');
/* ---------- Giao diện sáng/tối ---------- */
const THEMES = { system: 'Hệ thống', light: 'Sáng', dark: 'Tối' };
let theme = load('theme', 'system');
function applyTheme() {
if (theme === 'system') document.documentElement.removeAttribute('data-theme');
else document.documentElement.setAttribute('data-theme', theme);
$('#theme-btn').textContent = 'Giao diện: ' + THEMES[theme];
}
/* ---------- Cột 1 ---------- */
function renderSide() {
document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.view === st.view));
$('#nav-count').textContent = ORDER.length;
$('#nav-progress').textContent = `${ORDER.filter(goalMet).length}/${ORDER.length}`;
const item = k => {
const s = scopeInfo(k), met = s.ids.filter(goalMet).length;
const on = st.view === 'learn' && !st.query && st.scope === k;
return `<li><button type="button" class="layer" data-scope="${k}" aria-current="${on}" title="${esc(s.name)}">
<span class="lcode">${s.code}</span><span class="lname">${esc(s.short)}</span><span class="lcount">${met}/${s.ids.length}</span>${bar(s.ids)}</button></li>`;
};
$('#scopes').innerHTML =
`<p class="lbl side-h">Theo lộ trình</p><ol>${WEEKS.map((_, i) => item('w' + i)).join('')}</ol>` +
`<p class="lbl side-h">Theo tầng</p><ol>${item('all')}${SECS.map((_, i) => item('s' + i)).join('')}</ol>`;
$('#scope-select').innerHTML = allScopes().map(k => { const s = scopeInfo(k); return `<option value="${k}"${k === st.scope ? ' selected' : ''}>${esc(s.code + ' · ' + s.short)}</option>`; }).join('');
}
/* ---------- Cột 2 ---------- */
function rowHTML(id) {
const q = Q[id], s = score(id);
return `<li><button type="button" class="qrow" data-id="${id}" aria-current="${id === st.cur}">
<span class="dot ${sclass(s)}" title="${s == null ? 'Chưa chấm' : s + ' · ' + LABELS[s]}"></span>
<span class="rid">${id}</span><span class="rtitle">${esc(q.title)}</span>${q.weak ? '<span class="flag weak">Từng hụt</span>' : ''}</button></li>`;
}
function renderList() {
const nq = norm(st.query.trim());
const base = nq ? ORDER.filter(id => Q[id].idx.includes(nq)) : scopeInfo(st.scope).ids;
const f = FILTERS.find(x => x[0] === st.filter) || FILTERS[0];
st.ids = base.filter(f[2]);
const info = scopeInfo(st.scope);
$('#list-title').innerHTML = nq
? `<span class="lbl">Tìm kiếm</span><h2>${base.length} câu khớp “${esc(st.query.trim())}”</h2>`
: `<span class="lbl">${info.code} · ${info.ids.length} câu</span><h2>${esc(info.name)}</h2>`;
$('#filters').innerHTML = FILTERS.map(([k, l, fn]) => `<button type="button" data-filter="${k}" aria-pressed="${st.filter === k}">${l}<span>${base.filter(fn).length}</span></button>`).join('');
const grouped = nq || !st.scope.startsWith('s');
let html = '', last = null;
st.ids.forEach(id => {
if (grouped && secOf[id] !== last) { last = secOf[id]; html += `<li class="grp lbl">${SECS[last].code} · ${esc(SECS[last].name)}</li>`; }
html += rowHTML(id);
});
$('#rows').innerHTML = st.ids.length ? html
: `<li class="empty">${nq ? 'Không có câu nào khớp. Thử từ khóa khác, gõ không dấu cũng được.' : 'Không còn câu nào trong bộ lọc này. Chọn “Tất cả” để xem lại.'}</li>`;
if (!st.ids.includes(st.cur)) { st.cur = st.ids[0] || null; st.revealed = false; st.done = false; }
}
function markCurrentRow() {
document.querySelectorAll('.qrow').forEach(b => b.setAttribute('aria-current', b.dataset.id === st.cur));
const row = $(`.qrow[data-id="${st.cur}"]`);
if (row) row.scrollIntoView({ block: 'nearest' });
}
/* ---------- Cột 3 ---------- */
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function tick() {
const el = $('#timer'); if (!el) return stopTimer();
const left = 60 - (Date.now() - st.t0) / 1000;
$('i', el).style.width = Math.max(0, left / 60 * 100) + '%';
el.classList.toggle('warn', left <= 15 && left > 0);
el.classList.toggle('over', left <= 0);
$('.timer-num', el).textContent = left > 0 ? `còn ${Math.ceil(left)} giây` : `quá ${Math.floor(-left)} giây`;
}
function answerHTML(q, practice) {
const aside = (q.more ? `<details class="more"${practice ? '' : ' open'}><summary><span class="lbl">Giải thích thêm</span><em>${esc(q.moreNote || 'nói khi bị hỏi sâu')}</em></summary><div class="prose">${q.more}</div></details>` : '') +
(q.related ? `<section class="related part"><h2 class="lbl">Hỏi tương tự</h2><div class="prose">${q.related}</div></section>` : '');
return (practice ? `<p class="used">Bạn đã trả lời trong ${Math.round(st.used)} giây.</p>` : '') +
`<div class="d-grid${aside ? ' has-aside' : ''}">
<section class="part"><h2 class="lbl">Trả lời${q.answerNote ? ` <em>${esc(q.answerNote)}</em>` : ''}</h2><div class="prose">${q.answer}</div></section>
${aside ? `<aside class="d-aside">${aside}</aside>` : ''}</div>`;
}
function rateHTML(id, locked) {
const h = st.scores[id] || [], cur = score(id);
const hist = h.length
? h.slice(-3).map(x => `<i class="dot s${x.s}" title="${fmt(x.t)}: ${x.s} điểm"></i>`).join('') + `<span>${h.length} lần · gần nhất ${fmt(h[h.length - 1].t)}</span>`
: 'Chưa chấm lần nào';
const hint = st.mode === 'practice' ? 'Chấm xong tự sang câu tiếp' : '';
return `<span class="lbl">Tự chấm</span>
<div class="rate-btns">${[0, 1, 2, 3].map(s => `<button type="button" class="rb s${s}" data-rate="${s}" aria-pressed="${cur === s}"${locked ? ' disabled' : ''}><b>${s}</b>${LABELS[s]}</button>`).join('')}</div>
<span class="hist">${hist}</span>
<span class="keys">${hint ? `<span>${hint}</span>` : ''}<span><kbd>0</kbd>–<kbd>3</kbd> chấm</span><span><kbd>←</kbd><kbd>→</kbd> đổi câu</span></span>`;
}
function renderDetail() {
stopTimer();
const el = $('#detail');
if (st.done) return renderDone(el);
const id = st.cur;
if (!id) { el.innerHTML = `<div class="d-empty"><p>Danh sách đang trống. Đổi bộ lọc hoặc chọn tầng khác ở cột bên trái.</p></div>`; return; }
save('cur', id);
const q = Q[id], s = SECS[secOf[id]], i = st.ids.indexOf(id), n = st.ids.length;
const practice = st.mode === 'practice', hidden = practice && !st.revealed;
el.innerHTML = `<div class="d-bar">
<button type="button" class="btn small ghost mobile-only" id="back">← Danh sách</button>
<span class="crumb"><span class="lref">${s.code}</span> ${esc(s.name)}</span>
<div class="seg" role="group" aria-label="Chế độ học">
<button type="button" data-mode="read" aria-pressed="${!practice}" title="Hiện đáp án ngay">Đọc</button>
<button type="button" data-mode="practice" aria-pressed="${practice}" title="Che đáp án, bấm giờ 60 giây">Luyện</button></div>
<div class="pn"><span class="pos">${i + 1} / ${n}</span>
<button type="button" class="btn small" data-nav="-1"${i <= 0 ? ' disabled' : ''} aria-label="Câu trước">←</button>
<button type="button" class="btn small" data-nav="1"${i >= n - 1 ? ' disabled' : ''} aria-label="Câu sau">→</button></div>
</div>
<div class="d-scroll" id="d-scroll"><article class="d-inner">
<header class="d-head"><div class="d-meta"><span class="qid">${id}</span>${flags(q)}</div>
<h1>${esc(q.title)}</h1>
<p class="loc"><span class="lbl">Vị trí</span><span>${q.loc}</span></p></header>
${hidden ? `<div class="prompt"><p>Trả lời thành tiếng trong khoảng 60 giây, sau đó mở đáp án và tự chấm.</p>
<div class="timer" id="timer"><div class="track"><i></i></div><span class="timer-num">còn 60 giây</span></div>
<button type="button" class="btn primary" id="reveal">Hiện đáp án <kbd>Space</kbd></button></div>`
: answerHTML(q, practice)}
</article></div>
<div class="d-rate" id="d-rate">${rateHTML(id, hidden)}</div>`;
if (hidden) { st.t0 = Date.now(); tick(); timerId = setInterval(tick, 250); }
}
function renderDone(el) {
const c = [0, 0, 0, 0]; let un = 0;
st.ids.forEach(id => { const s = score(id); if (s == null) un++; else c[s]++; });
const low = st.ids.filter(id => !goalMet(id)).length;
el.innerHTML = `<div class="d-bar"><button type="button" class="btn small ghost mobile-only" id="back">← Danh sách</button><span class="crumb">Hết danh sách</span></div>
<div class="d-scroll"><div class="d-inner"><div class="d-head"><span class="lbl">Xong lượt luyện</span><h1>Đã đi hết ${st.ids.length} câu trong danh sách</h1></div>
<ul class="legend">${[3, 2, 1, 0].map(s => `<li class="s${s}">${s} · ${LABELS[s]}: ${c[s]}</li>`).join('')}<li class="sn">Chưa chấm: ${un}</li></ul>
<p class="used">${low ? `Còn ${low} câu chưa đạt mục tiêu. Nên luyện lại ngay khi còn nhớ đáp án.` : 'Mọi câu trong danh sách đã đạt mục tiêu.'}</p>
<div class="row">${low ? `<button type="button" class="btn primary" data-go='{"filter":"todo","mode":"practice","keepScope":true}'>Luyện lại ${low} câu chưa đạt</button>` : ''}
<button type="button" class="btn" id="restart">Luyện lại từ đầu</button>
<button type="button" class="btn ghost" data-mode="read">Chuyển sang đọc</button></div></div></div>`;
}
function select(id) {
st.cur = id; st.revealed = false; st.done = false;
renderDetail(); markCurrentRow();
const sc = $('#d-scroll'); if (sc) sc.scrollTop = 0;
}
function nav(d) {
if (st.done) return;
const i = st.ids.indexOf(st.cur), n = i + d;
if (n >= 0 && n < st.ids.length) select(st.ids[n]);
}
function reveal() {
if (st.mode !== 'practice' || st.revealed || !st.cur) return;
st.used = (Date.now() - st.t0) / 1000; st.revealed = true; renderDetail();
}
function rate(s) {
const id = st.cur; if (!id) return;
(st.scores[id] = st.scores[id] || []).push({ s, t: Date.now() });
if (st.scores[id].length > 20) st.scores[id].shift();
save('scores', st.scores);
const dot = $(`.qrow[data-id="${id}"] .dot`);
if (dot) { dot.className = 'dot ' + sclass(s); dot.title = s + ' · ' + LABELS[s]; }
renderSide();
if (st.mode === 'practice') {
const i = st.ids.indexOf(id);
if (i >= 0 && i < st.ids.length - 1) select(st.ids[i + 1]);
else { st.done = true; renderDetail(); }
} else {
$('#d-rate').innerHTML = rateHTML(id, false);
}
}
function refreshLearn() { renderList(); renderDetail(); renderSide(); markCurrentRow(); }
/* ---------- Tiến độ ---------- */
function goalHTML() {
const total = ORDER.length, c = [0, 0, 0, 0]; let rated = 0, attempts = 0;
ORDER.forEach(id => { const s = score(id); if (s != null) { c[s]++; rated++; } attempts += (st.scores[id] || []).length; });
const weak = ORDER.filter(id => Q[id].weak), todo = ORDER.filter(id => !goalMet(id)).length;
return `<div class="goal-main"><span class="lbl">Đạt mục tiêu</span>
<span class="goal-num">${ORDER.filter(goalMet).length}<small> / ${total} câu</small></span>${bar(ORDER, 'big')}
<ul class="legend">${[3, 2, 1, 0].map(s => `<li class="s${s}">${s} · ${LABELS[s]} (${c[s]})</li>`).join('')}<li class="sn">Chưa chấm (${total - rated})</li></ul></div>
<dl class="stats">
<div><dt>Đã tự chấm</dt><dd>${rated}<small> / ${total}</small></dd></div>
<div><dt>Câu từng hụt đạt 3</dt><dd>${weak.filter(id => score(id) === 3).length}<small> / ${weak.length}</small></dd></div>
<div><dt>Cần ôn lại (0–1 điểm)</dt><dd>${c[0] + c[1]}</dd></div>
<div><dt>Tổng lượt tự chấm</dt><dd>${attempts}</dd></div></dl>
<div class="row">
<button type="button" class="btn primary" data-go='{"scope":"all","filter":"weak","mode":"practice"}'>Luyện ${weak.length} câu từng hụt</button>
<button type="button" class="btn" data-go='{"scope":"all","filter":"todo","mode":"practice"}'>Luyện câu chưa đạt (${todo})</button></div>`;
}
function weeksHTML() {
return WEEKS.map((w, i) => {
const met = w.ids.filter(goalMet).length;
return `<article class="week"><h3>${w.name}<span>${met}/${w.ids.length} đạt</span></h3><p>${esc(w.focus)}</p>
<div class="chips">${w.ids.map(id => `<button type="button" class="chip ${sclass(score(id))}${Q[id].weak ? ' weak' : ''}" data-q="${id}" title="${esc(Q[id].title)}">${id}</button>`).join('')}</div>
<div class="row"><button type="button" class="btn small" data-go='{"scope":"w${i}","mode":"read"}'>Đọc</button>
<button type="button" class="btn small" data-go='{"scope":"w${i}","mode":"practice"}'>Luyện</button></div></article>`;
}).join('');
}
function renderProgress() {
const p = $('#page-progress');
if (!progressBuilt) {
p.innerHTML = `<div class="page-inner">
<header class="page-head"><span class="lbl">Tiến độ ôn tập</span><h1>Mục tiêu trước buổi phỏng vấn</h1>
<p>Các câu <span class="flag weak">Từng hụt</span> đạt 3 điểm, các câu còn lại đạt từ 2 điểm. Ô màu là điểm tự chấm gần nhất; ô có gạch chân đậm là câu từng hụt.</p></header>
<div class="panel goal" id="goal"></div>
<h2 class="sec-h">Lộ trình 3 tuần</h2>
<div class="weeks" id="weeks"></div>
<div class="cols">
<section><h2 class="sec-h">Các bước kiểm tra</h2><div class="prose" id="roadmap">${D.roadmap}</div></section>
<section>
<div class="panel remark"><span class="lbl">Nhận xét từ phỏng vấn</span><div class="prose">${D.remark}</div></div>
<div class="panel backup"><span class="lbl">Sao lưu tiến độ</span>
<p>Điểm và các mục đã đánh dấu được lưu trong trình duyệt này. Để mang sang máy khác, bấm Xuất và chép đoạn mã; ở máy kia, dán vào ô rồi bấm Nhập.</p>
<textarea id="backup-text" rows="3" aria-label="Mã sao lưu tiến độ"></textarea>
<div class="row"><button type="button" class="btn small" id="bk-export">Xuất</button><button type="button" class="btn small" id="bk-import">Nhập</button>
<button type="button" class="btn small danger" id="bk-reset">Xóa toàn bộ tiến độ</button></div>
<span class="status" id="bk-msg" role="status"></span></div>
</section></div></div>`;
$('#weeks-slot', p)?.remove();
p.querySelectorAll('.rm-check').forEach(cb => { cb.checked = !!st.checks[cb.dataset.key]; });
progressBuilt = true;
}
$('#goal').innerHTML = goalHTML();
$('#weeks').innerHTML = weeksHTML();
}
function renderTrace() {
if (traceBuilt) return;
$('#page-trace').innerHTML = `<div class="page-inner"><header class="page-head"><span class="lbl">Kiểm tra độ phủ</span><h1>Ghi chú gốc → câu hỏi</h1>
<p>Đối chiếu từng dòng trong ghi chú phỏng vấn với câu hỏi tương ứng. Bấm vào mã câu để mở câu đó.</p></header>
<div class="prose trace-body">${D.trace}</div></div>`;
traceBuilt = true;
}
/* ---------- Điều hướng ---------- */
function setView(v) {
st.view = v; save('view2', v); app.dataset.view = v;
if (v !== 'learn') stopTimer();
if (v === 'learn') refreshLearn();
if (v === 'progress') { renderProgress(); renderSide(); }
if (v === 'trace') { renderTrace(); renderSide(); }
}
function setScope(k) {
st.scope = k; st.filter = 'all'; st.query = ''; search.value = ''; save('scope2', k);
st.done = false; app.classList.remove('show-detail');
if (st.view !== 'learn') setView('learn'); else refreshLearn();
}
function openQuestion(id) {
if (!(st.view === 'learn' && st.ids.includes(id))) {
st.scope = 's' + secOf[id]; st.filter = 'all'; st.query = ''; search.value = ''; save('scope2', st.scope);
st.cur = id; st.view = 'learn'; save('view2', 'learn'); app.dataset.view = 'learn';
renderList(); renderSide();
}
select(id);
if (narrow()) app.classList.add('show-detail');
}
document.addEventListener('click', e => {
const t = e.target.closest('button, a');
if (!t) return;
if (t.matches('a[href="#"]')) e.preventDefault();
const d = t.dataset;
if (d.view) return setView(d.view);
if (d.scope) return setScope(d.scope);
if (d.id) { select(d.id); if (narrow()) app.classList.add('show-detail'); return; }
if (d.q) return openQuestion(d.q);
if (d.filter) { st.filter = d.filter; st.done = false; renderList(); renderDetail(); markCurrentRow(); return; }
if (d.mode) { st.mode = d.mode; save('mode', d.mode); st.revealed = false; st.done = false; return renderDetail(); }
if (d.nav) return nav(+d.nav);
if (d.rate) return rate(+d.rate);
if (d.go) {
const g = JSON.parse(d.go);
if (g.scope) { st.scope = g.scope; save('scope2', g.scope); }
st.filter = g.filter || 'all'; st.query = ''; search.value = '';
if (g.mode) { st.mode = g.mode; save('mode', g.mode); }
st.done = false; st.revealed = false; st.cur = null;
st.view = 'learn'; save('view2', 'learn'); app.dataset.view = 'learn';
renderList(); renderSide();
st.cur = st.ids[0] || null; renderDetail(); markCurrentRow();
if (narrow() && st.cur) app.classList.add('show-detail');
return;
}
switch (t.id) {
case 'reveal': return reveal();
case 'back': app.classList.remove('show-detail'); return markCurrentRow();
case 'restart': st.done = false; return select(st.ids[0]);
case 'reset-cols': widths = {}; save('widths', widths); return applyWidths();
case 'theme-btn': theme ={ system: 'light', light: 'dark', dark: 'system' }[theme]; save('theme', theme); return applyTheme();
case 'bk-export': return exportProgress();
case 'bk-import': return importProgress();
case 'bk-reset': return resetProgress(t);
}
});
document.addEventListener('change', e => {
const t = e.target;
if (t.id === 'scope-select') setScope(t.value);
else if (t.classList.contains('rm-check')) { st.checks[t.dataset.key] = t.checked; save('checks', st.checks); }
});
search.addEventListener('input', () => {
st.query = search.value; st.done = false;
renderList(); renderDetail(); renderSide(); markCurrentRow();
});
document.addEventListener('keydown', e => {
const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
if (e.key === '/' && !typing) {
e.preventDefault();
if (st.view !== 'learn') setView('learn');
app.classList.remove('show-detail'); search.focus(); search.select(); return;
}
if (typing) {
if (e.key === 'Escape' && e.target === search) { search.value = ''; st.query = ''; renderList(); renderDetail(); renderSide(); markCurrentRow(); search.blur(); }
return;
}
if (st.view !== 'learn' || e.ctrlKey || e.metaKey || e.altKey) return;
const hidden = st.mode === 'practice' && !st.revealed;
if (e.key === 'ArrowRight' || e.key === 'j') { e.preventDefault(); nav(1); }
else if (e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); nav(-1); }
else if (e.key === ' ' && hidden && !st.done) { e.preventDefault(); reveal(); }
else if (/^[0-3]$/.test(e.key) && !hidden && !st.done && st.cur) rate(+e.key);
});
/* ---------- Sao lưu ---------- */
const msg = text => { const m = $('#bk-msg'); if (m) m.textContent = text; };
function exportProgress() {
const ta = $('#backup-text');
ta.value = JSON.stringify({ v: 1, scores: st.scores, checks: st.checks });
ta.select();
const fallback = () => msg('Đã xuất. Hãy chép đoạn mã trong ô.');
if (navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(() => msg('Đã xuất và chép vào bộ nhớ tạm.'), fallback);
else fallback();
}
function importProgress() {
try {
const data = JSON.parse($('#backup-text').value);
if (!data || typeof data.scores !== 'object') throw new Error('thiếu điểm');
st.scores = data.scores; st.checks = data.checks || {};
save('scores', st.scores); save('checks', st.checks);
progressBuilt = false; renderProgress(); renderSide();
msg('Đã nhập tiến độ.');
} catch (err) {
msg('Không nhập được: đoạn mã không đúng định dạng. Hãy dán lại nguyên đoạn đã xuất.');
}
}
let resetArmed = null;
function resetProgress(b) {
if (!resetArmed) {
b.textContent = 'Bấm lần nữa để xóa hẳn';
resetArmed = setTimeout(() => { b.textContent = 'Xóa toàn bộ tiến độ'; resetArmed = null; }, 4000);
return;
}
clearTimeout(resetArmed); resetArmed = null;
st.scores = {}; st.checks = {}; save('scores', {}); save('checks', {});
progressBuilt = false; renderProgress(); renderSide();
msg('Đã xóa toàn bộ tiến độ.');
}
/* ---------- Co giãn cột ---------- */
const LIMITS = { side: [180, 420], list: [240, 640] };
const MIN_DETAIL = 420;
let widths = load('widths', {});
const colVar = key => parseFloat(getComputedStyle(app).getPropertyValue('--w-' + key)) || 0;
function clampW(key, w) {
const other = colVar(key === 'side' ? 'list' : 'side');
const max = Math.min(LIMITS[key][1], app.clientWidth - other - MIN_DETAIL);
return Math.round(Math.max(LIMITS[key][0], Math.min(w, max)));
}
function syncResizers() {
document.querySelectorAll('.resizer').forEach(h => {
const k = h.dataset.col;
h.setAttribute('aria-valuenow', Math.round(colVar(k)));
h.setAttribute('aria-valuemin', LIMITS[k][0]);
h.setAttribute('aria-valuemax', LIMITS[k][1]);
});
$('#reset-cols').hidden = !(widths.side || widths.list);
}
function applyWidths() {
['side', 'list'].forEach(k => app.style.removeProperty('--w-' + k));
['side', 'list'].forEach(k => { if (widths[k]) app.style.setProperty('--w-' + k, clampW(k, widths[k]) + 'px'); });
syncResizers();
}
function setWidth(key, w) {
widths[key] = clampW(key, w);
app.style.setProperty('--w-' + key, widths[key] + 'px');
syncResizers();
}
document.querySelectorAll('.resizer').forEach(h => {
const key = h.dataset.col;
h.addEventListener('pointerdown', e => {
if (e.button !== 0) return;
e.preventDefault();
h.setPointerCapture(e.pointerId);
const startX = e.clientX, startW = colVar(key);
document.body.classList.add('resizing'); h.classList.add('active');
const move = ev => setWidth(key, startW + ev.clientX - startX);
const up = () => {
h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
document.body.classList.remove('resizing'); h.classList.remove('active');
save('widths', widths);
};
h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
});
h.addEventListener('dblclick', () => { delete widths[key]; save('widths', widths); applyWidths(); });
h.addEventListener('keydown', e => {
const step = e.shiftKey ? 64 : 16;
if (e.key === 'ArrowLeft') setWidth(key, colVar(key) - step);
else if (e.key === 'ArrowRight') setWidth(key, colVar(key) + step);
else if (e.key === 'Home' || e.key === 'Enter') { delete widths[key]; applyWidths(); }
else return;
e.preventDefault(); e.stopPropagation();
save('widths', widths);
});
});
let resizeFrame = 0;
window.addEventListener('resize', () => { cancelAnimationFrame(resizeFrame); resizeFrame = requestAnimationFrame(applyWidths); });
/* ---------- Khởi động ---------- */
applyWidths();
applyTheme();
setView(st.view);
})();
</script>
</body>
</html>
