<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ ôn phỏng vấn Android</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: ứng dụng phủ kín màn hình, 3 cột cuộn độc lập.
[Điều hướng + tầng] | [Danh sách câu] | [Nội dung câu đang học].
Tiến độ và Truy vết chiếm cả 2 cột bên phải. Màn hẹp: 1 cột, danh sách ↔ nội dung. */
:root {
--side: #E8ECF2;
--list: #F4F6F9;
--surface: #FFFFFF;
--soft: #EDF0F5;
--code-bg: #F2F4F8;
--ink: #17202C;
--muted: #5A6677;
--line: #DCE2EA;
--accent: #2B48C4;
--accent-ink: #FFFFFF;
--accent-soft: #E3E9FC;
--s0: #C93A4B;
--s1: #D9772A;
--s2: #BF9314;
--s3: #23925E;
--sn: #CDD4DE;
--font-display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
--font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
--font-mono: "JetBrains Mono", ui-monospace, Consolas, "Courier New", monospace;
color-scheme: light;
}
@media (prefers-color-scheme: dark) {
:root:not([data-theme="light"]) {
--side: #0B0F14; --list: #10161D; --surface: #151C24; --soft: #1C2531; --code-bg: #19212B;
--ink: #E4E9EF; --muted: #95A1B0; --line: #26303C;
--accent: #8FA3FF; --accent-ink: #0E1319; --accent-soft: #1F2849;
--s0: #F0687A; --s1: #F0994F; --s2: #E3BD47; --s3: #46C389; --sn: #33404E;
color-scheme: dark;
}
}
:root[data-theme="dark"] {
--side: #0B0F14; --list: #10161D; --surface: #151C24; --soft: #1C2531; --code-bg: #19212B;
--ink: #E4E9EF; --muted: #95A1B0; --line: #26303C;
--accent: #8FA3FF; --accent-ink: #0E1319; --accent-soft: #1F2849;
--s0: #F0687A; --s1: #F0994F; --s2: #E3BD47; --s3: #46C389; --sn: #33404E;
color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; height: 100dvh; }
body { margin: 0; overflow: hidden; background: var(--surface); color: var(--ink); font: 15px/1.62 var(--font-body); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .4; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; }
a { color: var(--accent); }
.lbl { font: 600 .68rem/1.2 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.mobile-only { display: none !important; }
.s0 { --sc: var(--s0); } .s1 { --sc: var(--s1); } .s2 { --sc: var(--s2); } .s3 { --sc: var(--s3); } .sn { --sc: var(--sn); }
/*  ---------- Khung ứng dụng ----------  */
.app {
--w-side: 256px;
--w-list: 360px;
height: 100%;
height: 100dvh;
display: grid;
grid-template-columns: var(--w-side) var(--w-list) minmax(0, 1fr);
grid-template-rows: minmax(0, 1fr);
padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.app:not([data-view="learn"]) .list, .app:not([data-view="learn"]) .detail { display: none; }
.app:not([data-view="progress"]) #page-progress, .app:not([data-view="trace"]) #page-trace { display: none; }
/*  ---------- Cột 1: điều hướng ----------  */
.side { display: flex; flex-direction: column; min-height: 0; background: var(--side); border-right: 1px solid var(--line); }
.brand { padding: 18px 18px 14px; display: flex; flex-direction: column; line-height: 1.2; }
.brand b { font: 700 1.05rem/1.2 var(--font-display); letter-spacing: -.01em; }
.brand span { font: 500 .66rem/1.4 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 10px 12px; border-bottom: 1px solid var(--line); }
.nav button { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 8px 10px; border: 0; background: none; border-radius: 8px; font-weight: 500; color: var(--muted); text-align: left; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }
.nav button span { font: .72rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.scopes { flex: 1; min-height: 0; overflow: auto; padding: 4px 10px 16px; }
.side-h { padding: 14px 10px 6px; }
.scopes ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
.layer {
width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 8px; row-gap: 5px; align-items: baseline;
padding: 7px 10px 8px; border: 0; background: none; border-radius: 8px; text-align: left;
}
.layer:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); }
.layer[aria-current="true"] { background: var(--surface); box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }
.lcode { font: 600 .72rem var(--font-mono); color: var(--muted); }
.layer[aria-current="true"] .lcode { color: var(--accent); }
.lname { font-size: .86rem; line-height: 1.3; }
.lcount { font: .68rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.layer .bar { grid-column: 2 / 4; }
.bar { display: flex; height: 4px; border-radius: 99px; overflow: hidden; background: var(--sn); }
.bar.big { height: 10px; }
.bar i { display: block; height: 100%; background: var(--sc); }
.side-foot { padding: 10px 12px; border-top: 1px solid var(--line); }
.theme-btn { width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 7px; font-size: .84rem; color: var(--muted); }
.theme-btn:hover { background: color-mix(in srgb, var(--surface) 55%, transparent); color: var(--ink); }
/*  ---------- Cột 2: danh sách ----------  */
.list { display: flex; flex-direction: column; min-height: 0; background: var(--list); border-right: 1px solid var(--line); }
.list-head { padding: 16px 14px 12px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.list-title { display: flex; flex-direction: column; gap: 3px; }
.list-title h2 { font: 700 1.08rem/1.3 var(--font-display); letter-spacing: -.005em; }
.field-input, .scope-select {
width: 100%; padding: 7px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface);
}
.field-input::placeholder { color: var(--muted); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; background: var(--soft); border-radius: 9px; }
.seg button { border: 0; background: none; padding: 4px 9px; border-radius: 6px; font-size: .8rem; color: var(--muted); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.seg button span { font: .7rem var(--font-mono); margin-left: 2px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rows { list-style: none; margin: 0; padding: 6px 8px 28px; overflow: auto; flex: 1; min-height: 0; }
.grp { padding: 14px 10px 5px; }
.grp:first-child { padding-top: 6px; }
.qrow {
width: 100%; display: grid; grid-template-columns: 8px 44px minmax(0, 1fr); column-gap: 10px; align-items: baseline;
padding: 9px 10px; border: 0; background: none; border-radius: 8px; text-align: left;
}
.qrow:hover { background: var(--soft); }
.qrow[aria-current="true"] { background: var(--accent-soft); }
.qrow .dot { align-self: center; }
.rid { font: 600 .74rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.qrow[aria-current="true"] .rid { color: var(--accent); }
.rtitle { font-size: .9rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.qrow .flag { grid-column: 3; justify-self: start; margin-top: 5px; }
.empty { padding: 24px 12px; color: var(--muted); font-size: .9rem; text-align: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--sc); display: inline-block; flex: none; }
/*  ---------- Cột 3: nội dung câu ----------  */
.detail { display: flex; flex-direction: column; min-height: 0; background: var(--surface); container-type: inline-size; }
.d-bar { display: flex; align-items: center; gap: 10px 14px; padding: 10px clamp(16px, 3cqi, 40px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.crumb { flex: 1 1 200px; min-width: 0; font-size: .85rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lref { font: 600 .82em var(--font-mono); color: var(--accent); }
.pn { display: flex; align-items: center; gap: 6px; }
.pos { font: .78rem var(--font-mono); color: var(--muted); margin-right: 4px; font-variant-numeric: tabular-nums; }
.d-scroll { flex: 1; min-height: 0; overflow: auto; }
.d-inner { padding: 30px clamp(16px, 3cqi, 40px) 48px; display: flex; flex-direction: column; gap: 24px; }
.d-head { display: flex; flex-direction: column; gap: 10px; }
.d-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.qid { font: 600 .82rem var(--font-mono); color: var(--accent); }
.d-head h1 { font: 700 clamp(1.4rem, 1rem + 1.6cqi, 2.1rem)/1.2 var(--font-display); letter-spacing: -.015em; max-width: 44ch; }
.loc { margin: 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: .9rem; color: var(--muted); }
.d-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px 40px; }
@container (min-width: 980px) {
.d-grid.has-aside { grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); align-items: start; }
.d-grid.has-aside .d-aside { position: sticky; top: 0; }
}
.part { display: flex; flex-direction: column; gap: 8px; }
.part h2 { display: flex; gap: 8px; align-items: baseline; }
.part h2 em, .more summary em { font: italic 400 .8rem var(--font-body); text-transform: none; letter-spacing: 0; color: var(--muted); }
.d-aside { display: flex; flex-direction: column; gap: 16px; }
.more { background: var(--soft); border-radius: 10px; padding: 12px 16px; }
.more summary { cursor: pointer; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; list-style: none; }
.more summary::-webkit-details-marker { display: none; }
.more summary::before { content: "+"; font: 600 .9rem var(--font-mono); color: var(--muted); width: 12px; }
.more[open] summary::before { content: "−"; }
.more[open] summary { margin-bottom: 10px; }
.more .tbl, .more pre.code { background: var(--surface); }
.related { padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; }
.related .prose { color: var(--muted); }
.used { margin: 0; font-size: .85rem; color: var(--muted); }
.prompt { display: flex; flex-direction: column; gap: 16px; align-items: flex-start; padding: 22px; border: 1px dashed var(--line); border-radius: 12px; max-width: 640px; }
.prompt p { margin: 0; color: var(--muted); }
.timer { display: flex; align-items: center; gap: 12px; width: 100%; }
.track { flex: 1; height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.track i { display: block; height: 100%; width: 100%; background: var(--s3); }
.timer.warn .track i { background: var(--s2); }
.timer.over .track i { background: var(--s0); }
.timer-num { font: 600 .86rem var(--font-mono); color: var(--muted); min-width: 10ch; text-align: right; font-variant-numeric: tabular-nums; }
.d-rate { border-top: 1px solid var(--line); padding: 10px clamp(16px, 3cqi, 40px); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; background: var(--surface); }
.rate-btns { display: flex; flex-wrap: wrap; gap: 6px; }
.rb { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: .84rem; color: var(--muted); }
.rb b { font: 700 .84rem var(--font-mono); color: var(--sc); }
.rb:not(:disabled):hover { border-color: var(--sc); color: var(--ink); }
.rb[aria-pressed="true"] { background: color-mix(in srgb, var(--sc) 18%, var(--surface)); border-color: var(--sc); color: var(--ink); }
.hist { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.hist span { margin-left: 4px; }
.keys { margin-left: auto; font-size: .76rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.d-empty { flex: 1; display: grid; place-items: center; color: var(--muted); padding: 24px; text-align: center; }
/*  ---------- Chip, cờ, nút ----------  */
.flag { display: inline-flex; align-items: center; font: 600 .66rem/1 var(--font-mono); letter-spacing: .04em; padding: 4px 7px; border-radius: 5px; white-space: nowrap; }
.flag.weak { background: var(--ink); color: var(--surface); }
.flag.freq { border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); padding: 3px 6px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.btn:not(:disabled):hover { border-color: color-mix(in srgb, var(--ink) 30%, var(--line)); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--s0); }
.btn.small { padding: 5px 10px; font-size: .84rem; }
kbd { font: 600 .66rem/1 var(--font-mono); padding: 3px 6px; border-radius: 5px; border: 1px solid var(--line); border-bottom-width: 2px; background: var(--soft); color: var(--muted); }
.btn.primary kbd { background: transparent; color: inherit; border-color: color-mix(in srgb, var(--accent-ink) 40%, transparent); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
font: 600 .72rem/1 var(--font-mono); padding: 5px 7px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--sc) 70%, transparent);
background: color-mix(in srgb, var(--sc) 20%, var(--surface)); color: var(--ink); font-variant-numeric: tabular-nums;
}
.chip.sn { background: var(--surface); border-color: var(--line); color: var(--muted); }
.chip.weak { box-shadow: inset 0 -2px 0 var(--ink); }
.chip:hover { border-color: var(--ink); }
.legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .8rem; color: var(--muted); }
.legend li { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.legend li::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--sc); }
/*  ---------- Prose (nội dung từ .md) ----------  */
.prose { font-size: .96rem; }
.prose > p, .prose > ul, .prose > ol, .prose > blockquote { max-width: 80ch; }
.prose > :last-child { margin-bottom: 0; }
.prose p { margin: 0 0 .7em; }
.prose ul, .prose ol { margin: 0 0 .8em; padding-left: 1.35em; }
.prose li { margin: .22em 0; }
.prose li > p { margin: .25em 0; }
.prose li::marker { color: var(--muted); }
.prose strong { font-weight: 650; }
.prose code { font: .85em/1.4 var(--font-mono); background: var(--code-bg); border: 1px solid var(--line); padding: .05em .35em; border-radius: 4px; }
.prose pre.code { margin: .4em 0 1em; padding: 12px 14px; overflow-x: auto; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; font: 12.8px/1.6 var(--font-mono); }
.prose pre code { background: none; border: 0; padding: 0; font: inherit; }
.tbl { overflow-x: auto; margin: .3em 0 1em; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.prose table { border-collapse: collapse; width: 100%; font-size: .9rem; }
.prose th, .prose td { padding: 7px 11px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
.prose th { background: var(--soft); font-weight: 600; white-space: nowrap; }
.prose tr:last-child td { border-bottom: 0; }
.prose blockquote { margin: 0 0 .9em; padding: .6em 1em; background: var(--soft); border-radius: 8px; }
.prose blockquote p:last-child { margin-bottom: 0; }
.prose h3 { font: 650 1.05rem/1.3 var(--font-display); margin: 1.5em 0 .5em; }
.prose h3:first-child { margin-top: 0; }
.qref { font: 600 .82em var(--font-mono); text-decoration: none; padding: .05em .3em; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.qref:hover { text-decoration: underline; }
.task { list-style: none; margin-left: -1.35em; padding-left: 28px; position: relative; }
.task input { position: absolute; left: 0; top: .28em; margin: 0; width: 16px; height: 16px; accent-color: var(--accent); }
.task:has(input:checked) { color: var(--muted); text-decoration: line-through; }
/*  ---------- Trang Tiến độ / Truy vết ----------  */
.page { grid-column: 2 / 4; min-height: 0; overflow: auto; background: var(--surface); }
.page-inner { padding: 30px clamp(16px, 3vw, 48px) 64px; display: flex; flex-direction: column; gap: 22px; }
.page-head { display: flex; flex-direction: column; gap: 6px; }
.page-head h1 { font: 750 clamp(1.5rem, 1.1rem + 1.2vw, 2.1rem)/1.15 var(--font-display); letter-spacing: -.015em; }
.page-head p { margin: 0; color: var(--muted); max-width: 72ch; }
.sec-h { font: 700 1.05rem var(--font-display); }
.panel { border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.goal { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 18px 32px; align-items: center; }
.goal-main { display: flex; flex-direction: column; gap: 10px; }
.goal-num { font: 700 1.6rem/1 var(--font-display); font-variant-numeric: tabular-nums; }
.goal-num small { font: 500 .9rem var(--font-body); color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; margin: 0; }
.stats dt { font-size: .78rem; color: var(--muted); }
.stats dd { margin: 0; font: 700 1.25rem/1.2 var(--font-display); font-variant-numeric: tabular-nums; }
.stats dd small { font: 500 .85rem var(--font-body); color: var(--muted); }
.goal .row { grid-column: 1 / -1; }
.weeks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; align-items: start; }
.week { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.week h3 { font: 700 1rem var(--font-display); display: flex; justify-content: space-between; gap: 8px; }
.week h3 span { font: 500 .76rem var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.week p { margin: 0; font-size: .84rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 28px; align-items: start; }
.cols > section { display: flex; flex-direction: column; gap: 12px; }
.remark .prose { color: var(--muted); font-size: .9rem; }
.remark .prose blockquote { background: none; padding: 0; margin: 0; }
.backup p { margin: 0; color: var(--muted); font-size: .86rem; }
.backup { display: flex; flex-direction: column; gap: 10px; }
.backup textarea { width: 100%; font: 12px/1.5 var(--font-mono); padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
.status { font-size: .84rem; color: var(--muted); }
.trace-body { columns: 2 520px; column-gap: 40px; }
.trace-body .tbl { break-inside: avoid; }
.trace-body h3 { break-after: avoid; }
.trace-body td:last-child { white-space: nowrap; }
/*  ---------- Màn vừa ----------  */
/*  ---------- Tay kéo co giãn cột ----------  */
.side, .list { position: relative; }
.resizer { position: absolute; top: 0; right: -5px; width: 10px; height: 100%; cursor: col-resize; z-index: 6; touch-action: none; }
.resizer::after { content: ""; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px; background: transparent; transition: background .15s .08s; }
.resizer:hover::after, .resizer.active::after, .resizer:focus-visible::after { background: var(--accent); }
.resizer:focus-visible { outline: none; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }
@media (max-width: 1240px) {
.app { --w-side: 216px; --w-list: 300px; }
.weeks { grid-template-columns: minmax(0, 1fr); }
.cols { grid-template-columns: minmax(0, 1fr); }
}
/*  ---------- Màn hẹp: 1 cột ----------  */
@media (max-width: 899px) {

<script type="application/json" id="bank-data">{"remark": "<p>Tổng hợp từ ghi chú phỏng vấn thực tế (Loan NT, Vu TA, DuyTD13 và các ghi chú khác).\nNhận xét từ một buổi phỏng vấn: <em>\"Có kiến thức để đáp ứng yêu cầu công việc Dev 3. </em><em>Cần trau dồi thêm kỹ năng thiết kế, Android Framework</em><em>.\"</em> → hai mảng này được ưu tiên trong lộ trình ôn tập.</p>", "sections": [{"code": "L0", "name": "Giới thiệu & Kinh nghiệm", "intro": "Tầng \"con người\": interviewer đánh giá khả năng giao tiếp, mức độ hiểu dự án và vai trò thực tế. Các câu hỏi kỹ thuật phía sau thường được <strong>lấy ra từ chính những gì bạn kể ở đây</strong>, nên chỉ nhắc đến công nghệ mà bạn trả lời sâu được.", "qs": ["Q0.1", "Q0.2", "Q0.3"]}, {"code": "L1", "name": "Quy trình phát triển phần mềm", "intro": "Tầng tổ chức: dự án được chạy <em>như thế nào</em>. Các câu hỏi xoay quanh: mô hình nào, khi nào dùng, vai trò, artifact.", "qs": ["Q1.1", "Q1.2", "Q1.3", "Q1.4", "Q1.5", "Q1.6"]}, {"code": "L2", "name": "Yêu cầu & Kiến trúc hệ thống", "intro": "Tầng \"nhìn từ trên xuống\": hệ thống cần đạt gì (requirement) và được chia thành những khối lớn nào (HLD, mô hình kiến trúc).", "qs": ["Q2.1", "Q2.2", "Q2.3"]}, {"code": "L3", "name": "Thiết kế chi tiết: SOLID, Design Pattern, UML", "intro": "Đây là phần <strong>trọng tâm cần cải thiện</strong> (\"cần trau dồi kỹ năng thiết kế\"). Liên hệ: SOLID là <em>nguyên tắc</em>, Design Pattern là <em>giải pháp mẫu</em> áp dụng các nguyên tắc đó, UML là <em>ngôn ngữ để trình bày</em> thiết kế.", "qs": ["Q3.1", "Q3.2", "Q3.3", "Q3.4", "Q3.5", "Q3.6", "Q3.7", "Q3.8", "Q3.9", "Q3.10"]}, {"code": "L4", "name": "Ngôn ngữ & OOP (Java/Kotlin)", "intro": "Tầng nền tảng của code. Ở đây hay bị hỏi \"<strong>khi nào dùng</strong>\" và \"<strong>tại sao</strong>\", không chỉ \"là gì\".", "qs": ["Q4.1", "Q4.2", "Q4.3", "Q4.4", "Q4.5", "Q4.6", "Q4.7", "Q4.8", "Q4.9", "Q4.10", "Q4.11"]}, {"code": "L4b", "name": "Cấu trúc dữ liệu & Thuật toán", "intro": "Liên hệ: chọn đúng collection sẽ ảnh hưởng <strong>performance</strong> (NFR) và <strong>thread-safety</strong> (L5).", "qs": ["Q4b.1", "Q4b.2", "Q4b.3", "Q4b.4", "Q4b.5", "Q4b.6", "Q4b.7", "Q4b.8", "Q4b.9"]}, {"code": "L5", "name": "Concurrency (Đa luồng)", "intro": "Tầng runtime. Liên hệ: L3 (Singleton thread-safe) → L5 (thread, lock, deadlock) → L6 (main thread, ANR, Handler/Looper).", "qs": ["Q5.1", "Q5.2", "Q5.3", "Q5.4", "Q5.5", "Q5.6", "Q5.7"]}, {"code": "L5", "name": "Memory & Runtime", "intro": "Liên hệ: L4 (reference, object) → L5 (GC) → L6 (leak do lifecycle: Activity, Context, Handler).", "qs": ["Q5.8", "Q5.9", "Q5.10"]}, {"code": "L6", "name": "Android Framework & Platform", "intro": "Đây là phần <strong>trọng tâm thứ 2 cần cải thiện</strong> (\"cần trau dồi Android Framework\").", "qs": ["Q6.1", "Q6.2", "Q6.3", "Q6.4", "Q6.5", "Q6.6"]}, {"code": "L7", "name": "Data layer & Persistence", "intro": "Liên hệ: L3 (Repository pattern, Singleton DB) → L7 (cách lưu) → L5 (chạy trên thread IO) → L8 (test DAO).", "qs": ["Q7.1", "Q7.2", "Q7.3", "Q7.4"]}, {"code": "L8", "name": "Testing", "intro": "Liên hệ: L3 (LLD/Detail design là cơ sở viết UT; DIP/interface giúp mock) → L8. Trong V-Model, UT đi cặp với Detail design.", "qs": ["Q8.1", "Q8.2", "Q8.3", "Q8.4", "Q8.5"]}, {"code": "L9", "name": "Debug, Log & Tools", "intro": "Liên hệ: L5/L6 (deadlock, leak, ANR, crash) → L9 (công cụ để tìm ra) → L0 (kể bug nhớ nhất).", "qs": ["Q9.1", "Q9.2", "Q9.3", "Q9.4", "Q9.5"]}], "questions": {"Q0.1": {"title": "Giới thiệu bản thân (English)", "weak": false, "freq": true, "loc": "<span class=\"lref\">L0</span>. Đây là ấn tượng đầu tiên, và nó định hướng các câu hỏi sau.", "answer": "<blockquote>\n<p>\"Hello, my name is ___. I have ___ years of experience in Android development with Java and Kotlin.\nCurrently I'm working at ___ on ___ project, an Android application for ___ (domain: automotive / in-vehicle infotainment...).\nMy main responsibilities are designing and implementing features, writing unit tests, and fixing bugs.\nMy strengths are ___ (e.g. Android framework, MVVM architecture, debugging).\nRecently I'm improving my skills in software design and Android framework internals. Thank you.\"</p>\n</blockquote>", "answerNote": "template ~60s", "more": "<p>Chuẩn bị câu chuyển ý sang dự án: <em>\"Let me briefly introduce my latest project...\"</em></p>", "moreNote": "", "related": "<p>Điểm mạnh/yếu? Mục tiêu 2–3 năm tới? Vì sao muốn lên level này?</p>", "text": "L0 . Đây là ấn tượng đầu tiên, và nó định hướng các câu hỏi sau. \"Hello, my name is ___. I have ___ years of experience in Android development with Java and Kotlin. Currently I'm working at ___ on ___ project, an Android application for ___ (domain: automotive / in-vehicle infotainment...). My main responsibilities are designing and implementing features, writing unit tests, and fixing bugs. My strengths are ___ (e.g. Android framework, MVVM architecture, debugging). Recently I'm improving my skills in software design and Android framework internals. Thank you.\" Chuẩn bị câu chuyển ý sang dự án: \"Let me briefly introduce my latest project...\" Điểm mạnh/yếu? Mục tiêu 2–3 năm tới? Vì sao muốn lên level này?"}, "Q0.2": {"title": "Dự án đã tham gia / Mô tả công việc đang làm (EN/VN)", "weak": false, "freq": true, "loc": "<span class=\"lref\">L0</span> → nối sang <span class=\"lref\">L2</span> (kiến trúc) và <span class=\"lref\">L3</span> (thiết kế).", "answer": "<ol>\n<li><strong>Bối cảnh:</strong> dự án gì, khách hàng/domain, quy mô team.</li>\n<li><strong>Kiến trúc:</strong> app có những module nào, pattern gì (MVVM, Clean Architecture), giao tiếp với service/HAL ra sao.</li>\n<li><strong>Vai trò của tôi:</strong> làm phần nào, ở tầng nào (UI, business, framework, service).</li>\n<li><strong>Công nghệ:</strong> Kotlin, Coroutine, Room, AIDL, JUnit/Mockito...</li>\n<li><strong>Kết quả/đóng góp:</strong> con số cụ thể (giảm crash x%, giảm thời gian khởi động...).</li>\n</ol>", "answerNote": "khung 5 ý", "more": "<p>Nên tự vẽ trước một <strong>sơ đồ khối</strong> (block diagram) của dự án, vì interviewer hay yêu cầu \"vẽ kiến trúc dự án\". Đây cũng là lúc thể hiện kỹ năng thiết kế, phần từng bị nhận xét cần cải thiện.</p>", "moreNote": "", "related": "<p>Khó khăn lớn nhất trong dự án? Nếu làm lại thì thiết kế khác đi chỗ nào? Quy trình dự án là gì (→ L1)?</p>", "text": "L0 → nối sang L2 (kiến trúc) và L3 (thiết kế). Bối cảnh: dự án gì, khách hàng/domain, quy mô team. Kiến trúc: app có những module nào, pattern gì (MVVM, Clean Architecture), giao tiếp với service/HAL ra sao. Vai trò của tôi: làm phần nào, ở tầng nào (UI, business, framework, service). Công nghệ: Kotlin, Coroutine, Room, AIDL, JUnit/Mockito... Kết quả/đóng góp: con số cụ thể (giảm crash x%, giảm thời gian khởi động...). Nên tự vẽ trước một sơ đồ khối (block diagram) của dự án, vì interviewer hay yêu cầu \"vẽ kiến trúc dự án\". Đây cũng là lúc thể hiện kỹ năng thiết kế, phần từng bị nhận xét cần cải thiện. Khó khăn lớn nhất trong dự án? Nếu làm lại thì thiết kế khác đi chỗ nào? Quy trình dự án là gì (→ L1)?"}, "Q0.3": {"title": "Bug nhớ nhất / Kể 1 lần fix bug", "weak": false, "freq": false, "loc": "<span class=\"lref\">L0</span> + <span class=\"lref\">L9</span>.", "answer": "<ul>\n<li><strong>S</strong>ituation: app bị ANR/crash/leak ở màn hình X, chỉ xảy ra khi Y.</li>\n<li><strong>T</strong>ask: tôi được giao điều tra.</li>\n<li><strong>A</strong>ction: reproduce → đọc log/stack trace (logcat, ANR traces) → khoanh vùng bằng breakpoint/profiler → tìm root cause → fix → viết UT phòng tái phát.</li>\n<li><strong>R</strong>esult: hết lỗi, thời gian xử lý giảm..., chia sẻ lại cho team.</li>\n</ul>", "answerNote": "STAR", "more": "<p>Nên chọn bug có <strong>root cause kỹ thuật rõ ràng</strong> (deadlock, memory leak, race condition, lifecycle). Nó mở đường sang L5/L6, phần mình đã chuẩn bị kỹ.</p>", "moreNote": "", "related": "", "text": "L0 + L9 . S ituation: app bị ANR/crash/leak ở màn hình X, chỉ xảy ra khi Y. T ask: tôi được giao điều tra. A ction: reproduce → đọc log/stack trace (logcat, ANR traces) → khoanh vùng bằng breakpoint/profiler → tìm root cause → fix → viết UT phòng tái phát. R esult: hết lỗi, thời gian xử lý giảm..., chia sẻ lại cho team. Nên chọn bug có root cause kỹ thuật rõ ràng (deadlock, memory leak, race condition, lifecycle). Nó mở đường sang L5/L6, phần mình đã chuẩn bị kỹ."}, "Q1.1": {"title": "Các mô hình phát triển phần mềm?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L1</span>.", "answer": "<p>Có các mô hình chính:</p>\n<ul>\n<li><strong>Waterfall:</strong> tuần tự Requirement → Design → Code → Test → Deploy, xong pha trước mới sang pha sau.</li>\n<li><strong>V-Model:</strong> Waterfall mở rộng, mỗi pha thiết kế đi cặp với một mức test (Requirement ↔ Acceptance test, Basic design ↔ System/Integration test, Detail design ↔ Unit test).</li>\n<li><strong>Iterative/Incremental:</strong> chia thành nhiều vòng lặp, mỗi vòng bàn giao thêm một phần.</li>\n<li><strong>Spiral:</strong> lặp theo vòng, tập trung phân tích rủi ro.</li>\n<li><strong>Agile</strong> (Scrum, Kanban, XP): lặp ngắn, bàn giao liên tục, đón nhận thay đổi.</li>\n</ul>", "answerNote": "", "more": "<p>Trong lĩnh vực <strong>automotive</strong>, V-Model rất phổ biến vì gắn với chuẩn <strong>ASPICE / ISO 26262</strong> (truy vết requirement ↔ test). Đây là điểm cộng nếu nói được.</p>", "moreNote": "", "related": "<p>Dự án của bạn dùng mô hình gì? Ưu/nhược của từng mô hình?</p>", "text": "L1 . Có các mô hình chính: Waterfall: tuần tự Requirement → Design → Code → Test → Deploy, xong pha trước mới sang pha sau. V-Model: Waterfall mở rộng, mỗi pha thiết kế đi cặp với một mức test (Requirement ↔ Acceptance test, Basic design ↔ System/Integration test, Detail design ↔ Unit test). Iterative/Incremental: chia thành nhiều vòng lặp, mỗi vòng bàn giao thêm một phần. Spiral: lặp theo vòng, tập trung phân tích rủi ro. Agile (Scrum, Kanban, XP): lặp ngắn, bàn giao liên tục, đón nhận thay đổi. Trong lĩnh vực automotive , V-Model rất phổ biến vì gắn với chuẩn ASPICE / ISO 26262 (truy vết requirement ↔ test). Đây là điểm cộng nếu nói được. Dự án của bạn dùng mô hình gì? Ưu/nhược của từng mô hình?"}, "Q1.2": {"title": "Khi nào dùng Waterfall, khi nào dùng Agile?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L1</span>.", "answer": "<ul>\n<li><strong>Waterfall:</strong> requirement rõ ràng và ổn định, hợp đồng fixed-price, cần tài liệu đầy đủ, có yêu cầu kiểm định/an toàn (automotive, y tế, ngân hàng).</li>\n<li><strong>Agile:</strong> requirement chưa rõ hoặc hay thay đổi, cần ra sản phẩm sớm để lấy feedback, khách hàng tham gia liên tục.</li>\n</ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Tiêu chí</th>\n<th>Waterfall</th>\n<th>Agile</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Requirement</td>\n<td>Cố định từ đầu</td>\n<td>Thay đổi liên tục</td>\n</tr>\n<tr>\n<td>Bàn giao</td>\n<td>Một lần cuối dự án</td>\n<td>Sau mỗi sprint</td>\n</tr>\n<tr>\n<td>Tài liệu</td>\n<td>Nhiều, chi tiết</td>\n<td>Vừa đủ</td>\n</tr>\n<tr>\n<td>Rủi ro</td>\n<td>Phát hiện muộn</td>\n<td>Phát hiện sớm</td>\n</tr>\n<tr>\n<td>Chi phí thay đổi</td>\n<td>Cao</td>\n<td>Thấp</td>\n</tr>\n</tbody>\n</table></div>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L1 . Waterfall: requirement rõ ràng và ổn định, hợp đồng fixed-price, cần tài liệu đầy đủ, có yêu cầu kiểm định/an toàn (automotive, y tế, ngân hàng). Agile: requirement chưa rõ hoặc hay thay đổi, cần ra sản phẩm sớm để lấy feedback, khách hàng tham gia liên tục. Tiêu chí Waterfall Agile Requirement Cố định từ đầu Thay đổi liên tục Bàn giao Một lần cuối dự án Sau mỗi sprint Tài liệu Nhiều, chi tiết Vừa đủ Rủi ro Phát hiện muộn Phát hiện sớm Chi phí thay đổi Cao Thấp"}, "Q1.3": {"title": "Kết hợp Scrum và Waterfall như thế nào?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L1</span>.", "answer": "<p>Dùng mô hình <strong>Hybrid</strong> (còn gọi là <em>Water-Scrum-Fall</em>):</p>\n<ul>\n<li><strong>Waterfall ở cấp tổng thể:</strong> pha Requirement, System design và pha System test / Release cuối cùng chạy tuần tự, có milestone và review gate.</li>\n<li><strong>Scrum ở cấp thực thi:</strong> phần Detail design + Implement + Unit test chia thành các sprint 2–3 tuần.</li>\n</ul>", "answerNote": "", "more": "<p>Kiểu này hay gặp ở công ty Nhật và dự án automotive. Khách hàng cần milestone và tài liệu, còn team dev vẫn muốn linh hoạt.</p>", "moreNote": "", "related": "", "text": "L1 . Dùng mô hình Hybrid (còn gọi là Water-Scrum-Fall ): Waterfall ở cấp tổng thể: pha Requirement, System design và pha System test / Release cuối cùng chạy tuần tự, có milestone và review gate. Scrum ở cấp thực thi: phần Detail design + Implement + Unit test chia thành các sprint 2–3 tuần. Kiểu này hay gặp ở công ty Nhật và dự án automotive. Khách hàng cần milestone và tài liệu, còn team dev vẫn muốn linh hoạt."}, "Q1.4": {"title": "Đặc trưng của Scrum? Khi nào dùng?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L1</span>.", "answer": "<p>Scrum là một framework Agile, làm việc theo <strong>Sprint</strong> cố định 1–4 tuần. Gồm:</p>\n<ul>\n<li><strong>3 vai trò:</strong> Product Owner, Scrum Master, Developers.</li>\n<li><strong>5 sự kiện:</strong> Sprint, Sprint Planning, Daily Scrum (15'), Sprint Review, Sprint Retrospective.</li>\n<li><strong>3 artifact:</strong> Product Backlog, Sprint Backlog, Increment.</li>\n</ul>\n<p>Nên dùng khi requirement thay đổi, team nhỏ (khoảng 3–9 người) và cross-functional, khách hàng sẵn sàng feedback thường xuyên.</p>", "answerNote": "", "more": "<p>Mỗi artifact có một \"commitment\": Product Backlog → <em>Product Goal</em>, Sprint Backlog → <em>Sprint Goal</em>, Increment → <em>Definition of Done</em>.</p>", "moreNote": "", "related": "", "text": "L1 . Scrum là một framework Agile, làm việc theo Sprint cố định 1–4 tuần. Gồm: 3 vai trò: Product Owner, Scrum Master, Developers. 5 sự kiện: Sprint, Sprint Planning, Daily Scrum (15'), Sprint Review, Sprint Retrospective. 3 artifact: Product Backlog, Sprint Backlog, Increment. Nên dùng khi requirement thay đổi, team nhỏ (khoảng 3–9 người) và cross-functional, khách hàng sẵn sàng feedback thường xuyên. Mỗi artifact có một \"commitment\": Product Backlog → Product Goal , Sprint Backlog → Sprint Goal , Increment → Definition of Done ."}, "Q1.5": {"title": "Product Backlog vs Sprint Backlog?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L1</span>.", "answer": "<ul>\n<li><strong>Product Backlog:</strong> danh sách <em>toàn bộ</em> yêu cầu của sản phẩm, do <strong>PO</strong> sở hữu và sắp xếp ưu tiên, thay đổi liên tục.</li>\n<li><strong>Sprint Backlog:</strong> tập con của Product Backlog được chọn cho <em>sprint hiện tại</em>, cộng thêm kế hoạch thực hiện (task). Do <strong>Developers</strong> sở hữu, chốt trong Sprint Planning.</li>\n</ul>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L1 . Product Backlog: danh sách toàn bộ yêu cầu của sản phẩm, do PO sở hữu và sắp xếp ưu tiên, thay đổi liên tục. Sprint Backlog: tập con của Product Backlog được chọn cho sprint hiện tại , cộng thêm kế hoạch thực hiện (task). Do Developers sở hữu, chốt trong Sprint Planning."}, "Q1.6": {"title": "Vai trò của Scrum Master?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L1</span>.", "answer": "<p>Scrum Master là <strong>servant-leader</strong>, không phải manager:</p>\n<ul>\n<li>Đảm bảo team hiểu và áp dụng đúng Scrum.</li>\n<li>Tổ chức (facilitate) các sự kiện Scrum.</li>\n<li><strong>Gỡ bỏ trở ngại (impediment)</strong> cho team.</li>\n<li>Bảo vệ team khỏi tác động bên ngoài trong sprint.</li>\n<li>Hỗ trợ PO quản lý backlog.</li>\n</ul>", "answerNote": "", "more": "", "moreNote": "", "related": "<p>Vai trò PO? SM có giao task không? (Không, Developers tự nhận task.)</p>", "text": "L1 . Scrum Master là servant-leader , không phải manager: Đảm bảo team hiểu và áp dụng đúng Scrum. Tổ chức (facilitate) các sự kiện Scrum. Gỡ bỏ trở ngại (impediment) cho team. Bảo vệ team khỏi tác động bên ngoài trong sprint. Hỗ trợ PO quản lý backlog. Vai trò PO? SM có giao task không? (Không, Developers tự nhận task.)"}, "Q2.1": {"title": "Non-functional requirement là gì?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L2</span>. NFR là input cho HLD.", "answer": "<ul>\n<li><strong>Functional requirement:</strong> hệ thống <em>làm gì</em> (chức năng: đăng nhập, phát nhạc...).</li>\n<li><strong>Non-functional requirement:</strong> hệ thống làm <em>tốt đến mức nào</em>, tức là các thuộc tính chất lượng: <strong>Performance</strong> (thời gian phản hồi, khởi động &lt; 2s), <strong>Reliability/Availability</strong>, <strong>Security</strong>, <strong>Usability</strong>, <strong>Scalability</strong>, <strong>Maintainability</strong>, <strong>Portability</strong>, <strong>Compatibility</strong>.</li>\n</ul>", "answerNote": "", "more": "<p>Tham chiếu chuẩn <strong>ISO/IEC 25010</strong>. Ví dụ trên Android: cold start &lt; 1s, không ANR (main thread không block &gt; 5s), RAM &lt; X MB, hỗ trợ API 26+.</p>", "moreNote": "", "related": "", "text": "L2 . NFR là input cho HLD. Functional requirement: hệ thống làm gì (chức năng: đăng nhập, phát nhạc...). Non-functional requirement: hệ thống làm tốt đến mức nào , tức là các thuộc tính chất lượng: Performance (thời gian phản hồi, khởi động < 2s), Reliability/Availability , Security , Usability , Scalability , Maintainability , Portability , Compatibility . Tham chiếu chuẩn ISO/IEC 25010 . Ví dụ trên Android: cold start < 1s, không ANR (main thread không block > 5s), RAM < X MB, hỗ trợ API 26+."}, "Q2.2": {"title": "High Level Design vs Low Level Design?", "weak": true, "freq": true, "loc": "<span class=\"lref\">L2</span> (HLD) → <span class=\"lref\">L3</span> (LLD).", "answer": "<ul>\n<li><strong>HLD (Basic design):</strong> thiết kế ở mức <strong>hệ thống</strong>: kiến trúc tổng thể, các module/component, giao tiếp giữa chúng, công nghệ, database, luồng dữ liệu chính. Đối tượng đọc: architect, PM, khách hàng.</li>\n<li><strong>LLD (Detail design):</strong> thiết kế ở mức <strong>module/class</strong>: class diagram, sequence diagram, interface, thuật toán, cấu trúc dữ liệu, xử lý lỗi. Đối tượng đọc: developer, và được dùng làm cơ sở viết unit test.</li>\n</ul>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>HLD</th>\n<th>LLD</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Phạm vi</td>\n<td>Toàn hệ thống</td>\n<td>Từng module</td>\n</tr>\n<tr>\n<td>Output</td>\n<td>Architecture/Block diagram, Deployment</td>\n<td>Class/Sequence diagram, pseudo code</td>\n</tr>\n<tr>\n<td>Input</td>\n<td>Requirement + NFR</td>\n<td>HLD</td>\n</tr>\n<tr>\n<td>Test tương ứng (V-Model)</td>\n<td>Integration/System test</td>\n<td>Unit test</td>\n</tr>\n</tbody>\n</table></div>", "answerNote": "", "more": "<blockquote>\n<p><em>\"Thiết kế tính năng X cho app thì làm thế nào?\"</em></p>\n</blockquote>\n<ol>\n<li>Làm rõ requirement + NFR (hỏi lại interviewer).</li>\n<li><strong>HLD:</strong> chia layer (UI – Domain – Data), xác định component (Activity/Fragment, ViewModel, Repository, Service, DB/Network), vẽ block diagram.</li>\n<li><strong>LLD:</strong> định nghĩa class và interface cho từng component, sequence diagram cho luồng chính, xử lý lỗi và edge case.</li>\n<li>Xem lại NFR: thread nào chạy việc gì, cache, bảo mật, test được không.</li>\n</ol>", "moreNote": "câu hỏi tình huống đây là phần từng bị hỏi sâu và chưa trả lời được", "related": "<p>Vẽ HLD cho app nghe nhạc / app chat / app download file? Một module có cần HLD không?</p>", "text": "L2 (HLD) → L3 (LLD). HLD (Basic design): thiết kế ở mức hệ thống : kiến trúc tổng thể, các module/component, giao tiếp giữa chúng, công nghệ, database, luồng dữ liệu chính. Đối tượng đọc: architect, PM, khách hàng. LLD (Detail design): thiết kế ở mức module/class : class diagram, sequence diagram, interface, thuật toán, cấu trúc dữ liệu, xử lý lỗi. Đối tượng đọc: developer, và được dùng làm cơ sở viết unit test. HLD LLD Phạm vi Toàn hệ thống Từng module Output Architecture/Block diagram, Deployment Class/Sequence diagram, pseudo code Input Requirement + NFR HLD Test tương ứng (V-Model) Integration/System test Unit test \"Thiết kế tính năng X cho app thì làm thế nào?\" Làm rõ requirement + NFR (hỏi lại interviewer). HLD: chia layer (UI – Domain – Data), xác định component (Activity/Fragment, ViewModel, Repository, Service, DB/Network), vẽ block diagram. LLD: định nghĩa class và interface cho từng component, sequence diagram cho luồng chính, xử lý lỗi và edge case. Xem lại NFR: thread nào chạy việc gì, cache, bảo mật, test được không. Vẽ HLD cho app nghe nhạc / app chat / app download file? Một module có cần HLD không?"}, "Q2.3": {"title": "Client-Server vs Peer-to-Peer?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L2</span>, kiến trúc hệ thống/mạng.", "answer": "<ul>\n<li><strong>Client-Server:</strong> có server trung tâm cung cấp dịch vụ, client gửi request. Dễ quản lý, bảo mật và đồng bộ dữ liệu, nhưng server là <strong>điểm lỗi duy nhất</strong> và có thể nghẽn. Ví dụ: web, app gọi REST API.</li>\n<li><strong>P2P:</strong> các node ngang hàng, vừa là client vừa là server. Không có điểm lỗi tập trung, scale tốt, nhưng khó quản lý, bảo mật và đồng bộ. Ví dụ: BitTorrent, WebRTC, Wi-Fi Direct.</li>\n</ul>", "answerNote": "", "more": "<p>Trong Android, quan hệ <strong>Bound Service ↔ Client</strong> (AIDL) cũng là mô hình client-server ở mức tiến trình.</p>", "moreNote": "", "related": "<p>Kiến trúc Monolithic vs Microservices? Layered architecture?</p>", "text": "L2 , kiến trúc hệ thống/mạng. Client-Server: có server trung tâm cung cấp dịch vụ, client gửi request. Dễ quản lý, bảo mật và đồng bộ dữ liệu, nhưng server là điểm lỗi duy nhất và có thể nghẽn. Ví dụ: web, app gọi REST API. P2P: các node ngang hàng, vừa là client vừa là server. Không có điểm lỗi tập trung, scale tốt, nhưng khó quản lý, bảo mật và đồng bộ. Ví dụ: BitTorrent, WebRTC, Wi-Fi Direct. Trong Android, quan hệ Bound Service ↔ Client (AIDL) cũng là mô hình client-server ở mức tiến trình. Kiến trúc Monolithic vs Microservices? Layered architecture?"}, "Q3.1": {"title": "SOLID là gì?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L3</span>.", "answer": "<ul>\n<li><strong>S – Single Responsibility:</strong> mỗi class chỉ có <em>một lý do để thay đổi</em>.</li>\n<li><strong>O – Open/Closed:</strong> <em>mở</em> để mở rộng, <em>đóng</em> với sửa đổi. Thêm tính năng bằng cách thêm class mới, không sửa code cũ.</li>\n<li><strong>L – Liskov Substitution:</strong> class con phải thay thế được class cha mà không làm sai hành vi.</li>\n<li><strong>I – Interface Segregation:</strong> nhiều interface nhỏ, chuyên biệt tốt hơn một interface \"béo\".</li>\n<li><strong>D – Dependency Inversion:</strong> module cấp cao không phụ thuộc module cấp thấp; cả hai phụ thuộc vào <strong>abstraction</strong>.</li>\n</ul>", "answerNote": "", "more": "<ul>\n<li>S: <code>Activity</code> chỉ lo UI, logic tách ra <code>ViewModel</code>, data tách ra <code>Repository</code>.</li>\n<li>O: thêm loại thanh toán mới = thêm class <code>PaymentStrategy</code> mới.</li>\n<li>L: <code>Square extends Rectangle</code> vi phạm LSP (setWidth làm thay đổi height).</li>\n<li>I: <code>View.OnClickListener</code>, <code>OnLongClickListener</code> tách riêng.</li>\n<li>D: <code>ViewModel</code> phụ thuộc <code>interface UserRepository</code>, inject qua constructor (Hilt/Dagger).</li>\n</ul>", "moreNote": "ví dụ Android", "related": "<p>Dự án của bạn áp dụng nguyên tắc nào? Ví dụ vi phạm SOLID? DI là gì?</p>", "text": "L3 . S – Single Responsibility: mỗi class chỉ có một lý do để thay đổi . O – Open/Closed: mở để mở rộng, đóng với sửa đổi. Thêm tính năng bằng cách thêm class mới, không sửa code cũ. L – Liskov Substitution: class con phải thay thế được class cha mà không làm sai hành vi. I – Interface Segregation: nhiều interface nhỏ, chuyên biệt tốt hơn một interface \"béo\". D – Dependency Inversion: module cấp cao không phụ thuộc module cấp thấp; cả hai phụ thuộc vào abstraction . S: Activity chỉ lo UI, logic tách ra ViewModel , data tách ra Repository . O: thêm loại thanh toán mới = thêm class PaymentStrategy mới. L: Square extends Rectangle vi phạm LSP (setWidth làm thay đổi height). I: View.OnClickListener , OnLongClickListener tách riêng. D: ViewModel phụ thuộc interface UserRepository , inject qua constructor (Hilt/Dagger). Dự án của bạn áp dụng nguyên tắc nào? Ví dụ vi phạm SOLID? DI là gì?"}, "Q3.2": {"title": "Design pattern là gì? Có mấy loại?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L3</span>.", "answer": "<p>Design pattern là <strong>giải pháp mẫu, đã được kiểm chứng, cho các vấn đề thiết kế hay lặp lại</strong>. Theo GoF có <strong>3 nhóm</strong> (23 pattern):</p>\n<ol>\n<li><strong>Creational (khởi tạo):</strong> Singleton, Factory Method, Abstract Factory, Builder, Prototype.</li>\n<li><strong>Structural (cấu trúc):</strong> Adapter, Decorator, Facade, Proxy, Composite, Bridge, Flyweight.</li>\n<li><strong>Behavioral (hành vi):</strong> Observer, Strategy, Command, State, Template Method, Iterator, Chain of Responsibility, Mediator, Memento, Visitor, Interpreter.</li>\n</ol>", "answerNote": "", "more": "<p>Ngoài GoF còn có <strong>architectural pattern</strong>: MVC, MVP, MVVM, MVI, Clean Architecture.</p>", "moreNote": "", "related": "<p>Bạn đã dùng pattern nào? → Chuẩn bị <strong>3–4 pattern có ví dụ thực tế</strong> trong dự án: Singleton (Repository/DB), Builder (Notification/Retrofit), Observer (LiveData/Flow), Adapter (RecyclerView).</p>", "text": "L3 . Design pattern là giải pháp mẫu, đã được kiểm chứng, cho các vấn đề thiết kế hay lặp lại . Theo GoF có 3 nhóm (23 pattern): Creational (khởi tạo): Singleton, Factory Method, Abstract Factory, Builder, Prototype. Structural (cấu trúc): Adapter, Decorator, Facade, Proxy, Composite, Bridge, Flyweight. Behavioral (hành vi): Observer, Strategy, Command, State, Template Method, Iterator, Chain of Responsibility, Mediator, Memento, Visitor, Interpreter. Ngoài GoF còn có architectural pattern : MVC, MVP, MVVM, MVI, Clean Architecture. Bạn đã dùng pattern nào? → Chuẩn bị 3–4 pattern có ví dụ thực tế trong dự án: Singleton (Repository/DB), Builder (Notification/Retrofit), Observer (LiveData/Flow), Adapter (RecyclerView)."}, "Q3.3": {"title": "Singleton? Singleton trong môi trường multi-thread (thread-safe)?", "weak": true, "freq": true, "loc": "<span class=\"lref\">L3</span> (Creational) → <span class=\"lref\">L5</span> (Concurrency) → <span class=\"lref\">L5</span> (Memory leak).", "answer": "<p>Singleton đảm bảo một class <strong>chỉ có một instance</strong> và cung cấp <strong>điểm truy cập toàn cục</strong>.\nNếu cài đặt kiểu lazy đơn giản (<code>if (instance == null) instance = new ...</code>) thì khi 2 thread cùng kiểm tra <code>null</code> cùng lúc sẽ tạo ra <strong>2 instance</strong>. Các cách làm cho thread-safe:</p>\n<ol>\n<li><strong>Eager initialization:</strong> khởi tạo ngay khi load class.</li>\n<li><strong>synchronized method:</strong> an toàn nhưng chậm, vì lần gọi nào cũng phải lock.</li>\n<li><strong>Double-checked locking + <code>volatile</code>:</strong> chỉ lock lần đầu.</li>\n<li><strong>Bill Pugh (static holder class):</strong> lazy và thread-safe nhờ cơ chế class loading của JVM.</li>\n<li><strong>Enum singleton:</strong> chống được cả reflection và serialization.</li>\n<li><strong>Kotlin <code>object</code>:</strong> thread-safe sẵn (khởi tạo trong static initializer).</li>\n</ol>\n<pre class=\"code\" data-lang=\"java\"><code>public class Db {\nprivate static volatile Db instance;\nprivate Db() {}\npublic static Db getInstance() {\nif (instance == null) { // check 1: không lock\nsynchronized (Db.class) {\nif (instance == null) { // check 2: có lock\ninstance = new Db();\n}\n}\n}\nreturn instance;\n}\n}</code></pre>", "answerNote": "", "more": "<ul>\n<li><strong>Vì sao cần <code>volatile</code>?</strong> <code>new Db()</code> gồm 3 bước (cấp phát → khởi tạo → gán reference) và có thể bị <strong>reorder</strong>. Không có <code>volatile</code> thì thread khác có thể thấy reference khác null nhưng object chưa khởi tạo xong.</li>\n<li>Kotlin: <code>object Db</code> hoặc <code>by lazy { }</code> (mặc định <code>LazyThreadSafetyMode.SYNCHRONIZED</code>).</li>\n<li><strong>Lưu ý Android:</strong> Singleton giữ <code>Activity Context</code> sẽ gây <strong>memory leak</strong>. Chỉ giữ <code>applicationContext</code>.</li>\n<li>Singleton trong <strong>đa tiến trình</strong> (<code>android:process</code>) không còn là duy nhất, vì mỗi process có một instance riêng.</li>\n</ul>", "moreNote": "", "related": "<p>Nhược điểm của Singleton (khó test, global state)? Room database tạo singleton thế nào?</p>", "text": "L3 (Creational) → L5 (Concurrency) → L5 (Memory leak). Singleton đảm bảo một class chỉ có một instance và cung cấp điểm truy cập toàn cục . Nếu cài đặt kiểu lazy đơn giản ( if (instance == null) instance = new ... ) thì khi 2 thread cùng kiểm tra null cùng lúc sẽ tạo ra 2 instance . Các cách làm cho thread-safe: Eager initialization: khởi tạo ngay khi load class. synchronized method: an toàn nhưng chậm, vì lần gọi nào cũng phải lock. Double-checked locking + volatile : chỉ lock lần đầu. Bill Pugh (static holder class): lazy và thread-safe nhờ cơ chế class loading của JVM. Enum singleton: chống được cả reflection và serialization. Kotlin object : thread-safe sẵn (khởi tạo trong static initializer). public class Db { private static volatile Db instance; private Db() {} public static Db getInstance() { if (instance == null) { // check 1: không lock synchronized (Db.class) { if (instance == null) { // check 2: có lock instance = new Db(); } } } return instance; } } Vì sao cần volatile ? new Db() gồm 3 bước (cấp phát → khởi tạo → gán reference) và có thể bị reorder . Không có volatile thì thread khác có thể thấy reference khác null nhưng object chưa khởi tạo xong. Kotlin: object Db hoặc by lazy { } (mặc định LazyThreadSafetyMode.SYNCHRONIZED ). Lưu ý Android: Singleton giữ Activity Context sẽ gây memory leak . Chỉ giữ applicationContext . Singleton trong đa tiến trình ( android:process ) không còn là duy nhất, vì mỗi process có một instance riêng. Nhược điểm của Singleton (khó test, global state)? Room database tạo singleton thế nào?"}, "Q3.4": {"title": "Builder pattern?", "weak": true, "freq": false, "loc": "<span class=\"lref\">L3</span> (Creational).", "answer": "<p>Builder <strong>tách quá trình xây dựng một object phức tạp khỏi biểu diễn của nó</strong>, cho phép tạo object <strong>từng bước</strong> với nhiều tham số tùy chọn. Phương thức <code>build()</code> mới thực sự tạo object (thường qua một <em>private constructor</em> nhận vào Builder).</p>\n<p>Builder giải quyết vấn đề <strong>telescoping constructor</strong> (quá nhiều constructor overload, nhiều tham số dễ truyền nhầm thứ tự) và giúp tạo <strong>object immutable</strong>, đồng thời có thể <strong>validate</strong> trong <code>build()</code>.</p>\n<pre class=\"code\" data-lang=\"kotlin\"><code>val client = OkHttpClient.Builder()\n.connectTimeout(10, TimeUnit.SECONDS)\n.addInterceptor(logging)\n.build()</code></pre>", "answerNote": "", "more": "<ul>\n<li>Lần trước trả lời chưa tốt vì chỉ nói \"tạo đối tượng thông qua constructor\". Điểm mấu chốt cần nói là: <em>từng bước, tham số tùy chọn, method chaining, <code>build()</code> trả về object hoàn chỉnh/immutable</em>.</li>\n<li>Ví dụ Android: <code>AlertDialog.Builder</code>, <code>NotificationCompat.Builder</code>, <code>Retrofit.Builder</code>, <code>Room.databaseBuilder</code>.</li>\n<li>Kotlin có <strong>named + default arguments</strong> nên nhiều trường hợp không cần Builder.</li>\n</ul>", "moreNote": "", "related": "<p>Builder khác Factory thế nào? (Factory: <em>tạo loại object nào</em>; Builder: <em>tạo object như thế nào, từng bước</em>.)</p>", "text": "L3 (Creational). Builder tách quá trình xây dựng một object phức tạp khỏi biểu diễn của nó , cho phép tạo object từng bước với nhiều tham số tùy chọn. Phương thức build() mới thực sự tạo object (thường qua một private constructor nhận vào Builder). Builder giải quyết vấn đề telescoping constructor (quá nhiều constructor overload, nhiều tham số dễ truyền nhầm thứ tự) và giúp tạo object immutable , đồng thời có thể validate trong build() . val client = OkHttpClient.Builder() .connectTimeout(10, TimeUnit.SECONDS) .addInterceptor(logging) .build() Lần trước trả lời chưa tốt vì chỉ nói \"tạo đối tượng thông qua constructor\". Điểm mấu chốt cần nói là: từng bước, tham số tùy chọn, method chaining, build() trả về object hoàn chỉnh/immutable . Ví dụ Android: AlertDialog.Builder , NotificationCompat.Builder , Retrofit.Builder , Room.databaseBuilder . Kotlin có named + default arguments nên nhiều trường hợp không cần Builder. Builder khác Factory thế nào? (Factory: tạo loại object nào ; Builder: tạo object như thế nào, từng bước .)"}, "Q3.5": {"title": "Adapter pattern?", "weak": true, "freq": false, "loc": "<span class=\"lref\">L3</span> (Structural).", "answer": "<p>Adapter <strong>chuyển đổi interface của một class thành interface khác mà client mong đợi</strong>, giúp các class có interface không tương thích làm việc được với nhau. Giống như cục chuyển đổi ổ cắm điện.</p>\n<p>Thành phần: <strong>Target</strong> (interface client cần), <strong>Adaptee</strong> (class có sẵn, interface khác), <strong>Adapter</strong> (implement Target, bên trong gọi Adaptee).</p>\n<pre class=\"code\" data-lang=\"kotlin\"><code>interface MediaPlayer { fun play(file: String) } // Target\nclass VlcLib { fun playVlc(path: String) { } } // Adaptee\nclass VlcAdapter(private val vlc: VlcLib) : MediaPlayer { // Adapter\noverride fun play(file: String) = vlc.playVlc(file)\n}</code></pre>", "answerNote": "", "more": "<ul>\n<li>2 kiểu: <strong>Object adapter</strong> (composition, phổ biến) và <strong>Class adapter</strong> (kế thừa).</li>\n<li><code>RecyclerView.Adapter</code>: chuyển <strong>dữ liệu (List)</strong> thành <strong>View (ViewHolder)</strong> mà RecyclerView cần.</li>\n<li>Phân biệt: <strong>Adapter</strong> đổi interface; <strong>Decorator</strong> giữ nguyên interface và thêm hành vi; <strong>Facade</strong> gom nhiều interface thành một interface đơn giản; <strong>Proxy</strong> giữ nguyên interface và kiểm soát truy cập.</li>\n</ul>", "moreNote": "", "related": "", "text": "L3 (Structural). Adapter chuyển đổi interface của một class thành interface khác mà client mong đợi , giúp các class có interface không tương thích làm việc được với nhau. Giống như cục chuyển đổi ổ cắm điện. Thành phần: Target (interface client cần), Adaptee (class có sẵn, interface khác), Adapter (implement Target, bên trong gọi Adaptee). interface MediaPlayer { fun play(file: String) } // Target class VlcLib { fun playVlc(path: String) { } } // Adaptee class VlcAdapter(private val vlc: VlcLib) : MediaPlayer { // Adapter override fun play(file: String) = vlc.playVlc(file) } 2 kiểu: Object adapter (composition, phổ biến) và Class adapter (kế thừa). RecyclerView.Adapter : chuyển dữ liệu (List) thành View (ViewHolder) mà RecyclerView cần. Phân biệt: Adapter đổi interface; Decorator giữ nguyên interface và thêm hành vi; Facade gom nhiều interface thành một interface đơn giản; Proxy giữ nguyên interface và kiểm soát truy cập."}, "Q3.6": {"title": "Observer pattern / Vai trò của Observer? Observable, LiveData?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L3</span> (Behavioral) → <span class=\"lref\">L5</span> (Reactive) → <span class=\"lref\">L6</span> (Lifecycle).", "answer": "<p>Observer định nghĩa quan hệ <strong>một–nhiều</strong>: khi <strong>Subject</strong> thay đổi trạng thái thì tất cả <strong>Observer</strong> đã đăng ký được <strong>thông báo tự động</strong>.\nVai trò: <strong>giảm phụ thuộc (decoupling)</strong>. Subject không cần biết observer cụ thể là ai, chỉ cần biết interface.</p>", "answerNote": "", "more": "<ul>\n<li><strong>LiveData:</strong> observable data holder <strong>lifecycle-aware</strong>. Chỉ notify khi observer ở trạng thái STARTED/RESUMED, tự gỡ đăng ký khi DESTROYED nên tránh được leak và crash.</li>\n<li><strong>StateFlow/SharedFlow (Kotlin Flow):</strong> thay thế LiveData trong code mới; không phụ thuộc Android, có operator, dùng <code>repeatOnLifecycle</code> để an toàn lifecycle.</li>\n<li>Nhược điểm của Observer: quên unregister thì gây leak; thứ tự notify không đảm bảo.</li>\n</ul>", "moreNote": "", "related": "<p>LiveData vs StateFlow? <code>setValue</code> vs <code>postValue</code>? → Reactive programming (<a class=\"qref\" href=\"#\" data-q=\"Q5.7\">Q5.7</a>).</p>", "text": "L3 (Behavioral) → L5 (Reactive) → L6 (Lifecycle). Observer định nghĩa quan hệ một–nhiều : khi Subject thay đổi trạng thái thì tất cả Observer đã đăng ký được thông báo tự động . Vai trò: giảm phụ thuộc (decoupling) . Subject không cần biết observer cụ thể là ai, chỉ cần biết interface. LiveData: observable data holder lifecycle-aware . Chỉ notify khi observer ở trạng thái STARTED/RESUMED, tự gỡ đăng ký khi DESTROYED nên tránh được leak và crash. StateFlow/SharedFlow (Kotlin Flow): thay thế LiveData trong code mới; không phụ thuộc Android, có operator, dùng repeatOnLifecycle để an toàn lifecycle. Nhược điểm của Observer: quên unregister thì gây leak; thứ tự notify không đảm bảo. LiveData vs StateFlow? setValue vs postValue ? → Reactive programming ( Q5.7 )."}, "Q3.7": {"title": "Các pattern khác nên chuẩn bị", "weak": false, "freq": false, "loc": "<span class=\"lref\">L3</span>.", "answer": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Pattern</th>\n<th>Một câu định nghĩa</th>\n<th>Ví dụ Android</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Factory Method</td>\n<td>Subclass quyết định tạo object loại nào</td>\n<td><code>ViewModelProvider.Factory</code>, <code>Fragment.newInstance()</code></td>\n</tr>\n<tr>\n<td>Strategy</td>\n<td>Đóng gói các thuật toán thay thế cho nhau</td>\n<td><code>Interpolator</code>, <code>LayoutManager</code> của RecyclerView</td>\n</tr>\n<tr>\n<td>Facade</td>\n<td>Một interface đơn giản cho hệ thống con phức tạp</td>\n<td><code>Repository</code> gom DB + Network</td>\n</tr>\n<tr>\n<td>Decorator</td>\n<td>Thêm hành vi động mà không sửa class</td>\n<td><code>ContextWrapper</code>, OkHttp <code>Interceptor</code> chain</td>\n</tr>\n<tr>\n<td>Proxy</td>\n<td>Đại diện để kiểm soát truy cập object thật</td>\n<td>AIDL <code>Stub.Proxy</code>, Retrofit dynamic proxy</td>\n</tr>\n<tr>\n<td>Command</td>\n<td>Đóng gói request thành object</td>\n<td><code>Runnable</code> gửi vào <code>Handler</code>, WorkManager <code>WorkRequest</code></td>\n</tr>\n<tr>\n<td>State</td>\n<td>Hành vi thay đổi theo trạng thái nội tại</td>\n<td>State machine của MediaPlayer</td>\n</tr>\n<tr>\n<td>Template Method</td>\n<td>Khung thuật toán ở class cha, bước cụ thể ở class con</td>\n<td>Lifecycle <code>onCreate/onStart...</code> của Activity</td>\n</tr>\n</tbody>\n</table></div>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L3 . Pattern Một câu định nghĩa Ví dụ Android Factory Method Subclass quyết định tạo object loại nào ViewModelProvider.Factory , Fragment.newInstance() Strategy Đóng gói các thuật toán thay thế cho nhau Interpolator , LayoutManager của RecyclerView Facade Một interface đơn giản cho hệ thống con phức tạp Repository gom DB + Network Decorator Thêm hành vi động mà không sửa class ContextWrapper , OkHttp Interceptor chain Proxy Đại diện để kiểm soát truy cập object thật AIDL Stub.Proxy , Retrofit dynamic proxy Command Đóng gói request thành object Runnable gửi vào Handler , WorkManager WorkRequest State Hành vi thay đổi theo trạng thái nội tại State machine của MediaPlayer Template Method Khung thuật toán ở class cha, bước cụ thể ở class con Lifecycle onCreate/onStart... của Activity"}, "Q3.8": {"title": "UML là gì? Các mối quan hệ trong Class diagram?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L3</span>, ngôn ngữ trình bày thiết kế (LLD).", "answer": "<p>UML (Unified Modeling Language) là ngôn ngữ mô hình hóa chuẩn để mô tả thiết kế. Gồm 2 nhóm: <strong>Structure diagram</strong> (Class, Component, Deployment, Package...) và <strong>Behavior diagram</strong> (Use case, Sequence, Activity, State machine...).</p>\n<p><strong>6 quan hệ trong Class diagram</strong> (từ yếu đến mạnh):</p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Quan hệ</th>\n<th>Ý nghĩa</th>\n<th>Ký hiệu</th>\n<th>Ví dụ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Dependency</strong></td>\n<td>\"dùng tạm\" (tham số, biến cục bộ)</td>\n<td><code>- - - -&gt;</code> nét đứt, mũi tên mở</td>\n<td><code>Activity</code> dùng <code>Intent</code></td>\n</tr>\n<tr>\n<td><strong>Association</strong></td>\n<td>\"biết về / có liên kết\" (field)</td>\n<td><code>———&gt;</code> nét liền</td>\n<td><code>Driver</code> – <code>Car</code></td>\n</tr>\n<tr>\n<td><strong>Aggregation</strong></td>\n<td>\"has-a\", phần <strong>sống độc lập</strong> với tổng thể</td>\n<td><code>◇———</code> thoi rỗng</td>\n<td><code>Team</code> ◇— <code>Player</code></td>\n</tr>\n<tr>\n<td><strong>Composition</strong></td>\n<td>\"has-a\", phần <strong>chết cùng</strong> tổng thể</td>\n<td><code>◆———</code> thoi đặc</td>\n<td><code>House</code> ◆— <code>Room</code></td>\n</tr>\n<tr>\n<td><strong>Generalization</strong></td>\n<td>Kế thừa (extends)</td>\n<td><code>———▷</code> nét liền, tam giác rỗng</td>\n<td><code>Dog</code> → <code>Animal</code></td>\n</tr>\n<tr>\n<td><strong>Realization</strong></td>\n<td>Implement interface</td>\n<td><code>- - -▷</code> nét đứt, tam giác rỗng</td>\n<td><code>UserRepoImpl</code> → <code>UserRepo</code></td>\n</tr>\n</tbody>\n</table></div>", "answerNote": "", "more": "<ul>\n<li>Visibility: <code>+</code> public, <code>-</code> private, <code>#</code> protected, <code>~</code> package/internal.</li>\n<li>Multiplicity: <code>1</code>, <code>0..1</code>, <code></code>, <code>1..</code>.</li>\n<li>Static thì gạch chân; abstract thì in nghiêng hoặc ghi <code>&lt;&lt;abstract&gt;&gt;</code>; interface ghi <code>&lt;&lt;interface&gt;&gt;</code>.</li>\n</ul>", "moreNote": "", "related": "<p>Aggregation vs Composition khác gì? Vẽ class diagram cho bài toán X?</p>", "text": "L3 , ngôn ngữ trình bày thiết kế (LLD). UML (Unified Modeling Language) là ngôn ngữ mô hình hóa chuẩn để mô tả thiết kế. Gồm 2 nhóm: Structure diagram (Class, Component, Deployment, Package...) và Behavior diagram (Use case, Sequence, Activity, State machine...). 6 quan hệ trong Class diagram (từ yếu đến mạnh): Quan hệ Ý nghĩa Ký hiệu Ví dụ Dependency \"dùng tạm\" (tham số, biến cục bộ) - - - -> nét đứt, mũi tên mở Activity dùng Intent Association \"biết về / có liên kết\" (field) ———> nét liền Driver – Car Aggregation \"has-a\", phần sống độc lập với tổng thể ◇——— thoi rỗng Team ◇— Player Composition \"has-a\", phần chết cùng tổng thể ◆——— thoi đặc House ◆— Room Generalization Kế thừa (extends) ———▷ nét liền, tam giác rỗng Dog → Animal Realization Implement interface - - -▷ nét đứt, tam giác rỗng UserRepoImpl → UserRepo Visibility: + public, - private, # protected, ~ package/internal. Multiplicity: 1 , 0..1 , * , 1..* . Static thì gạch chân; abstract thì in nghiêng hoặc ghi <<abstract>> ; interface ghi <<interface>> . Aggregation vs Composition khác gì? Vẽ class diagram cho bài toán X?"}, "Q3.9": {"title": "Extension function có biểu diễn được trên class diagram không?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L3</span> (UML) ↔ <span class=\"lref\">L4</span> (Kotlin).", "answer": "<p>UML <strong>không có ký hiệu chuẩn</strong> cho extension function. Bản chất extension function <strong>không thay đổi class gốc</strong>: nó được compile thành <strong>static method</strong> trong một class file (ví dụ <code>StringExtKt</code>) nhận receiver làm tham số đầu tiên. Cách biểu diễn thường dùng:</p>\n<ul>\n<li>Vẽ class tiện ích <code>StringExt</code> với stereotype <code>&lt;&lt;extension&gt;&gt;</code> chứa method static, và một <strong>dependency</strong> (nét đứt) trỏ tới class được mở rộng; hoặc</li>\n<li>Ghi chú (note) bên cạnh class gốc.</li>\n</ul>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L3 (UML) ↔ L4 (Kotlin). UML không có ký hiệu chuẩn cho extension function. Bản chất extension function không thay đổi class gốc : nó được compile thành static method trong một class file (ví dụ StringExtKt ) nhận receiver làm tham số đầu tiên. Cách biểu diễn thường dùng: Vẽ class tiện ích StringExt với stereotype <<extension>> chứa method static, và một dependency (nét đứt) trỏ tới class được mở rộng; hoặc Ghi chú (note) bên cạnh class gốc."}, "Q3.10": {"title": "Các thành phần của Sequence diagram?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L3</span>, mô tả luồng tương tác theo thời gian (LLD).", "answer": "<ul>\n<li><strong>Actor:</strong> người dùng/hệ thống bên ngoài.</li>\n<li><strong>Lifeline:</strong> đối tượng tham gia, có đường nét đứt theo trục thời gian dọc.</li>\n<li><strong>Activation bar:</strong> hình chữ nhật trên lifeline, thể hiện thời gian object đang xử lý.</li>\n<li><strong>Message:</strong><ul>\n<li>Synchronous: mũi tên liền, đầu đặc (chờ kết quả).</li>\n<li>Asynchronous: mũi tên liền, đầu mở (không chờ).</li>\n<li>Return: mũi tên nét đứt.</li>\n<li>Self message, Create message, Destroy (dấu X).</li>\n</ul>\n</li>\n<li><strong>Combined fragment:</strong> <code>alt</code> (if/else), <code>opt</code> (if), <code>loop</code>, <code>par</code> (song song), <code>break</code>, <code>ref</code> (tham chiếu diagram khác).</li>\n</ul>", "answerNote": "", "more": "", "moreNote": "", "related": "<p>Vẽ sequence diagram cho luồng login / bind service? Sequence vs Activity diagram? (Sequence: tương tác giữa các object theo thời gian. Activity: luồng công việc/quy trình, giống flowchart.)</p>", "text": "L3 , mô tả luồng tương tác theo thời gian (LLD). Actor: người dùng/hệ thống bên ngoài. Lifeline: đối tượng tham gia, có đường nét đứt theo trục thời gian dọc. Activation bar: hình chữ nhật trên lifeline, thể hiện thời gian object đang xử lý. Message: Synchronous: mũi tên liền, đầu đặc (chờ kết quả). Asynchronous: mũi tên liền, đầu mở (không chờ). Return: mũi tên nét đứt. Self message, Create message, Destroy (dấu X). Combined fragment: alt (if/else), opt (if), loop , par (song song), break , ref (tham chiếu diagram khác). Vẽ sequence diagram cho luồng login / bind service? Sequence vs Activity diagram? (Sequence: tương tác giữa các object theo thời gian. Activity: luồng công việc/quy trình, giống flowchart.)"}, "Q4.1": {"title": "Đa hình trong lập trình hướng đối tượng? Override vs Overload?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L4</span> (OOP) → nền tảng của <span class=\"lref\">L3</span> (Strategy, DIP).", "answer": "<p>Đa hình (Polymorphism) là <strong>cùng một lời gọi nhưng hành vi khác nhau tùy theo đối tượng</strong>. Có 2 loại:</p>\n<ul>\n<li><strong>Compile-time (static) polymorphism = Overload:</strong> cùng tên method, <strong>khác tham số</strong> (số lượng/kiểu/thứ tự) trong cùng class. Compiler chọn method lúc biên dịch.</li>\n<li><strong>Runtime (dynamic) polymorphism = Override:</strong> class con <strong>định nghĩa lại</strong> method của class cha với cùng signature. JVM chọn method theo <strong>kiểu thực của object</strong> lúc chạy (dynamic dispatch).</li>\n</ul>\n<pre class=\"code\" data-lang=\"java\"><code>Animal a = new Dog();\na.speak(); // gọi Dog.speak() → runtime polymorphism</code></pre>", "answerNote": "", "more": "<ul>\n<li>Cùng tên, cùng tham số; kiểu trả về giống hoặc là kiểu con (covariant).</li>\n<li>Access modifier không được hẹp hơn method cha.</li>\n<li>Không override được <code>static</code> (chỉ bị <em>hide</em>), <code>final</code>, <code>private</code>.</li>\n<li>Kotlin: method mặc định <code>final</code>, phải khai báo <code>open</code> thì mới override được, và bắt buộc có từ khóa <code>override</code>.</li>\n<li><strong>Overload chỉ khác kiểu trả về thì không hợp lệ.</strong></li>\n</ul>", "moreNote": "quy tắc Override", "related": "<p>4 tính chất OOP (Encapsulation, Inheritance, Polymorphism, Abstraction)? Static method có override được không?</p>", "text": "L4 (OOP) → nền tảng của L3 (Strategy, DIP). Đa hình (Polymorphism) là cùng một lời gọi nhưng hành vi khác nhau tùy theo đối tượng . Có 2 loại: Compile-time (static) polymorphism = Overload: cùng tên method, khác tham số (số lượng/kiểu/thứ tự) trong cùng class. Compiler chọn method lúc biên dịch. Runtime (dynamic) polymorphism = Override: class con định nghĩa lại method của class cha với cùng signature. JVM chọn method theo kiểu thực của object lúc chạy (dynamic dispatch). Animal a = new Dog(); a.speak(); // gọi Dog.speak() → runtime polymorphism Cùng tên, cùng tham số; kiểu trả về giống hoặc là kiểu con (covariant). Access modifier không được hẹp hơn method cha. Không override được static (chỉ bị hide ), final , private . Kotlin: method mặc định final , phải khai báo open thì mới override được, và bắt buộc có từ khóa override . Overload chỉ khác kiểu trả về thì không hợp lệ. 4 tính chất OOP (Encapsulation, Inheritance, Polymorphism, Abstraction)? Static method có override được không?"}, "Q4.2": {"title": "Abstract class vs Interface? Khi nào dùng cái nào?", "weak": true, "freq": true, "loc": "<span class=\"lref\">L4</span> → áp dụng ở <span class=\"lref\">L3</span> (ISP, DIP, Template Method).", "answer": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Abstract class</th>\n<th>Interface</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Ý nghĩa</td>\n<td>\"<strong>is-a</strong>\", là bản thiết kế chung</td>\n<td>\"<strong>can-do</strong>\", là hợp đồng/khả năng</td>\n</tr>\n<tr>\n<td>Kế thừa</td>\n<td>Chỉ <strong>extends 1</strong> class</td>\n<td><strong>implements nhiều</strong> interface</td>\n</tr>\n<tr>\n<td>State (field)</td>\n<td>Có field instance, có constructor</td>\n<td>Chỉ có hằng số <code>public static final</code> (Kotlin: property không có backing field)</td>\n</tr>\n<tr>\n<td>Method</td>\n<td>Abstract + method có thân</td>\n<td>Abstract + <code>default</code>/<code>static</code> (Java 8+), <code>private</code> (Java 9+)</td>\n</tr>\n<tr>\n<td>Access modifier</td>\n<td>Bất kỳ</td>\n<td>Mặc định <code>public</code></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Khi nào dùng:</strong></p>\n<ul>\n<li><strong>Abstract class:</strong> các class con <strong>cùng bản chất</strong>, cần <strong>chia sẻ code và state chung</strong>, muốn đưa ra khung xử lý (Template Method). Ví dụ: <code>BaseActivity</code>, <code>BaseViewModel</code>.</li>\n<li><strong>Interface:</strong> định nghĩa <strong>khả năng</strong> mà nhiều class không liên quan có thể có, cần <strong>đa kế thừa</strong>, muốn <strong>tách phụ thuộc</strong> (DIP, mock trong test). Ví dụ: <code>OnClickListener</code>, <code>UserRepository</code>.</li>\n</ul>", "answerNote": "", "more": "<ul>\n<li><em>\"Thêm method mới vào interface mà không làm hỏng các class đang implement?\"</em> Dùng <strong>default method</strong>.</li>\n<li><em>\"Nếu cả abstract class và interface đều có thể dùng?\"</em> Ưu tiên <strong>interface</strong> (linh hoạt hơn, composition over inheritance). Cần chia sẻ state thì kết hợp: interface + abstract class implement một phần (ví dụ <code>List</code> + <code>AbstractList</code>).</li>\n</ul>", "moreNote": "tình huống hay hỏi", "related": "", "text": "L4 → áp dụng ở L3 (ISP, DIP, Template Method). Abstract class Interface Ý nghĩa \" is-a \", là bản thiết kế chung \" can-do \", là hợp đồng/khả năng Kế thừa Chỉ extends 1 class implements nhiều interface State (field) Có field instance, có constructor Chỉ có hằng số public static final (Kotlin: property không có backing field) Method Abstract + method có thân Abstract + default / static (Java 8+), private (Java 9+) Access modifier Bất kỳ Mặc định public Khi nào dùng: Abstract class: các class con cùng bản chất , cần chia sẻ code và state chung , muốn đưa ra khung xử lý (Template Method). Ví dụ: BaseActivity , BaseViewModel . Interface: định nghĩa khả năng mà nhiều class không liên quan có thể có, cần đa kế thừa , muốn tách phụ thuộc (DIP, mock trong test). Ví dụ: OnClickListener , UserRepository . \"Thêm method mới vào interface mà không làm hỏng các class đang implement?\" Dùng default method . \"Nếu cả abstract class và interface đều có thể dùng?\" Ưu tiên interface (linh hoạt hơn, composition over inheritance). Cần chia sẻ state thì kết hợp: interface + abstract class implement một phần (ví dụ List + AbstractList )."}, "Q4.3": {"title": "Khi nào không cần override method trong interface?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L4</span>.", "answer": "<ol>\n<li>Method đó là <strong><code>default</code> method</strong> (Java 8+) hoặc có thân sẵn trong interface (Kotlin).</li>\n<li>Method là <strong><code>static</code></strong> trong interface.</li>\n<li>Class implement là <strong>abstract class</strong>: có thể để lại cho class con cụ thể implement.</li>\n<li>Method đã được <strong>implement sẵn ở class cha</strong> mà class hiện tại kế thừa.</li>\n</ol>", "answerNote": "", "more": "<p>Nếu 2 interface có cùng <code>default</code> method trùng signature thì class implement <strong>bắt buộc override</strong> để giải quyết xung đột (Java gọi <code>A.super.foo()</code>, Kotlin gọi <code>super&lt;A&gt;.foo()</code>).</p>", "moreNote": "", "related": "", "text": "L4 . Method đó là default method (Java 8+) hoặc có thân sẵn trong interface (Kotlin). Method là static trong interface. Class implement là abstract class : có thể để lại cho class con cụ thể implement. Method đã được implement sẵn ở class cha mà class hiện tại kế thừa. Nếu 2 interface có cùng default method trùng signature thì class implement bắt buộc override để giải quyết xung đột (Java gọi A.super.foo() , Kotlin gọi super<A>.foo() )."}, "Q4.4": {"title": "Access modifier?", "weak": false, "freq": true, "loc": "<span class=\"lref\">L4</span> → Encapsulation, thiết kế API module (<span class=\"lref\">L3</span>).", "answer": "<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Java</th>\n<th>Cùng class</th>\n<th>Cùng package</th>\n<th>Subclass</th>\n<th>Mọi nơi</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>private</code></td>\n<td>✅</td>\n<td>❌</td>\n<td>❌</td>\n<td>❌</td>\n</tr>\n<tr>\n<td><em>default</em> (package-private)</td>\n<td>✅</td>\n<td>✅</td>\n<td>❌ (khác package)</td>\n<td>❌</td>\n</tr>\n<tr>\n<td><code>protected</code></td>\n<td>✅</td>\n<td>✅</td>\n<td>✅</td>\n<td>❌</td>\n</tr>\n<tr>\n<td><code>public</code></td>\n<td>✅</td>\n<td>✅</td>\n<td>✅</td>\n<td>✅</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Kotlin:</strong> <code>public</code> (<strong>mặc định</strong>), <code>internal</code> (trong cùng <strong>module</strong>), <code>protected</code> (chỉ class con, <strong>không</strong> có quyền theo package), <code>private</code> (trong class; nếu top-level thì trong <strong>file</strong>).</p>", "answerNote": "", "more": "", "moreNote": "", "related": "", "text": "L4 → Encapsulation, thiết kế API module ( L3 ). Java Cùng class Cùng package Subclass Mọi nơi private ✅ ❌ ❌ ❌ default (package-private) ✅ ✅ ❌ (khác package) ❌ protected ✅ ✅ ✅ ❌ public ✅ ✅ ✅ ✅ Kotlin: public ( mặc định ), internal (trong cùng module ), protected (chỉ class con, không có quyền theo package), private (trong class; nếu top-level thì trong file )."}, "Q4.5": {"title": "static / final? Có cách nào thay đổi giá trị biến final không?", "weak": false, "freq": false, "loc": "<span class=\"lref\">L4</span> → <span class=\"lref\">L5</span> (immutable thì thread-safe).", "answer": "<ul>\n<li><strong>static:</strong> thuộc về <strong>class</strong>, không thuộc instance; dùng chung cho mọi object; khởi tạo khi class được load.</li>\n<li><strong>final:</strong><ul>\n<li>biến: <strong>không gán lại</strong> được (với reference thì <em>object bên trong vẫn sửa được</em>);</li>\n<li>method: <strong>không override</strong> được;</li>\n<li>class: <strong>không kế thừa</strong> được (ví dụ <code>String</code>).</li>\n</ul>\n</li>\n</ul>\n<p><strong>Thay đổi biến final?</strong></p>\n<ul>\n<li>Bình thường thì <strong>không</strong>.</li>\n<li>Nếu là <strong>reference</strong> thì vẫn thay đổi được <em>nội dung object</em> (ví dụ <code>final List</code> vẫn <code>add()</code> được).</li>\n<li>Dùng <strong>Reflection</strong> (<code>field.setAccessible(true); field.set(obj, v)</code>) có thể sửa <strong>instance final field</strong>. Nhưng:<ul>\n<li><strong>Compile-time constant</strong> (<code>static final int X = 5</code>, Kotlin <code>const val</code>) bị compiler <strong>inline</strong> vào chỗ dùng nên sửa cũng vô tác dụng.</li>\n<li><code>static final</code> từ Java 12+ gần như không sửa được bằng reflection.</li>\n</ul>\n</li>\n</ul>", "answerNote": "", "more": "<p>class/method mặc định <code>final</code> (muốn kế thừa phải <code>open</code>); <code>val</code> ≈ final; <code>const val</code> là hằng compile-time; <code>companion object</code> + <code>@JvmStatic</code> ≈ static.</p>", "moreNote": "Kotlin", "related": "", "text": "L4 → L5 (immutable thì thread-safe). static: thuộc về class , không thuộc instance; dùng chung cho mọi object; khởi tạo khi class được load. final: biến: không gán lại được (với reference thì object bên trong vẫn sửa được ); method: không override được; class: không kế thừa được (ví dụ String ). Thay đổi biến final? Bình thường thì không . Nếu là reference thì vẫn thay đổi được nội dung object (ví dụ final List vẫn add() được). Dùng Reflection ( field.setAccessible(true); field.set(obj, v) ) có thể sửa instance final field . Nhưng: Compile-time constant ( static final int X = 5 , Kotlin const val ) bị compiler inline vào chỗ dùng nên sửa cũng vô tác dụng. static final từ Java 12+ gần như không sửa được bằng reflection. class/method mặc đ
